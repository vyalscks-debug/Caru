name: Send Routine Push Notification

on:
  schedule:
    # 매 10분마다 자동 실행 (GitHub Actions 무료 스케줄러 최소 단위)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 테스트용 수동 실행 버튼

jobs:
  run-routine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run routine script
        env:
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
        run: node send_routine.js
