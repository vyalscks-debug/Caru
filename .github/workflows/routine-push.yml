name: Caru Routine Push Scheduler

on:
  schedule:
    # 15분마다 자동 실행 (GitHub Actions 무료 cron 스케줄러)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Actions 탭에서 수동으로 테스트 실행해볼 수 있는 버튼 생성

jobs:
  check-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: firebase-admin 설치
        run: npm install firebase-admin

      - name: 루틴 알림 체크 및 전송
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send_routine.js
