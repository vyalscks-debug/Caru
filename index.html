<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Caru" />
<meta name="theme-color" content="#fbfaf8" />
<link rel="manifest" href="manifest.json" />
<title>Caru - Human Battery</title>

<!-- Firebase App & Database (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --ink:#151515; --paper:#fbfaf8; --muted:#8f8a82; --faint:#e4dfd6;
    --hover:#f2efe9; --band:#efece5; --divider:#e6e1d8;
    --batt-warn:#c2410c;
  }
  html[data-theme="dark"]{
    --ink:#f3f1ec; --paper:#121110; --muted:#8a8378; --faint:#332f2a;
    --hover:#1d1b18; --band:#1e1c19; --divider:#2c2925;
    --batt-warn:#f97316;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; -webkit-font-smoothing:antialiased;
    transition:background 0.15s ease, color 0.15s ease;
  }
  #root{ 
    max-width:400px; margin:0 auto; 
    padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 80px); 
    min-height:100vh; 
  }

  /* 상단 탑바 */
  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  .top-left{ display:flex; align-items:center; gap:8px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  .theme-toggle{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:5px 11px; border-radius:12px; cursor:pointer; }
  .notify-btn{ border:1px dashed var(--muted); background:none; color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:10px; padding:3px 8px; border-radius:8px; cursor:pointer; }
  .notify-btn.on{ border-style:solid; border-color:var(--ink); color:var(--ink); font-weight:600; }

  /* 2개 탭 (Home vs Progress) */
  .tabs{ display:flex; gap:24px; margin-bottom:32px; border-bottom:1px solid var(--divider); }
  .tab-btn{ background:none; border:none; cursor:pointer; padding:0 0 10px; font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:0.05em; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); font-weight:700; }

  /* ================= 1. 홈 탭 (극도의 미니멀리즘) ================= */
  .home-center{ display:flex; flex-direction:column; align-items:center; margin:10px 0 32px; }
  .home-status-title{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .home-battery-num{ font-family:'Space Grotesk', sans-serif; font-size:56px; font-weight:700; letter-spacing:-0.03em; line-height:1; margin-bottom:20px; }

  /* 배터리 본체 (직접 터치 & 드래그 가능) */
  .battery-touch-wrap{
    width:100%; display:flex; align-items:center; justify-content:center; gap:5px;
    touch-action:none; user-select:none; cursor:pointer; padding:6px 0;
  }
  .battery-touch-shell{
    flex:1; height:46px; border:2.5px solid var(--ink); border-radius:12px;
    padding:3px; background:var(--paper); position:relative; overflow:hidden;
  }
  .battery-touch-fill{
    height:100%; border-radius:7px; background:var(--ink);
    transition:width 0.1s ease; pointer-events:none;
  }
  .battery-touch-cap{
    width:6px; height:18px; background:var(--ink); border-radius:0 4px 4px 0; flex:none;
  }

  .battery-hint{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); margin-top:12px; }

  /* Charge / Drain 메인 버튼 2개 */
  .action-btn-row{ display:flex; gap:12px; margin-top:24px; width:100%; }
  .hero-btn{
    flex:1; padding:15px 10px; border-radius:14px; font-family:'JetBrains Mono', monospace;
    font-size:13px; font-weight:700; cursor:pointer; transition:transform .1s, opacity .15s;
    text-align:center;
  }
  .hero-btn:active{ transform:scale(0.97); }
  .hero-btn.charge{ border:1.5px solid var(--ink); background:var(--paper); color:var(--ink); }
  .hero-btn.drain{ border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); }

  /* Daily Note 밑줄 스타일 */
  .underline-note-block{ margin-top:40px; }
  .underline-note-label{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .underline-note-input{
    width:100%; border:none; outline:none; background:transparent;
    border-bottom:1.5px solid var(--ink); padding:8px 0;
    font-family:'Inter', sans-serif; font-size:15px; color:var(--ink);
    line-height:1.5; border-radius:0;
  }
  .underline-note-input::placeholder{ color:var(--muted); }

  /* ================= 2. 충전/방전 기록 모달 (Action Sheet) ================= */
  .action-sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:flex-end;
    justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .action-sheet-overlay.active{ opacity:1; pointer-events:auto; }
  .action-sheet{
    width:100%; max-width:420px; background:var(--paper); border:2px solid var(--ink);
    border-radius:24px 24px 0 0; padding:24px 22px calc(env(safe-area-inset-bottom) + 30px);
    transform:translateY(100%); transition:transform .25s ease;
  }
  .action-sheet-overlay.active .action-sheet{ transform:translateY(0); }

  .sheet-title{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; margin-bottom:4px; }
  .sheet-delta-text{ font-family:'Space Grotesk', sans-serif; font-size:38px; font-weight:700; margin:10px 0 16px; }

  /* 카테고리 칩 */
  .word-grid{ display:flex; flex-wrap:wrap; gap:6px 7px; margin:14px 0 18px; }
  .word-item{
    padding:6px 11px; border:1.5px solid #000000; border-radius:6px;
    background:transparent; cursor:pointer; font-family:'Space Grotesk', sans-serif;
    font-size:12px; color:var(--muted); text-align:center; transition:all .15s ease;
  }
  .word-item.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .sheet-input{
    width:100%; border:none; outline:none; background:transparent;
    border-bottom:1.5px solid var(--ink); padding:8px 0; font-family:'Inter', sans-serif;
    font-size:15px; color:var(--ink); margin-bottom:20px; border-radius:0;
  }
  .sheet-btn-row{ display:flex; gap:10px; }
  .sheet-submit-btn{
    flex:1; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
    font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700;
    padding:13px; border-radius:14px; cursor:pointer;
  }
  .sheet-cancel-btn{
    border:1.5px solid var(--divider); background:none; color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:13px; padding:13px 18px;
    border-radius:14px; cursor:pointer;
  }

  /* ================= 3. Progress 탭 ================= */
  .progress-summary-bar{ display:flex; justify-content:space-between; align-items:baseline; padding:12px 0 16px; margin-bottom:18px; border-bottom:1px solid var(--divider); }
  .sub-counts{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }
  .streak-row{ display:flex; align-items:baseline; gap:6px; }
  .streak-value{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; color:var(--ink); }
  .streak-label{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); }

  .calendar-nav-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .nav-btn{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:4px 9px; border-radius:8px; cursor:pointer; }
  .month-weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .month-weekday-label{ font-family:'JetBrains Mono', monospace; font-size:8.5px; color:var(--muted); text-transform:uppercase; text-align:center; }
  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:2px; }
  .month-cell{ aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border:1px solid transparent; border-radius:9px; cursor:pointer; background:var(--paper); }
  .month-cell.selected{ background:var(--band); border-color:var(--ink); }
  .month-cell.today{ border-color:var(--ink); }
  .month-dot{ width:6px; height:6px; border-radius:50%; border:1.2px solid var(--faint); }
  .month-dot.positive{ background:var(--ink); border-color:var(--ink); }
  .month-dot.negative{ background:transparent; border-color:var(--ink); }

  .day-detail{ margin-top:20px; border:1px solid var(--ink); border-radius:14px; padding:16px; }
  .day-detail-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; margin-bottom:10px; }
  .day-detail-item{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:14px; border-bottom:1px solid var(--divider); }
  .day-detail-item:last-child{ border-bottom:none; }
  .type-pill{ font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px; border:1.2px solid var(--ink); }
  .type-pill.drain{ background:var(--ink); color:var(--paper); }

  .stats-section{ margin-top:28px; }
  .stats-toggle-row{ display:flex; gap:8px; margin-bottom:14px; }
  .stats-tab-btn{ flex:1; padding:9px 10px; border:1.3px solid var(--divider); border-radius:10px; background:var(--paper); color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:11.5px; font-weight:600; cursor:pointer; text-align:center; }
  .stats-tab-btn.active{ border-color:var(--ink); background:var(--band); color:var(--ink); }
  .stats-box{ border:1px solid var(--divider); border-radius:12px; padding:14px; background:var(--paper); }
  .stat-row{ margin-bottom:12px; }
  .stat-row:last-child{ margin-bottom:0; }
  .stat-label-row{ display:flex; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:13.5px; margin-bottom:4px; }
  .stat-pct{ font-family:'JetBrains Mono', monospace; font-weight:600; color:var(--ink); }
  .stat-bar-track{ width:100%; height:6px; background:var(--divider); border-radius:3px; overflow:hidden; }
  .stat-bar-fill{ height:100%; background:var(--ink); border-radius:3px; }
</style>
</head>
<body>
<div id="root"><div style="text-align:center; padding:60px 0; font-family:monospace; color:#888;">Caru Loading…</div></div>

<script>
// 서비스 워커 등록 (아이폰 백그라운드 푸시)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyCitVETsMx-5ax48t4UViBT8DyIMOiB0sM",
    authDomain: "zero-3dfef.firebaseapp.com",
    databaseURL: "https://zero-3dfef-default-rtdb.firebaseio.com",
    projectId: "zero-3dfef",
    storageBucket: "zero-3dfef.firebasestorage.app",
    messagingSenderId: "59219649844",
    appId: "1:59219649844:web:38546f1960e27abac83161",
    measurementId: "G-VDFG7XTY64"
  };

  let userId = localStorage.getItem('caru_device_user_id');
  if (!userId) {
    userId = 'usr_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
    localStorage.setItem('caru_device_user_id', userId);
  }

  let db = null;
  let firebaseEnabled = false;
  if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      firebaseEnabled = true;
    } catch(e){}
  }

  const STORAGE_KEY = 'caru_data_' + userId;
  const root = document.getElementById('root');
  const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAY_NAMES_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const CHARGE_CATEGORIES = ['Sleep', 'Music', 'Walk', 'Hobby', 'Self-care', 'Coffee', 'Cooking', 'Gaming'];
  const DRAIN_CATEGORIES = ['Work', 'Commute', 'Study', 'Exercise', 'Chores', 'Meeting', 'Laundry', 'Screen time'];

  function dkeyFromDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return dkeyFromDate(new Date()); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

  // 배터리 상태 & 자연 방전
  let batteryLevel = 80;
  let lastBatteryUpdate = Date.now();

  function applyNaturalDrain(){
    const now = Date.now();
    const elapsedHours = (now - lastBatteryUpdate) / (1000 * 60 * 60);
    if(elapsedHours >= 0.1){
      const drain = Math.round(elapsedHours * 4.5); // 시간당 4.5% 자연 방전
      if(drain > 0){
        batteryLevel = Math.max(5, batteryLevel - drain);
        lastBatteryUpdate = now;
        save();
      }
    }
  }

  let data = { items: [], comments: {}, battery: 80, lastBatteryUpdate: Date.now() };
  let theme = 'light';
  let activeTab = 'home'; // 'home' | 'progress'

  // 모달(Action Sheet) 상태
  let activeSheetMode = null; // 'charge' | 'drain' | null
  let sheetStartBattery = 80;
  let sheetTargetBattery = 80;
  let selectedCategory = '';
  let sheetMemoText = '';

  // Progress 달력 상태
  let progressMonthCursor = new Date();
  progressMonthCursor.setHours(0,0,0,0);
  progressMonthCursor.setDate(1);
  let selectedProgressDay = null;
  let activeStatsTab = 'charge';

  function applyTheme(){
    if(theme === 'dark') {
      document.documentElement.setAttribute('data-theme','dark');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#121110');
    } else {
      document.documentElement.removeAttribute('data-theme');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#fbfaf8');
    }
  }

  async function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : {};
    }catch(e){ data = {}; }
    
    if(!data.items) data.items = [];
    if(!data.comments) data.comments = {};
    if(typeof data.battery === 'number') batteryLevel = data.battery;
    if(data.lastBatteryUpdate) lastBatteryUpdate = data.lastBatteryUpdate;

    applyNaturalDrain();
    theme = localStorage.getItem('caru-theme-pref') === 'dark' ? 'dark' : 'light';
    render();

    if (firebaseEnabled && db) {
      db.ref('users/' + userId).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          data = val;
          if(typeof data.battery === 'number') batteryLevel = data.battery;
          if(data.lastBatteryUpdate) lastBatteryUpdate = data.lastBatteryUpdate;
          applyNaturalDrain();
          render();
        }
      });
    }
  }

  async function save(){
    data.battery = batteryLevel;
    data.lastBatteryUpdate = lastBatteryUpdate;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    if (firebaseEnabled && db) {
      try { await db.ref('users/' + userId).set(data); } catch(e){}
    }
  }

  function setupNotification(){
    if(!("Notification" in window)){
      alert("홈 화면에 추가한 후 실행해야 알림을 사용할 수 있습니다.");
      return;
    }
    Notification.requestPermission().then(permission => {
      if(permission === 'granted'){
        new Notification("Caru 배터리 알림 켜짐", {
          body: `현재 배터리: ${batteryLevel}%. 실시간 방전 경고와 충전 알림을 보내드립니다.`
        });
        render();
      }
    });
  }

  // ==========================================
  // 1. 홈 탭 (초미니멀 배터리 + 밑줄 데일리 노트)
  // ==========================================
  function renderHomeTab(){
    let statusText = "NATURAL DISCHARGING (ACTIVE)";
    if(batteryLevel <= 20) statusText = "CRITICAL BATTERY • RECHARGE NEEDED";
    else if(batteryLevel >= 85) statusText = "OPTIMAL ENERGY LEVEL";

    const todayComment = data.comments[todayKey()] || '';

    return `
      <div class="home-center">
        <span class="home-status-title">${statusText}</span>
        <span class="home-battery-num">${batteryLevel}%</span>

        <!-- 배터리 본체 터치 영역 -->
        <div class="battery-touch-wrap" id="home-battery-touch">
          <div class="battery-touch-shell">
            <div class="battery-touch-fill" style="width:${batteryLevel}%; ${batteryLevel<=20?'background:var(--batt-warn);':''}"></div>
          </div>
          <div class="battery-touch-cap"></div>
        </div>
        <span class="battery-hint">Tap +Charge or −Drain below to log impact</span>

        <!-- 2개 메인 버튼 -->
        <div class="action-btn-row">
          <button class="hero-btn charge" id="open-charge-sheet">+ Charge</button>
          <button class="hero-btn drain" id="open-drain-sheet">− Drain</button>
        </div>
      </div>

      <!-- 다이어리 밑줄 스타일 데일리 노트 -->
      <div class="underline-note-block">
        <div class="underline-note-label">Daily Note</div>
        <input type="text" class="underline-note-input" id="home-daily-note" placeholder="How was your day?" value="${escapeHtml(todayComment)}" />
      </div>
    `;
  }

  // ==========================================
  // 2. 충전/방전 기록 시트 (배터리 드래그 팝업)
  // ==========================================
  function renderActionSheet(){
    if(!activeSheetMode) return '';

    const isCharge = (activeSheetMode === 'charge');
    const delta = sheetTargetBattery - sheetStartBattery;
    const deltaSign = delta > 0 ? `+${delta}%` : `${delta}%`;
    const categories = isCharge ? CHARGE_CATEGORIES : DRAIN_CATEGORIES;

    const wordsHtml = categories.map(cat => `
      <button type="button" class="word-item${selectedCategory===cat?' active':''}" data-sheet-cat="${cat}">${cat}</button>
    `).join('');

    return `
      <div class="action-sheet-overlay active" id="action-sheet-overlay">
        <div class="action-sheet" id="action-sheet-box">
          <div class="sheet-title">${isCharge ? '+ Charge Battery' : '− Drain Battery'}</div>
          <p style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); margin:0;">Drag battery bar to adjust level</p>

          <div class="sheet-delta-text" style="color:${isCharge?'var(--ink)':'var(--batt-warn)'};">${deltaSign}</div>

          <!-- 조절 가능한 배터리 바 -->
          <div class="battery-touch-wrap" id="sheet-battery-touch" style="margin-bottom:14px;">
            <div class="battery-touch-shell" style="height:44px;">
              <div class="battery-touch-fill" style="width:${sheetTargetBattery}%;"></div>
            </div>
            <div class="battery-touch-cap" style="height:16px;"></div>
          </div>

          <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); text-transform:uppercase;">Select Reason</div>
          <div class="word-grid">${wordsHtml}</div>

          <input type="text" class="sheet-input" id="sheet-memo-input" placeholder="Memo (optional)…" value="${escapeHtml(sheetMemoText)}" />

          <div class="sheet-btn-row">
            <button class="sheet-cancel-btn" id="close-sheet-btn">Cancel</button>
            <button class="sheet-submit-btn" id="submit-sheet-btn">${isCharge ? 'Done Recharge' : 'Done Drain'}</button>
          </div>
        </div>
      </div>
    `;
  }

  // ==========================================
  // 3. Progress 탭 (월간 달력 & 과거 기록)
  // ==========================================
  function renderProgressTab(){
    const cursor = progressMonthCursor;
    const year = cursor.getFullYear();
    const month = cursor.getMonth();
    const monthLabel = `${MONTHS_FULL[month]} ${year}`;
    const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}-`;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstDow = new Date(year, month, 1).getDay();
    const leadBlanks = (firstDow + 6) % 7;
    const todayStr = todayKey();

    const monthItems = data.items.filter(it => it.date.startsWith(monthPrefix));
    const healCount = monthItems.filter(it => it.type === 'heal').length;
    const drainCount = monthItems.filter(it => it.type === 'plan').length;

    const weekDayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const weekdayRowHtml = weekDayLabels.map(d => `<span class="month-weekday-label">${d}</span>`).join('');

    let cellsHtml = '';
    for(let i = 0; i < leadBlanks; i++) cellsHtml += `<div class="month-cell empty"></div>`;

    for(let d = 1; d <= daysInMonth; d++){
      const key = `${monthPrefix}${String(d).padStart(2,'0')}`;
      const dayItems = data.items.filter(it => it.date === key);
      let dotClass = '';
      if(dayItems.length > 0){
        const net = dayItems.reduce((s,it) => s + (it.type === 'heal' ? 1 : -1), 0);
        dotClass = net >= 0 ? 'positive' : 'negative';
      }
      const isToday = key === todayStr ? ' today' : '';
      const isSelected = key === selectedProgressDay ? ' selected' : '';

      cellsHtml += `
        <div class="month-cell${isToday}${isSelected}" data-daykey="${key}">
          <span style="font-family:'JetBrains Mono',monospace; font-size:12px;">${d}</span>
          <span class="month-dot ${dotClass}"></span>
        </div>`;
    }

    let dayDetailHtml = '';
    if(selectedProgressDay){
      const dItems = data.items.filter(it => it.date === selectedProgressDay);
      const dComment = data.comments[selectedProgressDay];
      const [yy,mm,dd] = selectedProgressDay.split('-').map(Number);
      const labelDate = new Date(yy,mm-1,dd);

      const itemsHtml = dItems.length
        ? dItems.map(it => `
            <div class="day-detail-item">
              <span class="type-pill${it.type==='plan'?' drain':''}">${it.delta>0?`+${it.delta}%`:`${it.delta}%`}</span>
              <span style="flex:1;">${escapeHtml(it.text)}</span>
            </div>`).join('')
        : `<p style="padding:14px 0; text-align:center; color:var(--muted); font-size:13px;">No battery activity on this day.</p>`;

      const commentHtml = dComment ? `<p style="margin-top:12px; font-size:13.5px; line-height:1.5; color:var(--ink); border-top:1px solid var(--divider); padding-top:8px;">Note: ${escapeHtml(dComment)}</p>` : '';

      dayDetailHtml = `
        <div class="day-detail">
          <div class="day-detail-title">${DAY_NAMES_SHORT[labelDate.getDay()]}, ${MONTHS_SHORT[mm-1]} ${dd}</div>
          ${itemsHtml}
          ${commentHtml}
        </div>`;
    }

    // 상위 통계
    const targetType = (activeStatsTab === 'charge') ? 'heal' : 'plan';
    const filteredItems = data.items.filter(it => it.type === targetType);
    const countMap = {};
    filteredItems.forEach(it => { countMap[it.text] = (countMap[it.text] || 0) + 1; });

    const sortedStats = Object.keys(countMap)
      .map(name => ({
        name, count: countMap[name],
        pct: filteredItems.length > 0 ? Math.round((countMap[name] / filteredItems.length) * 100) : 0
      }))
      .sort((a,b) => b.count - a.count).slice(0, 5);

    const statsContentHtml = sortedStats.length
      ? sortedStats.map(item => `
          <div class="stat-row">
            <div class="stat-label-row">
              <span>${escapeHtml(item.name)} <span style="font-size:11px; color:var(--muted);">(${item.count}회)</span></span>
              <span class="stat-pct">${item.pct}%</span>
            </div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${item.pct}%;"></div></div>
          </div>
        `).join('')
      : `<p style="text-align:center; color:var(--muted); padding:10px 0; font-size:13px;">No records yet.</p>`;

    return `
      <div class="progress-summary-bar">
        <span class="sub-counts">+Charge: ${healCount} · −Drain: ${drainCount}</span>
        <span class="sub-counts">Current: ${batteryLevel}%</span>
      </div>

      <div class="calendar-nav-bar">
        <span style="font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600;">${monthLabel}</span>
        <div style="display:flex; gap:4px;">
          <button class="nav-btn" id="progress-prev-month">‹</button>
          <button class="nav-btn" id="progress-next-month">›</button>
        </div>
      </div>

      <div class="month-weekday-row">${weekdayRowHtml}</div>
      <div class="month-grid">${cellsHtml}</div>
      ${dayDetailHtml}

      <div class="stats-section">
        <div class="stats-toggle-row">
          <button class="stats-tab-btn${activeStatsTab==='charge'?' active':''}" data-stats-tab="charge">⚡ Top Recharges</button>
          <button class="stats-tab-btn${activeStatsTab==='drain'?' active':''}" data-stats-tab="drain">📋 Top Drains</button>
        </div>
        <div class="stats-box">${statsContentHtml}</div>
      </div>
    `;
  }

  function render(){
    applyTheme();
    const hasNotification = ("Notification" in window) && Notification.permission === 'granted';

    root.innerHTML = `
      <div class="top-bar">
        <div class="top-left">
          <p class="eyebrow">CARU</p>
          <button class="notify-btn${hasNotification?' on':''}" id="notify-perm-btn">${hasNotification?'🔔 Push On':'🔔 알림 켜기'}</button>
        </div>
        <button class="theme-toggle" id="theme-toggle">${theme === 'dark' ? 'Light' : 'Dark'}</button>
      </div>

      <div class="tabs">
        <button class="tab-btn${activeTab==='home'?' active':''}" data-tab="home">Home</button>
        <button class="tab-btn${activeTab==='progress'?' active':''}" data-tab="progress">Progress</button>
      </div>

      ${activeTab === 'home' ? renderHomeTab() : renderProgressTab()}
      ${renderActionSheet()}
    `;
    bindEvents();
  }

  function bindEvents(){
    document.getElementById('theme-toggle')?.addEventListener('click', async () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('caru-theme-pref', theme);
      render();
    });

    document.getElementById('notify-perm-btn')?.addEventListener('click', setupNotification);

    root.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    });

    // ==========================================
    // 홈 탭 이벤트
    // ==========================================
    if(activeTab === 'home'){
      // 밑줄 데일리 노트 자동 저장
      const noteInput = document.getElementById('home-daily-note');
      if(noteInput){
        noteInput.addEventListener('blur', async () => {
          data.comments[todayKey()] = noteInput.value.trim();
          await save();
        });
        noteInput.addEventListener('keydown', async (e) => {
          if(e.key === 'Enter') {
            data.comments[todayKey()] = noteInput.value.trim();
            await save();
            noteInput.blur();
          }
        });
      }

      // + Charge 시트 열기
      document.getElementById('open-charge-sheet')?.addEventListener('click', () => {
        activeSheetMode = 'charge';
        sheetStartBattery = batteryLevel;
        sheetTargetBattery = Math.min(100, batteryLevel + 20); // 기본 +20%
        selectedCategory = CHARGE_CATEGORIES[0];
        sheetMemoText = '';
        render();
      });

      // − Drain 시트 열기
      document.getElementById('open-drain-sheet')?.addEventListener('click', () => {
        activeSheetMode = 'drain';
        sheetStartBattery = batteryLevel;
        sheetTargetBattery = Math.max(0, batteryLevel - 20); // 기본 -20%
        selectedCategory = DRAIN_CATEGORIES[0];
        sheetMemoText = '';
        render();
      });
    }

    // ==========================================
    // 배터리 직접 터치/드래그 인터랙션 (Action Sheet 내부)
    // ==========================================
    const sheetTouchBar = document.getElementById('sheet-battery-touch');
    if(sheetTouchBar){
      function handleBarDrag(clientX){
        const shell = sheetTouchBar.querySelector('.battery-touch-shell');
        if(!shell) return;
        const rect = shell.getBoundingClientRect();
        const offsetX = Math.max(0, Math.min(rect.width, clientX - rect.left));
        let pct = Math.round((offsetX / rect.width) * 100);

        if(activeSheetMode === 'charge'){
          pct = Math.max(sheetStartBattery, pct); // 충전은 현재보다 위로만
        } else {
          pct = Math.min(sheetStartBattery, pct); // 방전은 현재보다 아래로만
        }
        sheetTargetBattery = pct;

        const delta = sheetTargetBattery - sheetStartBattery;
        const deltaText = delta > 0 ? `+${delta}%` : `${delta}%`;
        document.querySelector('.sheet-delta-text').textContent = deltaText;
        sheetTouchBar.querySelector('.battery-touch-fill').style.width = sheetTargetBattery + '%';
      }

      let isDragging = false;
      sheetTouchBar.addEventListener('pointerdown', (e) => {
        isDragging = true;
        sheetTouchBar.setPointerCapture(e.pointerId);
        handleBarDrag(e.clientX);
      });
      sheetTouchBar.addEventListener('pointermove', (e) => {
        if(isDragging) handleBarDrag(e.clientX);
      });
      sheetTouchBar.addEventListener('pointerup', () => { isDragging = false; });
      sheetTouchBar.addEventListener('pointercancel', () => { isDragging = false; });

      // 카테고리 칩 선택
      root.querySelectorAll('[data-sheet-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedCategory = btn.dataset.sheetCat;
          root.querySelectorAll('[data-sheet-cat]').forEach(b => b.classList.toggle('active', b === btn));
        });
      });

      // 취소 버튼
      document.getElementById('close-sheet-btn')?.addEventListener('click', () => {
        activeSheetMode = null; render();
      });

      // 제출 버튼
      document.getElementById('submit-sheet-btn')?.addEventListener('click', async () => {
        const delta = sheetTargetBattery - sheetStartBattery;
        if(delta !== 0){
          batteryLevel = sheetTargetBattery;
          lastBatteryUpdate = Date.now();

          const memo = document.getElementById('sheet-memo-input')?.value.trim();
          const title = memo ? `${selectedCategory}: ${memo}` : selectedCategory;

          data.items.push({
            id: uid(),
            type: activeSheetMode === 'charge' ? 'heal' : 'plan',
            delta: delta,
            text: title,
            date: todayKey()
          });
          await save();
        }
        activeSheetMode = null;
        render();
      });
    }

    // ==========================================
    // Progress 탭 이벤트
    // ==========================================
    if(activeTab === 'progress'){
      document.getElementById('progress-prev-month')?.addEventListener('click', () => {
        progressMonthCursor = new Date(progressMonthCursor.getFullYear(), progressMonthCursor.getMonth() - 1, 1);
        selectedProgressDay = null; render();
      });
      document.getElementById('progress-next-month')?.addEventListener('click', () => {
        progressMonthCursor = new Date(progressMonthCursor.getFullYear(), progressMonthCursor.getMonth() + 1, 1);
        selectedProgressDay = null; render();
      });
      root.querySelectorAll('[data-daykey]').forEach(cell => {
        if(cell.classList.contains('empty')) return;
        cell.addEventListener('click', () => {
          const key = cell.dataset.daykey;
          selectedProgressDay = (selectedProgressDay === key) ? null : key;
          render();
        });
      });
      root.querySelectorAll('[data-stats-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeStatsTab = btn.dataset.statsTab;
          render();
        });
      });
    }
  }

  load();
})();
</script>
</body>
</html>
