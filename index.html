<!-- TensorFlow & BlazeFace -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
<!-- Firebase App & Database (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#111111; --paper:#ffffff; --muted:#9a9a9a; --faint:#d8d8d8;
    --hover:#f7f7f7; --band:#f2f2f2; --divider:#e4e4e4;
  }
  html[data-theme="dark"]{
    --ink:#ffffff; --paper:#111111; --muted:#8a8a8a; --faint:#3a3a3a;
    --hover:#1c1c1c; --band:#1c1c1c; --divider:#2a2a2a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; -webkit-font-smoothing:antialiased;
    transition:background 0.15s ease, color 0.15s ease;
  }
  #root{ max-width:420px; margin:0 auto; padding:36px 22px 90px; min-height:100vh; }

  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .top-left{ display:flex; align-items:center; gap:8px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  .sync-badge{ font-family:'JetBrains Mono', monospace; font-size:9.5px; padding:2px 6px; border-radius:8px; border:1px solid var(--muted); color:var(--muted); }
  .sync-badge.online{ border-color:var(--ink); color:var(--ink); font-weight:600; }
  .theme-toggle{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:5px 11px; border-radius:12px; cursor:pointer; }
  .theme-toggle:hover{ background:var(--hover); }

  .tabs{ display:flex; gap:20px; margin-bottom:22px; border-bottom:1px solid var(--divider); }
  .tab-btn{ background:none; border:none; cursor:pointer; padding:0 0 10px; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.05em; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); }

  .today-prev-inline{display:inline-block;border:0;background:none;color:inherit;font:inherit;font-weight:700;font-size:22px;line-height:1;padding:0 7px 0 0;margin:0;cursor:pointer;vertical-align:2px;-webkit-appearance:none;appearance:none;}
  .date-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:26px; letter-spacing:-0.01em; margin:0 0 4px; }
  .frac{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .mini-balance{ font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--muted); margin-bottom:20px; }

  .list{ list-style:none; margin:0 0 4px; padding:0; }
  .item{ display:flex; align-items:center; gap:10px; padding:13px 2px; border-bottom:1px solid var(--divider); }
  .item-icon{ flex:none; width:18px; height:18px; color:var(--ink); }
  .item-icon svg{ width:100%; height:100%; }
  .type-pill{
    flex:none; font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:10px; border:1.3px solid var(--ink); color:var(--ink); background:transparent;
    white-space:nowrap;
  }
  .type-pill.plan{ background:var(--ink); color:var(--paper); }
  .item-text{ flex:1; font-size:15.5px; line-height:1.4; word-break:break-word; }
  .del-btn{ flex:none; width:20px; height:20px; border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer; line-height:1; }
  .del-btn:hover{ color:var(--ink); }

  .item-empty{ padding:26px 2px; color:var(--muted); font-size:14px; text-align:center; }

  .add-block{ margin-top:18px; padding-top:18px; border-top:1px solid var(--ink); }
  .comment-block{ margin-top:24px; }
  .main-note{ margin:10px 0 22px; }
  .main-note .comment-textarea{ min-height:96px; font-size:15px; }
  .quick-add-row{ display:flex; gap:8px; margin-top:12px; }
  .quick-add-btn{
    flex:1; border:1.3px solid var(--ink); background:var(--paper); color:var(--ink);
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600;
    padding:11px 10px; border-radius:12px; cursor:pointer;
  }
  .quick-add-btn.active{ background:var(--ink); color:var(--paper); }

  .comment-textarea{
    width:100%; min-height:72px; border:1.3px solid var(--ink); border-radius:10px;
    padding:12px; font-family:'Inter', sans-serif; font-size:14px; line-height:1.5;
    color:var(--ink); background:var(--paper); resize:vertical; outline:none;
  }
  .comment-textarea::placeholder{ color:var(--muted); }
  .picker-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .cat-pill{ border:1.3px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:6px 12px; border-radius:14px; cursor:pointer; white-space:nowrap; }
  .cat-pill.active{ background:var(--ink); color:var(--paper); }
  .type-picker{ display:flex; gap:6px; margin-bottom:16px; }

  .icon-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .icon-pill{
    flex:none; width:32px; height:32px; border:1.2px solid var(--ink); background:var(--paper); border-radius:7px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:7px; color:var(--ink);
  }
  .icon-pill svg{ width:100%; height:100%; }
  .icon-pill.active{ background:var(--ink); color:var(--paper); }
  .icon-pill-wrap{ position:relative; flex:none; }
  .icon-pill-remove{
    position:absolute; top:-5px; right:-5px; width:14px; height:14px; border-radius:50%;
    background:var(--ink); color:var(--paper); border:1px solid var(--paper); font-size:9px;
    line-height:12px; text-align:center; cursor:pointer; padding:0;
  }

  .add-row{ display:flex; align-items:center; gap:10px; }
  .add-icon-preview{ flex:none; width:17px; height:17px; color:var(--ink); }
  .add-icon-preview svg{ width:100%; height:100%; }
  .add-input{ flex:1; border:none; outline:none; font-family:'Inter', sans-serif; font-size:15px; background:transparent; color:var(--ink); border-bottom:1.3px solid var(--ink); padding-bottom:6px; }
  .add-input::placeholder{ color:var(--muted); }
  .add-submit-btn{ flex:none; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:11px; padding:9px 16px; border-radius:16px; cursor:pointer; }
  .add-submit-btn.big{ font-size:13px; padding:12px 22px; border-radius:18px; }
  .add-submit-btn:hover{ opacity:0.85; }
  .add-submit-btn[disabled]{ opacity:0.5; cursor:default; }

  .balance-banner{ border:1px solid var(--ink); border-radius:10px; padding:18px; margin-bottom:20px; }
  .balance-banner .label{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .balance-banner .value{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:40px; letter-spacing:-0.01em; }
  .balance-banner .note{ font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .sub-counts{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }

  .streak-row{ display:flex; align-items:baseline; gap:8px; margin:18px 0 22px; }
  .streak-value{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; }
  .streak-label{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); }

  .section-title{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .month-nav-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  .nav-btn{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:4px 9px; border-radius:3px; cursor:pointer; }

  .week-calendar{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:2px; }
  .week-cell{
    min-width:0; min-height:82px; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:5px; padding:8px 2px; border:1px solid var(--divider);
    border-radius:8px; cursor:pointer; background:var(--paper);
  }
  .week-cell:hover{ background:var(--hover); }
  .week-cell.selected{ background:var(--band); border-color:var(--ink); }
  .week-weekday{ font-family:'JetBrains Mono', monospace; font-size:8.5px; color:var(--muted); text-transform:uppercase; }
  .week-daynum{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  .week-net{ min-height:12px; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--muted); }
  .week-cell.today{ border-color:var(--ink); }
  .week-cell.today .week-weekday,
  .week-cell.today .week-daynum{ color:var(--ink); font-weight:700; }
  .day-detail{ margin-top:18px; border:1px solid var(--ink); border-radius:10px; padding:16px; }
  .day-detail-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; margin-bottom:10px; }
  .day-detail-item{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px; }
  .day-detail-icon{ flex:none; width:16px; height:16px; color:var(--ink); }
  .day-detail-icon svg{ width:100%; height:100%; }
  .day-detail-comment{ margin-top:10px; padding-top:10px; border-top:1px solid var(--divider); font-size:13.5px; line-height:1.5; color:var(--ink); white-space:pre-wrap; }
  .day-detail-empty{ color:var(--muted); font-size:13px; }
  .month-daynum{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--muted); }
  .month-dot{ width:8px; height:8px; border-radius:50%; border:1.2px solid var(--faint); }
  .month-dot.positive{ background:var(--ink); border-color:var(--ink); }
  .month-dot.negative{ background:transparent; border-color:var(--ink); }
  .month-cell.today .month-daynum{ color:var(--ink); font-weight:700; }

  /* Focus character */
  .focus-char{ width:96px; height:96px; margin:0 auto 10px; }
  .focus-char.shake{ animation: charShake 0.4s ease; }
  @keyframes charShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .focus-char-inner{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    animation: charBob 2.4s ease-in-out infinite; transform-box: fill-box; color:var(--ink);
  }
  @keyframes charBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
  .focus-char-inner svg{ width:100%; height:100%; overflow:visible; }
  #focus-char-pose{ display:block; width:100%; height:100%; }
  .focus-char-eye{ animation: charBlink 4.5s infinite; transform-origin:center; transform-box: fill-box; }
  @keyframes charBlink{ 0%,92%,100%{ transform:scaleY(1);} 96%{ transform:scaleY(0.1);} }

  .char-upload-row{ text-align:center; margin-bottom:14px; display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .char-slot-col{ display:flex; align-items:center; }

  .focus-video-wrap{ position:relative; width:100%; border-radius:10px; overflow:hidden; border:1px solid var(--ink); background:#000; margin-bottom:14px; }
  #focus-video{ width:100%; display:block; aspect-ratio:4/3; object-fit:cover; transition:filter 0.2s ease; }
  #focus-video.blurred{ filter: blur(22px) saturate(0.8); }
  .blur-toggle-btn{
    position:absolute; bottom:8px; right:8px; border:1px solid var(--paper); background:rgba(0,0,0,0.55);
    color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:5px 10px;
    border-radius:12px; cursor:pointer;
  }
  .focus-stat-row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; }
  .focus-timer{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:32px; letter-spacing:-0.01em; }
  .focus-substat{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); text-align:right; line-height:1.6; }
  .focus-feedback{ margin-top:12px; padding:12px 14px; border:1px solid var(--ink); border-radius:8px; font-size:13.5px; line-height:1.5; min-height:20px; }

  .dur-pill{ border:1.3px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:6px 11px; border-radius:14px; cursor:pointer; white-space:nowrap; }
  .dur-pill.active{ background:var(--ink); color:var(--paper); }
  .reminder-btn{ border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:11px; padding:7px 10px; border-radius:5px; cursor:pointer; flex:none; }
  .reminder-btn.off{ background:var(--paper); color:var(--ink); }
  .reminder-sub{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; text-align:center; }
  .quote-add-link{ background:none; border:none; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px; }
  .edit-icons-btn{
    border:1.3px solid var(--ink); background:var(--paper); color:var(--ink);
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:8px 16px;
    border-radius:16px; cursor:pointer; margin-bottom:16px;
  }
  .edit-icons-btn.active{ background:var(--ink); color:var(--paper); }

  .status{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); text-align:center; padding:60px 0; }

};
  const ICON_NAMES = {
    run:'dumbbell', book:'book-open', cook:'cooking-pot', music:'music', sleep:'bed',
    brief:'briefcase', brush:'palette', broom:'broom', pill:'pill', pencil:'pencil',
    coffee:'coffee', alarm:'alarm-clock', bike:'bike', walk:'footprints', water:'droplet',
    phone:'smartphone', game:'gamepad-2', bag:'shopping-bag', plant:'sprout', call:'phone-call',
    heart:'heart', users:'users', car:'car', tv:'tv', shirt:'shirt'
  };
  const ICON_KEYS = Object.keys(ICON_DEFS);
  const ICON_LABELS = {
    run:'Exercise', book:'Study', cook:'Cooking', music:'Music', sleep:'Sleep',
    brief:'Work', brush:'Hobby', broom:'Chores', pill:'Medicine', pencil:'Journal',
    coffee:'Break', alarm:'Wake up', bike:'Cycling', walk:'Walk', water:'Water',
    phone:'Screen time', game:'Gaming', bag:'Shopping', plant:'Garden', call:'Call a friend',
    heart:'Self-care', users:'Hang out', car:'Commute', tv:'Watch something', shirt:'Laundry'
  };

  const iconCache = {};
  async function fetchIconSilent(key){
    if (ICON_DEFS[key]) {
      iconCache[key] = null;
      return false;
    }

    const name = ICON_NAMES[key] || key;
    try{
      const res = await fetch(`https://cdn.jsdelivr.net/npm/lucide-static@0.503.0/icons/${name}.svg`);
      if(!res.ok) throw new Error('not found');
      const text = await res.text();
      iconCache[key] = text;
      return true;
    }catch(e){
      iconCache[key] = null;
      return false;
    }
  }
  function iconMarkup(key){
    if(ICON_DEFS[key]) return `<svg viewBox="0 0 24 24">${ICON_DEFS[key]}</svg>`;
    if(iconCache[key]) return iconCache[key];
    return `<svg viewBox="0 0 24 24">${ICON_DEFS.run}</svg>`;
  }
  function labelForIcon(key){
    if(ICON_LABELS[key]) return ICON_LABELS[key];
    return key.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
  const RECENT_ICON_STORAGE_KEY='caru_recent_icons_v1';
function getRecentIconKeys(){try{const a=JSON.parse(localStorage.getItem(RECENT_ICON_STORAGE_KEY)||'[]');return Array.isArray(a)?a.filter(k=>ICON_DEFS[k]):[];}catch(e){return[];}}
function rememberIconKey(k){if(!k||!ICON_DEFS[k])return;try{localStorage.setItem(RECENT_ICON_STORAGE_KEY,JSON.stringify([k,...getRecentIconKeys().filter(x=>x!==k)].slice(0,6)));}catch(e){}}
function allIconKeys(){
    const hidden = data.hiddenIconKeys || [];
    return ICON_KEYS.filter(k => !hidden.includes(k)).concat(data.customIconKeys || []);
  }

  function dkeyFromDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return dkeyFromDate(new Date()); }
  function todayLabel(){
    const d = selectedTodayDate;
    return `${DAY_NAMES_SHORT[d.getDay()]}, ${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`;
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
  function formatMMSS(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage;
  async function storageGet(key){
    if(hasClaudeStorage){
      try{ const res = await window.storage.get(key, false); return res ? res.value : null; }
      catch(e){ return null; }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  async function storageSet(key, value){
    if(hasClaudeStorage){
      try{ await window.storage.set(key, value, false); }catch(e){ console.error('Save failed', e); }
      return;
    }
    try{ localStorage.setItem(key, value); }catch(e){ console.error('Save failed', e); }
  }

  let data = { items: [], voiceClips: {}, comments: {}, customIconKeys: [], hiddenIconKeys: [] };
  let theme = 'light';
  let activeTab = 'today';
  let newItemIcon = ICON_KEYS[0];
  let newItemType = 'plan';
  let newItemText = '';
  let iconSearchError = '';
  let iconEditMode = false;
  let progressWeekStart = new Date();
  progressWeekStart.setHours(0,0,0,0);
  progressWeekStart.setDate(progressWeekStart.getDate() - ((progressWeekStart.getDay() + 6) % 7));
  let selectedProgressDay = null;
  let selectedTodayDate = new Date();
  selectedTodayDate.setHours(0,0,0,0);

  // ---- Focus session state ----
  let focusActive = false;
  let focusStream = null;
  let focusModel = null;
  let focusModelLoading = false;
  let focusDurationMin = 30;
  let focusLogIcon = null;
  let focusLogType = 'plan';
  let focusElapsedSec = 0;
  let focusedSec = 0;
  let foulCount = 0;
  let consecutiveMissing = 0;
  let focusTimerInterval = null;
  let focusFeedbackLine = '';
  let focusSessionSummary = null;
  let voiceOn = true;
  let blurCamera = true;
  let koreanVoice = null;
  let voiceUnlocked = false;

  const FOCUS_LINES_OK = ['좋아, 지금 아주 잘하고 있어.', '이대로 쭉 가자.', '집중력 좋은데?', '흐트러지지 마.'];
  const FOCUS_LINES_FOUL = ['어디 갔었어? 집중해!', '화면으로 다시 와.', '방금 딴 데 봤지?', '자리 비우지 마.'];

  function loadKoreanVoice(){
    if(!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    koreanVoice = voices.find(v => v.lang && v.lang.startsWith('ko')) || null;
  }
  if('speechSynthesis' in window){
    loadKoreanVoice();
    window.speechSynthesis.onvoiceschanged = loadKoreanVoice;
  }
  function unlockVoice(){
    if(voiceUnlocked) return;
    voiceUnlocked = true;
    try{
      if('speechSynthesis' in window){
        const primer = new SpeechSynthesisUtterance(' ');
        primer.volume = 0;
        window.speechSynthesis.speak(primer);
      }
      const primerAudio = new Audio();
      primerAudio.play().catch(()=>{});
    }catch(e){}
  }
  function speakTTS(text){
    if(!('speechSynthesis' in window) || !text) return;
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      if(koreanVoice) utter.voice = koreanVoice;
      utter.pitch = 0.8;
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }catch(e){}
  }
  function speakLine(category, text){
    if(!voiceOn) return;
    const clip = data.voiceClips && data.voiceClips[category];
    if(clip){
      try{
        const audio = new Audio(clip);
        audio.play().catch(() => speakTTS(text));
        return;
      }catch(e){}
    }
    speakTTS(text);
  }

  function applyTheme(){
    if(theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
  }

  function todayItems(){ return data.items.filter(it => it.date === dkeyFromDate(selectedTodayDate)); }

  function dayNet(dateKey){
    return data.items
      .filter(it => it.date === dateKey)
      .reduce((sum, it) => sum + (it.type === 'heal' ? 1 : -1), 0);
  }

  function currentStreak(){
    let streak = 0;
    let cursor = new Date();
    while(true){
      const key = dkeyFromDate(cursor);
      const dayItems = data.items.filter(it => it.date === key);
      if(dayItems.length === 0) break;
      const net = dayItems.reduce((s, it) => s + (it.type === 'heal' ? 1 : -1), 0);
      if(net < 0) break;
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function totalBalance(){
    let balance = 0, healDone = 0, planDone = 0;
    data.items.forEach(it => {
      if(it.type === 'heal'){ balance += 1; healDone += 1; }
      else { balance -= 1; planDone += 1; }
    });
    return { balance, healDone, planDone };
  }

  async function load(){
    try{
      const raw = await storageGet(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : { items: [], voiceClips: {}, comments: {}, customIconKeys: [], hiddenIconKeys: [] };
    }catch(e){ data = { items: [], voiceClips: {}, comments: {}, customIconKeys: [], hiddenIconKeys: [] }; }
    if(!data.items) data.items = [];
    if(!data.voiceClips) data.voiceClips = {};
    if(!data.comments) data.comments = {};
    if(!data.customIconKeys) data.customIconKeys = [];
    if(!data.hiddenIconKeys) data.hiddenIconKeys = [];

    theme = (await storageGet('daily-theme-pref')) === 'dark' ? 'dark' : 'light';
    voiceOn = (await storageGet('daily-voice-pref')) !== 'off';
    blurCamera = (await storageGet('daily-blur-pref')) !== 'off';

    await Promise.all(allIconKeys().map(k => fetchIconSilent(k)));
    render();

    // Firebase 실시간 데이터 구독
    if (firebaseEnabled && db) {
      db.ref('daily_app_data').on('value', async (snapshot) => {
        const val = snapshot.val();
        if (val) {
          data = val;
          if(!data.items) data.items = [];
          if(!data.voiceClips) data.voiceClips = {};
          if(!data.comments) data.comments = {};
          if(!data.customIconKeys) data.customIconKeys = [];
          if(!data.hiddenIconKeys) data.hiddenIconKeys = [];
          await Promise.all(allIconKeys().map(k => fetchIconSilent(k)));
          render();
        }
      });
    }
  }

  async function save(){
    await storageSet(STORAGE_KEY, JSON.stringify(data));
    if (firebaseEnabled && db) {
      try {
        await db.ref('daily_app_data').set(data);
      } catch(e) {
        console.error('Firebase 데이터 저장 실패:', e);
      }
    }
  }

  function typePillMarkup(type){
    const n = type === 'heal' ? '+1' : '−1';
    const word = type === 'heal' ? 'Charge' : 'Drain';
    return `<span class="type-pill${type==='plan'?' plan':''}">${word} ${n}</span>`;
  }

  function renderTodayTab(){
    const items = todayItems();
    const { balance } = totalBalance();

    const listHtml = items.length
      ? items.map(it => `
          <li class="item" data-id="${it.id}">
            <span class="item-icon">${iconMarkup(it.icon)}</span>
            ${typePillMarkup(it.type)}
            <span class="item-text">${escapeHtml(it.text)}</span>
            <button class="del-btn" data-action="delete" data-id="${it.id}">×</button>
          </li>`).join('')
      : `<li class="item-empty">Nothing logged yet today. Add something below.</li>`;

    const typePickerHtml = `
      <button class="cat-pill${newItemType==='plan'?' active':''}" data-itemtype="plan">− Drain</button>
      <button class="cat-pill${newItemType==='heal'?' active':''}" data-itemtype="heal">+ Charge</button>`;

    const recentKeys=getRecentIconKeys();
    const pickerKeys=[...recentKeys,...allIconKeys().filter(k=>!recentKeys.includes(k))];
    const iconPickerHtml=pickerKeys.map(key => {
      const btn = `<button class="icon-pill${key===newItemIcon?' active':''}" data-iconkey="${key}" title="${escapeHtml(labelForIcon(key))}">${iconMarkup(key)}</button>`;
      if(!iconEditMode) return btn;
      return `<span class="icon-pill-wrap">${btn}<button class="icon-pill-remove" data-removeicon="${key}" title="Remove">×</button></span>`;

  function renderProgressTab(){
    const { balance, healDone, planDone } = totalBalance();
    const note = balance >= 0
      ? 'You have credit to spend on Drain items.'
      : "You're in debt — do some Charge items to charge back up.";
    const streak = currentStreak();

    // Progress is shown by calendar week: Monday → Sunday.
    const weekStart = new Date(progressWeekStart);
    weekStart.setHours(0,0,0,0);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    const todayStr = todayKey();

    const weekLabel = (() => {
      const sMonth = MONTHS_SHORT[weekStart.getMonth()];
      const eMonth = MONTHS_SHORT[weekEnd.getMonth()];
      if(weekStart.getFullYear() !== weekEnd.getFullYear()){
        return `${sMonth} ${weekStart.getDate()}, ${weekStart.getFullYear()} – ${eMonth} ${weekEnd.getDate()}, ${weekEnd.getFullYear()}`;
      }
      if(weekStart.getMonth() === weekEnd.getMonth()){
        return `${sMonth} ${weekStart.getDate()} – ${weekEnd.getDate()}, ${weekStart.getFullYear()}`;
      }
      return `${sMonth} ${weekStart.getDate()} – ${eMonth} ${weekEnd.getDate()}, ${weekStart.getFullYear()}`;
    })();

    const weekDays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    let cellsHtml = '';
    for(let i = 0; i < 7; i++){
      const cellDate = new Date(weekStart);
      cellDate.setDate(weekStart.getDate() + i);
      const key = dkeyFromDate(cellDate);
      const dayItems = data.items.filter(it => it.date === key);
      let dotClass = '';
      let netText = '';
      if(dayItems.length > 0){
        const net = dayItems.reduce((s, it) => s + (it.type === 'heal' ? 1 : -1), 0);
        dotClass = net >= 0 ? 'positive' : 'negative';
        netText = `${net >= 0 ? '+' : ''}${net}`;
      }
      const isToday = key === todayStr ? ' today' : '';
      const isSelected = key === selectedProgressDay ? ' selected' : '';

      cellsHtml += `
        <div class="week-cell${isToday}${isSelected}" data-daykey="${key}">
          <span class="week-weekday">${weekDays[i]}</span>
          <span class="week-daynum">${cellDate.getDate()}</span>
          <span class="month-dot ${dotClass}"></span>
          <span class="week-net">${netText}</span>
        </div>`;
    }

    let dayDetailHtml = '';
    if(selectedProgressDay){
      const dItems = data.items.filter(it => it.date === selectedProgressDay);
      const dComment = data.comments[selectedProgressDay];
      const [yy,mm,dd] = selectedProgressDay.split('-').map(Number);
      const labelDate = new Date(yy, mm-1, dd);
      const dateLabel = `${DAY_NAMES_SHORT[labelDate.getDay()]}, ${MONTHS_SHORT[mm-1]} ${dd}`;
      const itemsHtml = dItems.length
        ? dItems.map(it => `
            <div class="day-detail-item">
              <span class="day-detail-icon">${iconMarkup(it.icon)}</span>
              ${typePillMarkup(it.type)}
              <span>${escapeHtml(it.text)}</span>
            </div>`).join('')
        : `<p class="day-detail-empty">Nothing logged this day.</p>`;
      const commentHtml = dComment
        ? `<div class="day-detail-comment">${escapeHtml(dComment)}</div>`
        : '';
      dayDetailHtml = `
        <div class="day-detail">
          <div class="day-detail-title">${dateLabel}</div>
          ${itemsHtml}
          ${commentHtml}
        </div>`;
    }

    return `
      <div class="balance-banner">
        <div class="label">Remaining +</div>
        <div class="value">${balance >= 0 ? '+' : ''}${balance}</div>
        <div class="note">${note}</div>
      </div>
      <p class="sub-counts">Charge done: ${healDone} · Drain done: ${planDone} (all-time)</p>
      <div class="streak-row">
        <span class="streak-value">${streak}</span>
        <span class="streak-label">day${streak===1?'':'s'} in the green</span>
      </div>
      <div class="month-nav">
        <button class="nav-btn" id="progress-prev-week">‹</button>
        <span class="month-nav-title">${weekLabel}</span>
        <button class="nav-btn" id="progress-next-week">›</button>
      </div>
      <div class="week-calendar">${cellsHtml}</div>
      ${dayDetailHtml}
    `;
  }

  async function startFocusSession(){
    focusModelLoading = true;
    render();
    try{
      if(!focusModel) focusModel = await blazeface.load();
    }catch(e){
      focusModelLoading = false;
      alert('얼굴 인식 모델을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해주세요.');
      render();
      return;
    }
    try{
      focusStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }catch(e){
      focusModelLoading = false;
      alert('카메라 권한이 필요해요. 브라우저 설정에서 카메라 허용 여부를 확인해주세요.');
      render();
      return;
    }

    focusModelLoading = false;
    focusActive = true;
    focusElapsedSec = 0;
    focusedSec = 0;
    foulCount = 0;
    consecutiveMissing = 0;
    focusFeedbackLine = '카메라 연결됐어. 시작한다.';
    speakLine('greet', focusFeedbackLine);
    render();

    const video = document.getElementById('focus-video');
    if(video){ video.srcObject = focusStream; video.play().catch(()=>{}); }

    focusTimerInterval = setInterval(() => {
      focusElapsedSec += 1;
      const timerEl = document.getElementById('focus-timer-text');
      if(timerEl) timerEl.textContent = formatMMSS(Math.max(0, focusDurationMin*60 - focusElapsedSec));
      if(focusElapsedSec >= focusDurationMin*60) endFocusSession();
    }, 1000);

    scheduleFaceCheck();
  }

  function scheduleFaceCheck(){
    if(!focusActive) return;
    detectFaceOnce().finally(() => {
      if(focusActive) setTimeout(scheduleFaceCheck, 1000);
    });
  }

  async function detectFaceOnce(){
    let faceSeen = false;
    try{
      const video = document.getElementById('focus-video');
      if(video && video.readyState >= 2 && focusModel){
        const predictions = await focusModel.estimateFaces(video, false);
        faceSeen = predictions.length > 0;
      }
    }catch(e){ faceSeen = false; }

    const poseEl = document.getElementById('focus-char-pose');
    const charEl = document.getElementById('focus-char');

    if(faceSeen){
      focusedSec += 1;
      consecutiveMissing = 0;
      if(poseEl) poseEl.innerHTML = poseMarkup('neutral');
      if(focusedSec % 20 === 0){
        focusFeedbackLine = FOCUS_LINES_OK[Math.floor(Math.random()*FOCUS_LINES_OK.length)];
        speakLine('good', focusFeedbackLine);
        const fb = document.getElementById('focus-feedback-text'); if(fb) fb.textContent = focusFeedbackLine;
        if(poseEl) poseEl.innerHTML = poseMarkup('happy');
        setTimeout(() => {
          const el = document.getElementById('focus-char-pose');
          if(el) el.innerHTML = poseMarkup('neutral');
        }, 2500);
      }
    }else{
      consecutiveMissing += 1;
      if(consecutiveMissing === 3){
        foulCount += 1;
        focusFeedbackLine = FOCUS_LINES_FOUL[Math.floor(Math.random()*FOCUS_LINES_FOUL.length)];
        speakLine('foul', focusFeedbackLine);
        const fb = document.getElementById('focus-feedback-text'); if(fb) fb.textContent = focusFeedbackLine;
        if(poseEl) poseEl.innerHTML = poseMarkup('foul');
        if(charEl){ charEl.classList.remove('shake'); void charEl.offsetWidth; charEl.classList.add('shake'); }
      }
    }

    const substatEl = document.getElementById('focus-substat-text');
    if(substatEl) substatEl.innerHTML = `Focused ${formatMMSS(focusedSec)}<br/>Fouls: ${foulCount}`;
  }

  async function endFocusSession(){
    if(focusTimerInterval){ clearInterval(focusTimerInterval); focusTimerInterval = null; }
    if(focusStream){ focusStream.getTracks().forEach(t => t.stop()); focusStream = null; }
    focusActive = false;

    const thresholdPct = 60;
    let logged = false;
    let logText = '';
    const hadLog = !!focusLogIcon;
    if(focusLogIcon && focusElapsedSec > 0){
      logText = ICON_LABELS[focusLogIcon] || 'Focus session';
      const p = (focusedSec / focusElapsedSec) * 100;
      if(p >= thresholdPct){
        data.items.push({ id: uid(), icon: focusLogIcon, type: focusLogType, text: logText, date: todayKey() });
        logged = true;
        await save();
      }
    }

    focusSessionSummary = { focusedSec, totalSec: focusElapsedSec, foulCount, logged, logText, hadLog, thresholdPct };
    render();
  }

    const ICON_SEARCH_ALIASES = {
      heart:['heart','love','health','self-care','self care','건강','사랑','힐링'],
      run:['run','running','exercise','workout','fitness','gym','운동','헬스'],

      home:['home','house','집'],
      users:['friends','friend','social','hangout','hang out','people','친구','만남'],
      car:['car','drive','commute','transport','차','운전','출퇴근'],
      tv:['tv','watch','movie','video','영상','영화','시청'],
      shirt:['shirt','clothes','laundry','wash','빨래','세탁']
    };
    function findIconKey(query){
      const q=query.trim().toLowerCase().replace(/\s+/g,' ');
      const keys=allIconKeys();
      if(keys.includes(q.replace(/\s+/g,'-'))) return q.replace(/\s+/g,'-');
      for(const key of keys){
        const label=(ICON_LABELS[key]||'').toLowerCase();
        const aliases=ICON_SEARCH_ALIASES[key]||[];
        if(label===q || aliases.includes(q) || key===q) return key;
        if(aliases.some(a=>a.includes(q) && q.length>=3)) return key;
      }
      return null;
    }

    async async function submitIconSearch(){
  const input = document.getElementById('icon-search-input');
  const raw = (input?.value || '').trim().toLowerCase();
  if(!raw) return;

  iconSearchError = '';

  const aliases = {
    run:['run','running','exercise','workout','gym','fitness','운동','헬스','러닝','조깅'],
    book:['book','books','study','reading','read','education','learning','공부','독서','학습','책'],
    cook:['cook','cooking','kitchen','food','meal','pan','pot','요리','주방','식사','음식'],
    music:['music','song','songs','note','notes','음악','노래'],
    sleep:['sleep','bed','rest','nap','night','잠','수면','취침','낮잠','휴식'],
    brief:['work','job','office','business','briefcase','업무','일','직장','회사'],
    brush:['hobby','art','paint','painting','palette','drawing','취미','미술','그림','그리기'],
    broom:['clean','cleaning','chore','chores','housework','broom','청소','집안일','정리'],
    pill:['medicine','medical','pill','health','약','약먹기','건강','병원'],
    pencil:['journal','journaling','write','writing','memo','note','기록','일기','메모','글쓰기'],
    home:['home','house','room','집','홈'],
    heart:['heart','love','care','selfcare','self-care','health','wellness','사랑','건강','셀프케어','마음'],
    users:['people','friends','friend','social','hangout','hang','친구','사람','만남','약속'],
    car:['car','drive','driving','commute','commuting','교통','이동','출퇴근','운전'],
    tv:['tv','watch','movie','movies','video','youtube','영상','영화','시청'],
    shirt:['shirt','clothes','laundry','wash','옷','빨래','세탁']
  };

  const normalize = s => String(s)
    .toLowerCase()
    .replace(/[\s_-]+/g,'')
    .replace(/[^\p{L}\p{N}]/gu,'');

  const q = normalize(raw);

  // Built-in semantic search: compare the query against the key, visible label,
  // and all English/Korean aliases. Exact/contains matching is intentional.
  const keys = allIconKeys();
  const match = keys.find(key => {
    const terms = [
      key,
      typeof labelForIcon === 'function' ? labelForIcon(key) : '',
      ...(aliases[key] || [])
    ].map(normalize).filter(Boolean);
    return terms.some(term => term === q || term.includes(q) || q.includes(term));
  });

  if(match){
    newItemIcon = match;
    if(typeof rememberIconKey === 'function') rememberIconKey(match);
    if(input) input.value = '';
    render();
    return;
  }

  // If it is not one of Caru's built-ins, try an exact Lucide/custom icon name.
  const customName = raw.replace(/\s+/g,'-');
  const ok = await fetchIconSilent(customName);
  if(ok){
    data.customIconKeys = data.customIconKeys || [];
    if(!data.customIconKeys.includes(customName)) data.customIconKeys.push(customName);
    newItemIcon = customName;
    if(typeof rememberIconKey === 'function') rememberIconKey(customName);
    if(input) input.value = '';
    await save();
    render();
    return;
  }

  iconSearchError = `"${raw}" not found — try heart, study, 운동, etc.`;
  render();
}

    const iconSearchInput = document.getElementById('icon-search-input');
    if(iconSearchInput){
      iconSearchInput.addEventListener('keydown', async (e) => { if(e.key === 'Enter') await submitIconSearch(); });
    }
    const iconSearchBtn = document.getElementById('icon-search-btn');
    if(iconSearchBtn){ iconSearchBtn.addEventListener('click', ()=>submitIconSearch(); }

    const iconEditToggleBtn = document.getElementById('icon-edit-toggle-btn');
    if(iconEditToggleBtn){
      iconEditToggleBtn.addEventListener('click', () => {
        iconEditMode = !iconEditMode;
        render();
        if(iconEditMode){
          const input = document.getElementById('icon-search-input'); if(input) input.focus();
        }
      });
    }

    root.querySelectorAll('[data-removeicon]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const key = btn.dataset.removeicon;
        if(ICON_KEYS.includes(key)){
          if(!data.hiddenIconKeys.includes(key)) data.hiddenIconKeys.push(key);
        }else{
          data.customIconKeys = (data.customIconKeys || []).filter(k => k !== key);
          delete iconCache[key];
        }
        if(newItemIcon === key) newItemIcon = allIconKeys().find(k => k !== key) || ICON_KEYS[0];
        await save();
        render();
      });
    });

    const restoreIconsBtn = document.getElementById('restore-icons-btn');
    if(restoreIconsBtn){
      restoreIconsBtn.addEventListener('click', async () => {
        data.hiddenIconKeys = [];
        await save();
        render();
      });
    }

    const commentArea = document.getElementById('comment-textarea');
    if(commentArea){
      commentArea.addEventListener('blur', async () => {
        data.comments[dkeyFromDate(selectedTodayDate)] = commentArea.value;
        await save();
      });
    }
  }

  function bindProgressEvents(){
    const prevBtn = document.getElementById('progress-prev-week');
    if(prevBtn){
      prevBtn.addEventListener('click', () => {
        progressWeekStart = new Date(progressWeekStart);
        progressWeekStart.setDate(progressWeekStart.getDate() - 7);
        selectedProgressDay = null;
        render();
      });
    }
    const nextBtn = document.getElementById('progress-next-week');
    if(nextBtn){
      nextBtn.addEventListener('click', () => {
        progressWeekStart = new Date(progressWeekStart);
        progressWeekStart.setDate(progressWeekStart.getDate() + 7);
        selectedProgressDay = null;
        render();
      });
    }

    root.querySelectorAll('[data-daykey]').forEach(cell => {
      cell.addEventListener('click', () => {
        const key = cell.dataset.daykey;
        selectedProgressDay = (selectedProgressDay === key) ? null : key;
        render();
      });
    });
  }

  function bindFocusEvents(){
    const blurBtn = document.getElementById('blur-toggle-btn');
    if(blurBtn){
      blurBtn.addEventListener('click', async () => {
        blurCamera = !blurCamera;
        const video = document.getElementById('focus-video');
        if(video) video.classList.toggle('blurred', blurCamera);
        blurBtn.textContent = blurCamera ? '🌫 Blurred' : '👁 Clear';
        await storageSet('daily-blur-pref', blurCamera ? 'on' : 'off');
      });
    }

    const voiceBtn = document.getElementById('voice-toggle-btn');
    if(voiceBtn){
      voiceBtn.addEventListener('click', async () => {
        voiceOn = !voiceOn;
        if(!voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        await storageSet('daily-voice-pref', voiceOn ? 'on' : 'off');
        render();
      });
    }

    root.querySelectorAll('.voice-clip-input').forEach(inputEl => {
      inputEl.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const cat = inputEl.dataset.cat;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          if(!data.voiceClips) data.voiceClips = {};
          data.voiceClips[cat] = ev.target.result;
          await save();
          render();
        };
        reader.readAsDataURL(file);
      });
    });

    root.querySelectorAll('[data-removevoice]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        const cat = btn.dataset.removevoice;
        if(data.voiceClips) delete data.voiceClips[cat];
        await save();
        render();
      });
    });

    root.querySelectorAll('[data-focuslogicon]').forEach(btn => {
      btn.addEventListener('click', () => {
        focusLogIcon = btn.dataset.focuslogicon || null;
        render();
      });
    });

    root.querySelectorAll('[data-focuslogtype]').forEach(btn => {
      btn.addEventListener('click', () => {
        focusLogType = btn.dataset.focuslogtype;
        render();
      });
    });

    root.querySelectorAll('[data-focusdur]').forEach(btn => {
      btn.addEventListener('click', () => {
        focusDurationMin = parseInt(btn.dataset.focusdur, 10);
        render();
      });
    });

    const startBtn = document.getElementById('start-focus-btn');
    if(startBtn){ startBtn.addEventListener('click', () => { unlockVoice(); startFocusSession(); }); }

    const stopBtn = document.getElementById('stop-focus-btn');
    if(stopBtn){ stopBtn.addEventListener('click', endFocusSession); }

    if(focusActive){
      const video = document.getElementById('focus-video');
      if(video && focusStream && video.srcObject !== focusStream){
        video.srcObject = focusStream;
        video.play().catch(()=>{});
      }
    }

    const dismissBtn = document.getElementById('focus-dismiss-btn');
    if(dismissBtn){
      dismissBtn.addEventListener('click', () => {
        focusSessionSummary = null;
        focusLogIcon = null;
        render();
      });
    }
  }

  load();
})();

// v17-search-fallback
document.addEventListener('DOMContentLoaded',()=>{
  const b=document.getElementById('icon-search-btn');
  const i=document.getElementById('icon-search-input');
  if(b) b.addEventListener('click',()=>submitIconSearch());
  if(i) i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitIconSearch();}});
});

</script>
</body>
