<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Caru" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<title>Caru - Human Battery</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#151515; --paper:#fbfaf8; --muted:#8e8e93; --faint:#e5e5ea;
    --hover:#f2f2f7; --band:#efede8; --divider:#e5e5ea;
    --batt-warn:#ff3b30; --batt-over:#d97706; --batt-debt:#ef4444;
  }
  html[data-theme="dark"]{
    --ink:#f2f2f7; --paper:#000000; --muted:#8e8e93; --faint:#2c2c2e;
    --hover:#1c1c1e; --band:#1c1c1e; --divider:#2c2c2e;
    --batt-warn:#ff453a; --batt-over:#f59e0b; --batt-debt:#f87171;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background 0.2s ease, color 0.2s ease;
  }
  #root{
    max-width:420px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 16px) 22px calc(env(safe-area-inset-bottom) + 60px);
    min-height:100vh;
  }
  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .top-left{ display:flex; align-items:center; gap:8px; }
  .eyebrow{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; font-weight:600; }
  .theme-toggle{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:ui-monospace,"SF Mono",monospace; font-size:11px; padding:4px 10px; border-radius:12px; cursor:pointer; }
  .notify-btn{ border:1px dashed var(--muted); background:none; color:var(--muted); font-family:ui-monospace,"SF Mono",monospace; font-size:10px; padding:3px 8px; border-radius:8px; cursor:pointer; }
  .notify-btn.on{ border-style:solid; border-color:var(--ink); color:var(--ink); font-weight:600; }
  .tabs{ display:flex; gap:24px; margin-bottom:28px; border-bottom:1px solid var(--divider); }
  .tab-btn{ background:none; border:none; cursor:pointer; padding:0 0 10px; font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:15px; font-weight:500; color:var(--muted); border-bottom:2.5px solid transparent; margin-bottom:-1px; transition:all .15s; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); font-weight:700; }

  /* 홈 탭 */
  .home-center{ display:flex; flex-direction:column; align-items:center; margin:6px 0 24px; }
  .home-status-badge{ font-family:ui-monospace,"SF Mono",monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; font-weight:600; }
  .home-status-badge.debt{ color:var(--batt-debt); }
  .home-status-badge.over{ color:var(--batt-over); }
  .battery-num-wrap{ display:flex; align-items:baseline; justify-content:center; gap:8px; margin-bottom:18px; }
  .home-battery-num{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif; font-size:64px; font-weight:800; letter-spacing:-0.03em; line-height:1; }
  .battery-delta-tag{ font-family:ui-monospace,"SF Mono",monospace; font-size:16px; font-weight:700; padding:3px 9px; border-radius:8px; background:var(--band); color:var(--ink); }
  .battery-delta-tag.plus{ color:#16a34a; background:rgba(34,197,94,0.15); }
  .battery-delta-tag.minus{ color:var(--batt-warn); background:rgba(255,59,48,0.12); }

  /* iOS 네이티브 배터리 아이콘 */
  .battery-container{
    width:100%; max-width:300px; display:flex; align-items:center;
    gap:3px; margin:4px 0 16px; user-select:none; touch-action:none;
  }
  .battery-shell{
    flex:1; height:52px; border:2.8px solid var(--ink); border-radius:14px;
    padding:4px; background:var(--paper); position:relative; overflow:hidden;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .battery-shell.draggable{ cursor:ew-resize; }
  .battery-shell.debt-mode{ border-color:var(--batt-debt); box-shadow:0 0 10px rgba(239,68,68,0.25); }
  .battery-shell.over-mode{ border-color:var(--batt-over); box-shadow:0 0 12px rgba(217,119,6,0.25); }
  .battery-fill{
    height:100%; border-radius:8px; background:var(--ink);
    transition:width 0.08s ease-out, background-color 0.2s ease;
    pointer-events:none;
  }
  .battery-fill.warn{ background:var(--batt-warn); }
  .battery-fill.over{ background:linear-gradient(90deg,var(--ink) 0%,var(--batt-over) 100%); }
  .battery-debt-overlay{
    position:absolute; inset:4px; border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-family:ui-monospace,"SF Mono",monospace;
    font-size:11px; font-weight:700; color:var(--batt-debt);
    background:rgba(239,68,68,0.10); pointer-events:none;
  }
  .battery-cap{
    width:5px; height:20px; background:var(--ink); border-radius:0 3px 3px 0;
    flex:none; transition:background-color 0.2s ease;
  }
  .battery-cap.debt{ background:var(--batt-debt); }
  .battery-cap.over{ background:var(--batt-over); }

  /* Charge / Use 버튼 */
  .action-btn-row{ display:flex; gap:12px; margin-top:14px; width:100%; max-width:300px; }
  .hero-btn{
    flex:1; padding:14px 10px; border-radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; transition:all .15s ease; text-align:center;
  }
  .hero-btn:active{ transform:scale(0.97); }
  .hero-btn.charge{ border:1.8px solid var(--ink); background:var(--paper); color:var(--ink); }
  .hero-btn.charge.active{ background:var(--ink); color:var(--paper); }
  .hero-btn.drain{ border:1.8px solid var(--ink); background:var(--ink); color:var(--paper); }
  .hero-btn.drain.active{ border-color:var(--batt-warn); background:rgba(255,59,48,0.08); color:var(--batt-warn); }

  /* 인라인 패널 */
  .inline-panel{
    width:100%; margin-top:20px; padding:18px 16px;
    border:1.5px solid var(--divider); border-radius:18px; background:var(--band);
    animation:panelIn 0.2s ease-out;
  }
  @keyframes panelIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .panel-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .panel-label{ font-family:ui-monospace,"SF Mono",monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .reason-edit-btn{ border:none; background:none; color:var(--ink); font-size:12px; font-weight:600; cursor:pointer; text-decoration:underline; }

  /* 스텝퍼 */
  .stepper-row{ display:flex; gap:6px; margin-bottom:16px; }
  .step-btn{ flex:1; padding:9px 0; border:1px solid var(--divider); border-radius:10px; background:var(--paper); color:var(--ink); font-family:ui-monospace,"SF Mono",monospace; font-size:12px; font-weight:700; cursor:pointer; }
  .step-btn:active{ background:var(--hover); }

  /* Reason 칩 */
  .reason-grid{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .reason-chip{
    display:inline-flex; align-items:center; gap:4px;
    padding:6px 12px; border:1.2px solid var(--divider); border-radius:9px;
    background:var(--paper); cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:12.5px; color:var(--ink);
    transition:all .15s;
  }
  .reason-chip.selected{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .reason-chip-del{ border:none; background:none; color:inherit; font-size:10px; padding:0 0 0 3px; cursor:pointer; opacity:0.6; }

  .add-reason-row{ display:flex; gap:6px; margin-bottom:14px; }
  .add-reason-input{ flex:1; border:1px solid var(--divider); background:var(--paper); color:var(--ink); border-radius:8px; padding:7px 10px; font-size:12.5px; outline:none; }
  .add-reason-btn{ border:1px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:8px; padding:7px 12px; font-size:12px; font-weight:600; cursor:pointer; }

  .memo-input{
    width:100%; border:none; outline:none; background:transparent;
    border-bottom:1.5px solid var(--divider); padding:8px 0;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px; color:var(--ink);
    margin-bottom:16px; border-radius:0;
  }
  .memo-input:focus{ border-bottom-color:var(--ink); }

  .panel-actions{ display:flex; gap:8px; }
  .apply-btn{
    flex:1; padding:13px 10px; border-radius:12px; border:1.5px solid var(--ink);
    background:var(--ink); color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .cancel-btn{
    padding:13px 16px; border-radius:12px; border:1px solid var(--divider);
    background:var(--paper); color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:13px; cursor:pointer;
  }

  /* Daily Note */
  .daily-note-block{ margin-top:40px; }
  .daily-note-label{ font-family:ui-monospace,"SF Mono",monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; font-weight:600; }
  .daily-note-input{
    width:100%; border:none; outline:none; background:transparent;
    border-bottom:1.8px solid var(--ink); padding:8px 0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    font-size:15px; color:var(--ink); line-height:1.5; border-radius:0;
  }
  .daily-note-input::placeholder{ color:var(--muted); }

  /* Progress 탭 */
  .progress-summary-bar{ display:flex; justify-content:space-between; align-items:baseline; padding:10px 0 14px; margin-bottom:16px; border-bottom:1px solid var(--divider); }
  .sub-counts{ font-family:ui-monospace,"SF Mono",monospace; font-size:11.5px; color:var(--muted); }
  .calendar-nav-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .nav-btn{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:ui-monospace,"SF Mono",monospace; font-size:11px; padding:4px 9px; border-radius:8px; cursor:pointer; }
  .month-weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .month-weekday-label{ font-family:ui-monospace,"SF Mono",monospace; font-size:9px; color:var(--muted); text-transform:uppercase; text-align:center; }
  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:2px; }
  .month-cell{ aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border:1px solid transparent; border-radius:9px; cursor:pointer; background:var(--paper); }
  .month-cell.selected{ background:var(--band); border-color:var(--ink); }
  .month-cell.today{ border-color:var(--ink); }
  .month-dot{ width:6px; height:6px; border-radius:50%; border:1.2px solid var(--faint); }
  .month-dot.positive{ background:var(--ink); border-color:var(--ink); }
  .month-dot.negative{ background:transparent; border-color:var(--batt-warn); }
  .day-detail{ margin-top:20px; border:1px solid #222; border-radius:14px; padding:16px; }
  .day-detail-title{ font-weight:700; font-size:15px; margin-bottom:10px; }
  .day-detail-item{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--divider); }
  .day-detail-item:last-child{ border-bottom:none; }
  .type-pill{ font-family:ui-monospace,"SF Mono",monospace; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; border:1px solid #444; color:#aaa; }
  .type-pill.drain{ background:#333; color:#ddd; border-color:#444; }
  .stats-section{ margin-top:28px; }
  .stats-toggle-row{ display:flex; gap:8px; margin-bottom:14px; }
  .stats-tab-btn{ flex:1; padding:9px 10px; border:1.3px solid var(--divider); border-radius:10px; background:var(--paper); color:var(--muted); font-family:ui-monospace,"SF Mono",monospace; font-size:11px; font-weight:700; cursor:pointer; text-align:center; }
  .stats-tab-btn.active{ border-color:var(--ink); background:var(--band); color:var(--ink); }
  .stats-box{ border:1px solid var(--divider); border-radius:12px; padding:14px; background:var(--paper); }
  .stat-row{ margin-bottom:12px; }
  .stat-row:last-child{ margin-bottom:0; }
  .stat-label-row{ display:flex; justify-content:space-between; font-size:13px; font-weight:500; margin-bottom:4px; }
  .stat-pct{ font-family:ui-monospace,"SF Mono",monospace; font-weight:700; color:var(--ink); }
  .stat-bar-track{ width:100%; height:6px; background:var(--divider); border-radius:3px; overflow:hidden; }
  .stat-bar-fill{ height:100%; background:var(--ink); border-radius:3px; }
  /* Minimal Caru */
  :root{
    --paper:#000;
    --ink:#f5f5f5;
    --muted:#777;
    --faint:#262626;
    --hover:#151515;
    --band:#111;
    --divider:#222;
  }
  html[data-theme="dark"]{
    --paper:#000;
    --ink:#f5f5f5;
    --muted:#777;
    --faint:#262626;
    --hover:#151515;
    --band:#111;
    --divider:#222;
  }
  html,body{background:#000;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}
  #root{max-width:420px;min-height:100vh;padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px);}
  .minimal-home{min-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 30px);position:relative;}
  .home-actions{
    position:absolute;left:50%;top:calc(51% + 100px);transform:translateX(-50%);
    width:min(76vw,330px);display:flex;justify-content:space-between;align-items:center;
    padding:0 4px;box-sizing:border-box;z-index:10;
  }
  .minimal-tab{
    border:0;background:none;color:#666;font:400 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    padding:4px 0;cursor:pointer;
  }
  .minimal-tab:active{color:#aaa;}
  .minimal-edit{
    position:static;border:0;background:none;color:#666;font:400 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    padding:4px 0;cursor:pointer;
  }
  .minimal-edit:active{color:#aaa;}
  .day-question{
    position:absolute;left:7%;right:7%;top:20%;
    color:#777;font:400 14px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:-.01em;
  }
  .day-question-label{display:block;color:#777;margin-bottom:7px;}
  .day-question-text{
    width:100%;min-height:34px;max-height:50px;resize:none;overflow:hidden;
    border:0;border-bottom:1px solid #222;outline:none;background:transparent;color:#aaa;
    font:400 14px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    padding:0 0 7px;box-sizing:border-box;
  }
  .day-question-text::placeholder{color:#444;}
  .condition-row{
    position:absolute;left:7%;right:7%;top:35%;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    color:#555;font:400 11px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.04em;
  }
  .condition-label{color:#555;white-space:nowrap;}
  .condition-options{display:flex;gap:5px;}
  .condition-btn{
    border:1px solid #222;background:transparent;color:#555;
    border-radius:10px;padding:5px 9px;cursor:pointer;
    font:400 11px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  .condition-btn.active{border-color:#666;color:#aaa;}
  .condition-btn:active{color:#ddd;border-color:#888;}
  .condition-rate{color:#444;white-space:nowrap;font-size:9px;}
  .battery-status{
    position:absolute;left:50%;top:calc(51% + 72px);
    transform:translateX(-50%);
    color:#666;font:400 9px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.08em;text-align:center;white-space:nowrap;
  }
  .battery-status.danger{color:#ff453a;}
  .battery-status.high{color:#9ab39b;}
  .battery-info{
    position:absolute;left:50%;top:calc(51% + 134px);transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .forecast{
    color:#666;font:400 11px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.04em;white-space:nowrap;
  }
  .last-open{
    color:#444;font:400 10px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.04em;white-space:nowrap;
  }
  .sync-box{margin-top:26px;padding-bottom:30px;}
  .sync-copy{border:1px solid #222;background:#070707;color:#888;border-radius:6px;padding:9px 12px;font:400 12px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;cursor:pointer;}
  .sync-copy:active{color:#ddd;border-color:#666;}
  .sync-id{margin-top:8px;color:#333;font:400 10px ui-monospace,"SF Mono",monospace;word-break:break-all;}
  .sleep-overlay{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:24px;animation:panelIn .16s ease-out;}
  .sleep-card{width:100%;max-width:320px;background:#0b0b0b;border:1px solid #222;border-radius:18px;padding:26px 18px 14px;text-align:center;}
  .sleep-title{color:#ddd;font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin-bottom:6px;}
  .sleep-sub{color:#555;font:400 11px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin-bottom:20px;}
  .sleep-options{display:flex;gap:8px;}
  .sleep-opt{flex:1;border:1px solid #2a2a2a;background:#070707;color:#bbb;border-radius:12px;padding:14px 4px 12px;font:400 14px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;cursor:pointer;}
  .sleep-opt:active{border-color:#777;color:#fff;}
  .sleep-opt small{display:block;margin-top:6px;color:#666;font-size:10px;}
  .sleep-skip{margin-top:14px;border:0;background:none;color:#555;font:400 11px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:6px 10px;cursor:pointer;}
  .routine-bat{position:relative;height:64px;box-sizing:border-box;border:1.5px solid #666;border-radius:20px;padding:4px;background:#090909;overflow:hidden;touch-action:none;cursor:ew-resize;user-select:none;margin:4px 0 12px;}
  .routine-fill{height:100%;border-radius:15px;background:#7b7b7b;pointer-events:none;}
  .routine-now{position:absolute;top:4px;bottom:4px;width:2px;background:#fff;opacity:.55;pointer-events:none;}
  .routine-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;font:400 20px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;pointer-events:none;mix-blend-mode:normal;}
  .routine-delta{text-align:center;color:#777;font:400 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin-bottom:16px;min-height:16px;}
  .routine-delta.plus{color:#9ab39b;}
  .routine-delta.minus{color:#ff453a;}
  .home-progress-btn{position:absolute;right:7%;top:calc(20% - 28px);z-index:5;padding:0;line-height:20px;}
  .minimal-routine{min-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 30px);padding-bottom:55px;}
  .routine-card{border:1px solid #181818;border-radius:10px;padding:14px;margin-bottom:10px;background:#050505;}
  .routine-card.open{border-color:#333;}
  .routine-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .routine-card-name{color:#ddd;font:400 15px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}
  .routine-card-meta{color:#777;font:400 12px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin-top:5px;}
  .routine-card-status{color:#444;font:400 10px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin-top:4px;letter-spacing:.03em;}
  .routine-delete{margin-top:14px;width:100%;border:1px solid #2a1a1a;background:transparent;color:#a55;border-radius:6px;padding:10px;font:400 12px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;cursor:pointer;}
  .routine-add{width:100%;margin-top:6px;padding:13px;text-align:center;}

<script>

(function(){
  const firebaseConfig={
    apiKey:"AIzaSyCitVETsMx-5ax48t4UViBT8DyIMOiB0sM",
    authDomain:"zero-3dfef.firebaseapp.com",
    databaseURL:"https://zero-3dfef-default-rtdb.firebaseio.com",
    projectId:"zero-3dfef",
    storageBucket:"zero-3dfef.firebasestorage.app",
    messagingSenderId:"59219649844",
    appId:"1:59219649844:web:38546f1960e27abac83161"
  };

  let userId=localStorage.getItem('caru_device_user_id');
  if(!userId){ userId='usr_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); localStorage.setItem('caru_device_user_id',userId); }

  let db=null, firebaseEnabled=false;
  try{ firebase.initializeApp(firebaseConfig); db=firebase.database(); firebaseEnabled=true; }catch(e){}

  const STORAGE_KEY='caru_data_'+userId;
  const root=document.getElementById('root');
  const MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const DEF_CHARGE=['Sleep','Coffee','Walk','Music','Meal','Rest','Workout','Gaming'];
  const DEF_DRAIN=['Work','Meeting','Commute','Study','Overtime','Chores','Stress','Screen time'];

  function todayKey(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  let batteryLevel=80, lastBatteryUpdate=Date.now();
  let sinceLast=null; // {ms, drop} : 지난번 실행 이후 경과 시간과 자연 감소량
  let healthInfo=null; // {hours, level, date} : 건강 앱(단축어)에서 받은 오늘 수면
  let routineDraft=null, routineDragging=false, editingRoutineId=null; // 루틴 팝업 / 루틴 화면에서 편집 중인 루틴
  const CONDITION_RATES={good:2.0, normal:3.0, low:4.0};
  const CONDITION_LABELS={good:'Good', normal:'Normal', low:'Low'};

  function naturalDayKey(ts=Date.now()){
    const d=new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getTodayCondition(){
    const k=naturalDayKey();
    if(data.conditionDate===k && CONDITION_RATES[data.condition]) return data.condition;
    return 'normal';
  }

  function setTodayCondition(level,source){
    // 속도를 바꾸기 전에, 지금까지 쌓인 감소를 이전 속도로 먼저 반영한다
    applyNaturalDrain();
    const k=naturalDayKey();
    data.conditionDate=k;
    data.condition=level;
    // 직접 고른 경우만 기록: 수면 자동 설정이 사용자의 선택을 덮어쓰지 않게 한다
    if(source!=='sleep') data.conditionManualDate=k;
    data.naturalDay=k;
    lastBatteryUpdate=Date.now();
    data.lastBatteryUpdate=lastBatteryUpdate;
  }

  // 자연 감소: 마지막으로 계산한 시각(drainAt)부터 지금까지의 감소만 현재 배터리에서 뺀다.
  // 충전/사용으로 바꾼 값은 건드리지 않으므로, 예전 충전분이 되돌려지지 않는다.
  function applyNaturalDrain(){
    const now=Date.now();
    const currentDay=naturalDayKey(now);

    // 날짜가 바뀌어도 drainAt은 유지한다. 앱을 닫아 둔 밤사이에도 자연 감소가 누락되지 않게 한다.
    if(!data.naturalDay || data.naturalDay!==currentDay){
      data.naturalDay=currentDay;
      data.conditionDate=currentDay;
      if(!CONDITION_RATES[data.condition]) data.condition='normal';
    }

    const at=Number(data.drainAt);
    if(!Number.isFinite(at)||at<=0){
      // 이전 버전 데이터: 지금부터 새로 시작
      data.drainAt=now;
      data.drainCarry=0;
      return false;
    }

    // 수면 팝업 응답 여부와 관계없이 자연 감소를 계속 적용한다.

    const hrs=Math.max(0,(now-at)/(1000*60*60));
    const rate=CONDITION_RATES[getTodayCondition()]||CONDITION_RATES.normal;
    let carry=(Number(data.drainCarry)||0)+hrs*rate; // 1% 미만 자투리까지 누적
    const whole=Math.floor(carry);
    carry-=whole;
    data.drainAt=now;
    data.drainCarry=carry;

    if(whole>=1 && batteryLevel>5){
      const nb=Math.max(5,batteryLevel-whole);
      // 마지막으로 앱을 연 뒤 자연 감소한 양을 누적한다
      data.drainSinceOpen=(Number(data.drainSinceOpen)||0)+(batteryLevel-nb);
      batteryLevel=nb;
      lastBatteryUpdate=now;
      data.lastBatteryUpdate=now;
      return true;
    }
    return false;
  }

  let data={ items:[], comments:{}, battery:80, lastBatteryUpdate:Date.now(), chargeReasons:[...DEF_CHARGE], drainReasons:[...DEF_DRAIN] };
  let theme='dark', activeTab='home';
  let isTypingNote=false;
  let inlineMode=null, editOpen=false, targetBattery=80, selectedReason='', memoText='', editingReasons=false;
  let progressMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  let selectedDay=null, activeStatsTab='charge';

  function applyTheme(){
    if(theme==='dark'){ document.documentElement.setAttribute('data-theme','dark'); document.querySelector('meta[name="theme-color"]')?.setAttribute('content','#000'); }
    else{ document.documentElement.removeAttribute('data-theme'); document.querySelector('meta[name="theme-color"]')?.setAttribute('content','#fbfaf8'); }
  }

  async function load(){
    try{ const raw=localStorage.getItem(STORAGE_KEY); data=raw?JSON.parse(raw):{};  }catch(e){ data={}; }
    if(!data.items) data.items=[];
    if(!data.comments) data.comments={};
    if(typeof data.battery==='number') batteryLevel=data.battery;
    if(data.lastBatteryUpdate) lastBatteryUpdate=data.lastBatteryUpdate;
    if(!Array.isArray(data.chargeReasons)||!data.chargeReasons.length) data.chargeReasons=[...DEF_CHARGE];
    if(!Array.isArray(data.drainReasons)||!data.drainReasons.length) data.drainReasons=[...DEF_DRAIN];
    // Natural-drain baseline is established from the battery level that exists
    // when the day is first opened. Never assume a fixed 80% starting point.
    // Migrate older data once so a stale baseline cannot overwrite the user's
    // current battery on first open of the updated version.
    const today=todayKey();
    if(data.naturalSchemaVersion!==2){
      data.naturalSchemaVersion=2;
      data.naturalDay=today;
      data.naturalBaseBattery=batteryLevel;
      data.naturalBaseAt=Date.now();
      data.conditionDate=today;
      if(!CONDITION_RATES[data.condition]) data.condition='normal';
      data.battery=batteryLevel;
      data.lastBatteryUpdate=Date.now();
      lastBatteryUpdate=data.lastBatteryUpdate;
      localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    } else if(!data.naturalDay){
      data.naturalDay=today;
      data.naturalBaseBattery=batteryLevel;
      data.naturalBaseAt=Date.now();
    }
    markOpened(true);
    theme=localStorage.getItem('caru-theme-pref')==='light'?'light':'dark';
    render();
    if(firebaseEnabled&&db){
      db.ref('users/'+userId).on('value',snap=>{
        const val=snap.val();
        if(val){
          data=val;
          if(!data.items) data.items=[];
          if(!data.comments) data.comments={};
          if(typeof data.battery==='number') batteryLevel=data.battery;
          if(data.lastBatteryUpdate) lastBatteryUpdate=data.lastBatteryUpdate;
          if(!Array.isArray(data.chargeReasons)||!data.chargeReasons.length) data.chargeReasons=[...DEF_CHARGE];
          if(!Array.isArray(data.drainReasons)||!data.drainReasons.length) data.drainReasons=[...DEF_DRAIN];
          if(!data.naturalDay){ data.naturalDay=todayKey(); data.naturalBaseBattery=batteryLevel; data.naturalBaseAt=Date.now(); }
          const naturalChanged=applyNaturalDrain();
          if(naturalChanged){ data.battery=batteryLevel; data.lastBatteryUpdate=lastBatteryUpdate; }
          if(!isTypingNote) render();
        }
      });
      // 건강 앱(단축어)에서 올린 수면 데이터 수신
      db.ref('health/'+userId).on('value',snap=>handleHealth(snap.val()));
    }
  }

  async function save(){
    data.battery=batteryLevel; data.lastBatteryUpdate=lastBatteryUpdate;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    if(firebaseEnabled&&db){ try{ await db.ref('users/'+userId).set(data); }catch(e){} }
  }

  // 앱을 열 때(또는 백그라운드에서 돌아올 때) 지난 실행 이후 경과/감소량을 계산
  function markOpened(force){
    const now=Date.now();
    const prev=Number(data.lastOpenedAt);
    if(!force && Number.isFinite(prev) && now-prev<60000) return false;
    applyNaturalDrain();
    if(Number.isFinite(prev) && prev>0){
      sinceLast={ms:Math.max(0,now-prev), drop:Number(data.drainSinceOpen)||0};
    }
    data.drainSinceOpen=0;
    data.lastOpenedAt=now;
    save();
    return true;
  }

  function lastOpenText(){
    if(!sinceLast) return '';
    const mins=Math.floor(sinceLast.ms/60000);
    const h=Math.floor(mins/60), m=mins%60;
    const drop=sinceLast.drop>0?`−${sinceLast.drop}%`:'no change';
    return `Last opened ${h}h ${String(m).padStart(2,'0')}m ago · ${drop}`;
  }

  // 현재 속도 기준으로 배터리가 20%에 닿는 시각 예측
  function forecastText(){
    if(batteryLevel<=20) return 'Below 20% · time to rest';
    const rate=CONDITION_RATES[getTodayCondition()]||CONDITION_RATES.normal;
    const now=Date.now();
    const at=Number(data.drainAt), carry=Number(data.drainCarry)||0;
    let eta=NaN;
    if(Number.isFinite(at)&&at>0) eta=at+(((batteryLevel-20)-carry)/rate)*3600000;
    if(!Number.isFinite(eta)||eta<=now) eta=now+((batteryLevel-20)/rate)*3600000;
    const d=new Date(eta);
    const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
    const k=naturalDayKey(eta);
    const prefix=k===naturalDayKey(now)?'':k===naturalDayKey(now+86400000)?'tomorrow ':`${MONTHS_SHORT[d.getMonth()]} ${d.getDate()} `;
    return `20% around ${prefix}${hh}:${mm}`;
  }

  function dateKeyOffset(n){
    const d=new Date(); d.setDate(d.getDate()-n);
    return naturalDayKey(d.getTime());
  }

  // ---- 건강 앱 연동 (iOS 단축어 → Firebase health/<userId>) ----
  // 값이 시간/분/초 어느 단위로 와도 알아서 시간으로 변환한다
  function sleepToHours(v){
    v=Number(v);
    if(!Number.isFinite(v)||v<=0) return NaN;
    if(v>1500) return v/3600; // 초
    if(v>24) return v/60;     // 분
    return v;                 // 시간
  }
  function sleepLevel(h){ return h>=7?'good':h>=5?'normal':'low'; }
  function fmtHM(h){
    const mins=Math.round(h*60);
    return `${Math.floor(mins/60)}h ${String(mins%60).padStart(2,'0')}m`;
  }
  function handleHealth(val){
    if(!val) return;
    const hours=sleepToHours(val.sleep);
    if(!Number.isFinite(hours)||hours>16) return;
    const today=todayKey();
    if(val.date!==today) return; // 오늘 아침 데이터만 사용
    const level=sleepLevel(hours);
    healthInfo={hours,level,date:today};
    if(data.sleepAppliedDate!==today){
      data.sleepAppliedDate=today;
      if(data.conditionManualDate!==today) setTodayCondition(level,'sleep');
      save();
    }
    if(!isTypingNote) render();
  }

  // ---- 아침 수면 팝업 ----
  // 새벽 4시 이후 첫 실행에서 "How was your sleep?"을 묻고, 고른 값으로 충전량과 감소 속도를 정한다
  const SLEEP_BONUS={good:25, normal:20, low:15};
  function sleepPromptDue(){
    if(new Date().getHours()<4) return false;
    const today=todayKey();
    if(data.sleepPromptDay===today) return false;
    if((data.items||[]).some(it=>it.date===today&&it.text==='Sleep'&&Number(it.delta)>0)) return false;
    return true;
  }
  function sleepPopupHtml(){
    if(editOpen||!sleepPromptDue()) return '';
    const btn=l=>`<button type="button" class="sleep-opt" data-sleep="${l}">${CONDITION_LABELS[l]}<small>+${SLEEP_BONUS[l]}%</small></button>`;
    return `
      <div class="sleep-overlay">
        <div class="sleep-card">
          <div class="sleep-title">How was your sleep?</div>
          <div class="sleep-sub">Sets today's charge and drain speed</div>
          <div class="sleep-options">${btn('good')}${btn('normal')}${btn('low')}</div>
          <button type="button" class="sleep-skip" id="sleep-skip">Skip</button>
        </div>
      </div>`;
  }
  async function applySleep(level){
    if(!SLEEP_BONUS[level]) return;
    const today=todayKey();
    data.sleepPromptDay=today; // 먼저 표시해서, 이후 계산에서 감소 시계가 멈추지 않게 한다
    const before=batteryLevel;
    batteryLevel=Math.max(0,Math.min(100,batteryLevel+SLEEP_BONUS[level]));
    const delta=batteryLevel-before;
    if(delta>0){
      if(!data.items) data.items=[];
      data.items.push({id:uid(),type:'heal',delta,text:'Sleep',date:today,timestamp:Date.now()});
    }
    setTodayCondition(level); // 감소 속도 (Good 2 / Normal 3 / Low 4 %/h)
    data.drainAt=Date.now(); data.drainCarry=0; // 밤사이 시간은 수면 충전에 이미 포함
    await save(); render();
  }
  async function skipSleep(){
    data.sleepPromptDay=todayKey();
    await save(); render();
  }

  // ---- 루틴 ----
  // 루틴(이름, 시작~종료 시각, 요일)을 등록해 두면, 종료 시각이 지난 뒤 처음 앱에 들어왔을 때
  // 팝업이 뜨고 배터리를 드래그해서 +/− 변화량을 정한다. 하루에 루틴당 한 번만 묻는다.
  function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
  function parseHM(t){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'')); return m?Number(m[1])*60+Number(m[2]):NaN; }
  function getRoutines(){ return Array.isArray(data.routines)?data.routines.filter(r=>r&&r.id):[]; }
  function routineDueList(){
    const now=new Date();
    const mins=now.getHours()*60+now.getMinutes(), dow=now.getDay();
    const done=(data.routineDone&&data.routineDone[todayKey()])||{};
    return getRoutines().filter(r=>{
      const e=parseHM(r.end);
      return Number.isFinite(e)&&mins>=e&&!done[r.id]&&Array.isArray(r.days)&&r.days.includes(dow);
    }).sort((a,b)=>parseHM(a.end)-parseHM(b.end));
  }
  function markRoutineDone(id){
    if(!data.routineDone) data.routineDone={};
    const t=todayKey();
    if(!data.routineDone[t]) data.routineDone[t]={};
    data.routineDone[t][id]=true;
    const old=dateKeyOffset(10);
    Object.keys(data.routineDone).forEach(k=>{ if(k<old) delete data.routineDone[k]; });
  }
  function routinePopupHtml(){
    if(editOpen||sleepPromptDue()) return '';
    const list=routineDueList();
    if(!list.length){ routineDraft=null; return ''; }
    const r=list[0];
    if(!routineDraft||routineDraft.id!==r.id) routineDraft={id:r.id,target:batteryLevel};
    const t=routineDraft.target;
    return `
      <div class="sleep-overlay">
        <div class="sleep-card">
          ${list.length>1?`<div class="sleep-sub">1 of ${list.length}</div>`:''}
          <div class="sleep-title">${esc(r.name||'Routine')}</div>
          <div class="sleep-sub">Ended ${esc(r.end)} · drag the battery</div>
          <div class="routine-bat" id="routine-bat">
            <div class="routine-fill" id="routine-fill" style="width:${t}%"></div>
            <div class="routine-now" style="left:calc(5px + (100% - 10px) * ${batteryLevel/100})"></div>
            <div class="routine-pct" id="routine-pct">${t}%</div>
          </div>
          <div class="routine-delta" id="routine-delta"></div>
          <div class="edit-actions">
            <button type="button" class="cancel-btn" id="routine-skip">Skip</button>
            <button type="button" class="apply-btn" id="routine-done">Done</button>
          </div>
        </div>
      </div>`;
  }
  function paintRoutine(){
    if(!routineDraft) return;
    const t=routineDraft.target, d=t-batteryLevel;
    const sign=d>0?'+':'−';
    const f=document.getElementById('routine-fill'); if(f) f.style.width=t+'%';
    const p=document.getElementById('routine-pct'); if(p) p.textContent=t+'%';
    const dl=document.getElementById('routine-delta');
    if(dl){ dl.textContent=d===0?'No change':`${sign}${Math.abs(d)}%`; dl.className='routine-delta'+(d>0?' plus':d<0?' minus':''); }
    const b=document.getElementById('routine-done'); if(b) b.textContent=d===0?'Done':`Done · ${sign}${Math.abs(d)}%`;
  }
  async function applyRoutine(){
    const r=routineDueList()[0];
    if(!r||!routineDraft) return;
    const target=Math.max(0,Math.min(100,routineDraft.target));
    const delta=target-batteryLevel;
    if(delta!==0){
      if(!data.items) data.items=[];
      data.items.push({id:uid(),type:delta>0?'heal':'plan',delta,text:(r.name||'Routine'),date:todayKey(),timestamp:Date.now()});
      batteryLevel=target;
    }
    markRoutineDone(r.id);
    routineDraft=null;
    await save(); render();
  }
  async function skipRoutine(){
    const r=routineDueList()[0];
    if(r) markRoutineDone(r.id);
    routineDraft=null;
    await save(); render();
  }
  function routineDaysLabel(days){
    const d=(Array.isArray(days)?days:[]).slice().sort().join();
    if(d==='0,1,2,3,4,5,6') return 'Every day';
    if(d==='1,2,3,4,5') return 'Weekdays';
    if(d==='0,6') return 'Weekends';
    return d?d.split(',').map(x=>DAYS_SHORT[Number(x)]).join(' '):'No days';
  }
  function routineStatus(r){
    const now=new Date();
    if(!Array.isArray(r.days)||!r.days.includes(now.getDay())) return 'Not today';
    const done=(data.routineDone&&data.routineDone[todayKey()])||{};
    if(done[r.id]) return 'Done today';
    const e=parseHM(r.end), mins=now.getHours()*60+now.getMinutes();
    if(Number.isFinite(e)&&mins>=e) return 'Pending · answer on Home';
    return `Asks at ${r.end}`;
  }
  function renderRoutine(){
    const rs=getRoutines();
    const order=[1,2,3,4,5,6,0];
    const cards=rs.map(r=>{
      const open=editingRoutineId===r.id;
      const rid=escAttr(r.id);
      const body=open?`
        <div class="routine-edit" data-rid="${rid}">
          <input class="routine-name" data-rf="name" value="${escAttr(r.name)}" maxlength="24" placeholder="Name">
          <div class="routine-times">
            <input type="time" class="routine-time" data-rf="start" value="${escAttr(r.start)}"><span>–</span><input type="time" class="routine-time" data-rf="end" value="${escAttr(r.end)}">
          </div>
          <div class="routine-days">${order.map(d=>`<button type="button" class="routine-day${d===0?' sun':''}${(r.days||[]).includes(d)?' on':''}" data-rday="${d}" data-rid="${rid}">${DAYS_SHORT[d].slice(0,1)}</button>`).join('')}</div>
          <button type="button" class="routine-delete" data-rdel="${rid}">Delete routine</button>
        </div>`:'';
      return `<div class="routine-card${open?' open':''}">
        <div class="routine-card-head">
          <div class="routine-card-main">
            <div class="routine-card-name">${esc(r.name||'Routine')}</div>
            <div class="routine-card-meta">${esc(r.start)}–${esc(r.end)} · ${routineDaysLabel(r.days)}</div>
            <div class="routine-card-status">${esc(routineStatus(r))}</div>
          </div>
          <button type="button" class="reason-edit-btn" data-redit="${rid}">${open?'Done':'Edit'}</button>
        </div>${body}
      </div>`;
    }).join('');
    return `
      <div class="minimal-routine">
        <div class="progress-head">
          <span class="progress-title">Routine</span>
        </div>
        ${cards}
        <button type="button" class="sync-copy routine-add" id="routine-add">+ Add routine</button>
      </div>
      <button type="button" class="progress-home" id="open-home">Home</button>`;
  }

  function setupNotification(){
    if(!('Notification' in window)){ alert('홈 화면에 추가한 후 실행해야 알림을 사용할 수 있습니다.'); return; }
    Notification.requestPermission().then(p=>{ if(p==='granted'){ new Notification('Caru 알림 켜짐',{body:`현재 배터리: ${batteryLevel}%`}); render(); } });
  }

  function renderHome(){
    const cur=inlineMode?targetBattery:batteryLevel;
    const fill=Math.max(0,Math.min(100,cur));
    const isEditing=editOpen;
    const isC=inlineMode==='charge';
    const reasons=inlineMode?(isC?(data.chargeReasons||DEF_CHARGE):(data.drainReasons||DEF_DRAIN)):[];
    const note=data.comments?.[todayKey()]||'';

    let panelHtml='';
    if(isEditing){
      const isC=inlineMode==='charge';
      const reasons=inlineMode?(isC?(data.chargeReasons||DEF_CHARGE):(data.drainReasons||DEF_DRAIN)):[];
      const chipsHtml=reasons.map(r=>`
        <button type="button" class="reason-chip${selectedReason===r?' selected':''}" data-reason-click="${esc(r)}">
          <span>${esc(r)}</span>
          ${editingReasons&&inlineMode?`<span class="reason-chip-del" data-reason-del="${esc(r)}">×</span>`:''}
        </button>`).join('');
      const delta=inlineMode?(targetBattery-batteryLevel):0;
      const stepHtml=isC
        ? `<button type="button" class="edit-step" data-step="+5">+5</button>
           <button type="button" class="edit-step" data-step="+10">+10</button>
           <button type="button" class="edit-step" data-step="+15">+15</button>
           <button type="button" class="edit-step" data-step="+20">+20</button>`
        : `<button type="button" class="edit-step" data-step="-5">−5</button>
           <button type="button" class="edit-step" data-step="-10">−10</button>
           <button type="button" class="edit-step" data-step="-15">−15</button>
           <button type="button" class="edit-step" data-step="-20">−20</button>`;
      panelHtml=`
        <div class="edit-panel">
          <div class="edit-mode-row">
            <button type="button" class="mode-btn${isC?' active':''}" id="btn-charge">+ Charge</button>
            <button type="button" class="mode-btn${inlineMode==='drain'?' active':''}" id="btn-drain">− Use</button>
          </div>
          ${inlineMode?`
            <div class="reason-header">
              <span class="reason-label">SELECT CATEGORY</span>
              <button type="button" class="reason-edit-btn" id="btn-edit-reasons">${editingReasons?'Done':'Edit'}</button>
            </div>
            <div class="reason-grid">${chipsHtml}</div>
            ${editingReasons?`<div class="add-reason-row">
              <input type="text" id="new-reason-input" class="add-reason-input" placeholder="Add item…"/>
              <button type="button" id="btn-add-reason" class="add-reason-btn">+ Add</button>
            </div>`:''}
            ${selectedReason?`
              <div class="edit-step-row">${stepHtml}</div>
              <div class="edit-drag-label">Drag the battery for any amount</div>
              <div class="edit-actions">
                <button type="button" class="cancel-btn" id="btn-cancel">Cancel</button>
                <button type="button" class="apply-btn" id="btn-apply">Done${delta!==0?` · ${delta>0?'+':''}${delta}%`:''}</button>
              </div>`
            :`<div class="edit-choose-hint">Choose a category first.</div>`}`
          :`<div class="edit-choose-hint">Choose Charge or Use first.</div>`}
        </div>`;
    }

    return `
      <div class="minimal-home">
        <button type="button" class="minimal-tab home-progress-btn" id="open-progress">Progress</button>
        <div class="day-question">
          <span class="day-question-label">How was your day?</span>
          <textarea class="day-question-text" id="daily-note" rows="2" maxlength="120" placeholder="">${esc(note)}</textarea>
        </div>
        <div class="condition-row">
          <span class="condition-label">Condition</span>
          <div class="condition-options">
            ${['good','normal','low'].map(c=>`<button type="button" class="condition-btn${getTodayCondition()===c?' active':''}" data-condition="${c}">${CONDITION_LABELS[c]}</button>`).join('')}
          </div>
          <span class="condition-rate">${CONDITION_RATES[getTodayCondition()].toFixed(1)}%/h</span>
        </div>
        ${cur<20
          ? `<div class="battery-status danger">DANGER · LOW ENERGY</div>`
          : cur>=80
            ? `<div class="battery-status high">CAREFUL · ENERGY TOO HIGH</div>`
            : ''}
        ${(()=>{
          const f=forecastText();
          const l=sinceLast?lastOpenText():'';
          const s=(healthInfo&&healthInfo.date===todayKey())?`Sleep ${fmtHM(healthInfo.hours)} · ${CONDITION_LABELS[healthInfo.level]}`:'';
          return `<div class="battery-info">${f?`<div class="forecast">${f}</div>`:''}${s?`<div class="last-open">${s}</div>`:''}${l?`<div class="last-open">${l}</div>`:''}</div>`;
        })()}
        <div class="battery-stage">
          <div class="minimal-battery-wrap" id="batt-touch">
            <div class="minimal-battery-shell">
              <div class="minimal-battery-fill ${cur<=20?'low':cur>=80?'over':''}" style="width:${fill}%"></div>
              <div class="minimal-battery-percent">${cur}%</div>
            </div>
            <div class="minimal-battery-cap ${cur>=80?'over':'' }"></div>
          </div>
        </div>
        <div class="home-actions">
          <button type="button" class="minimal-tab" id="open-routine">Routine</button>
          <button type="button" class="minimal-edit" id="minimal-edit">${isEditing?'Close':'Edit'}</button>
        </div>
        ${panelHtml}${sleepPopupHtml()}${routinePopupHtml()}
      </div>`;
  }

  function renderProgress(){
    const yr=progressMonth.getFullYear(), mo=progressMonth.getMonth();
    const pfx=`${yr}-${String(mo+1).padStart(2,'0')}-`;
    const days=new Date(yr,mo+1,0).getDate();
    const leadBlanks=(new Date(yr,mo,1).getDay()+6)%7;
    const todayStr=todayKey();
    const mitems=(data.items||[]).filter(it=>it.date&&it.date.startsWith(pfx));
    const monthDelta=mitems.reduce((sum,it)=>sum+(Number(it.delta)||0),0);
    const changeCount=mitems.length;
    const wkHtml=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span class="month-weekday-label">${d}</span>`).join('');
    let cells='';
    for(let i=0;i<leadBlanks;i++) cells+=`<div class="month-cell empty"></div>`;
    for(let d=1;d<=days;d++){
      const k=`${pfx}${String(d).padStart(2,'0')}`;
      const di=(data.items||[]).filter(it=>it.date===k);
      const note=!!data.comments?.[k];
      const net=di.reduce((sum,it)=>sum+(Number(it.delta)||0),0);
      const sign=net>0?'+':net<0?'−':'';
      const val=Math.abs(net);
      cells+=`<div class="month-cell${k===todayStr?' today':''}${k===selectedDay?' selected':''}" data-daykey="${k}">
        <span class="month-day-num">${d}</span>
        ${di.length?`<span class="month-day-delta ${net>=0?'positive':'negative'}">${sign}${val}</span>`:''}
        ${note?`<span class="month-note-mark"></span>`:''}
      </div>`;
    }

    let detailHtml='';
    if(selectedDay){
      const di2=(data.items||[]).filter(it=>it.date===selectedDay).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
      const [yy,mm,dd]=selectedDay.split('-').map(Number);
      const ld=new Date(yy,mm-1,dd);
      const iHtml=di2.length
        ?di2.map(it=>{
          const d=Number(it.delta)||0;
          const sign=d>0?'+':'';
          return `<div class="day-detail-item"><span class="type-pill${d<0?' drain':''}">${sign}${d}%</span><span>${esc(it.text||'')}</span></div>`;
        }).join('')
        :`<div style="padding:7px 0;color:#444;font-size:11px">No changes this day.</div>`;
      const cmt=data.comments?.[selectedDay];
      detailHtml=`<div class="day-detail">
        <div class="day-detail-title">${DAYS_SHORT[ld.getDay()]}, ${MONTHS_SHORT[mm-1]} ${dd}</div>
        ${cmt?`<div class="progress-note">${esc(cmt)}</div>`:''}
        <div class="progress-activity-title">Changes</div>
        ${iHtml}
      </div>`;
    }

    // Reconstruct a rough start/end level for the selected date from recorded changes.
    // Natural drain is not logged per event, so historical levels are an estimate.
    const allItems=(data.items||[]).slice().sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    const selectedItems=selectedDay?allItems.filter(it=>it.date===selectedDay):[];
    const dayNet=selectedItems.reduce((sum,it)=>sum+(Number(it.delta)||0),0);
    const laterNet=selectedDay?allItems.filter(it=>it.date>selectedDay).reduce((sum,it)=>sum+(Number(it.delta)||0),0):0;
    const estimatedEnd=Math.max(0,Math.min(100,batteryLevel-laterNet));
    const estimatedStart=Math.max(0,Math.min(100,estimatedEnd-dayNet));
    const levelTransition=selectedDay?`${estimatedStart}% → ${estimatedEnd}%`:'';

    return `
      <div class="minimal-progress">
        <div class="progress-head">
          <span class="progress-title">Progress</span>
          <span class="progress-current">${batteryLevel}%</span>
        </div>
        <div class="progress-month-nav">
          <span class="progress-month-title">${MONTHS_FULL[mo]} ${yr}</span>
          <div><button class="progress-nav-btn" id="prev-month">‹</button><button class="progress-nav-btn" id="next-month">›</button></div>
        </div>
        <div class="month-weekday-row">${wkHtml}</div>
        <div class="month-grid">${cells}</div>
        <div class="progress-summary"><span>${changeCount} changes</span><span>${selectedDay?levelTransition:`${monthDelta>=0?'+':''}${monthDelta}% net`}</span></div>
        ${detailHtml}
        ${(()=>{
          const ranks={};
          (data.items||[]).forEach(it=>{
            const name=(it.text||'').trim() || 'Untitled';
            if(!ranks[name]) ranks[name]={plus:0,minus:0};
            const d=Number(it.delta)||0;
            if(d>0) ranks[name].plus+=d;
            if(d<0) ranks[name].minus+=Math.abs(d);
          });
          const makeRows=(key,sign)=>{
            const rows=Object.entries(ranks)
              .filter(([_,r])=>r[key]>0)
              .sort((a,b)=>b[1][key]-a[1][key])
              .slice(0,3);
            return Array.from({length:3},(_,i)=>{
              if(rows[i]){
                const [name,r]=rows[i];
                return `<div class="rank-row">
                  <span class="rank-no">${i+1}</span>
                  <span class="rank-name">${esc(name)}</span>
                  <span class="rank-total">${sign}${r[key]}</span>
                </div>`;
              }
              return `<div class="rank-row rank-empty">
                <span class="rank-no">${i+1}</span>
                <span class="rank-name">—</span>
                <span class="rank-total">—</span>
              </div>`;
            }).join('');
          };
          const mode = window.__caruRankMode || 'charge';
          const isCharge = mode === 'charge';
          const symbol = isCharge ? '+' : '−';
          const key = isCharge ? 'plus' : 'minus';
          return `<div class="activity-section ranking-section">
            <div class="ranking-head-row">
              <div class="activity-section-title">By category</div>
              <div class="rank-switch" role="tablist">
                <button type="button" class="rank-switch-btn ${isCharge?'active':''}" data-rank-mode="charge">+ Charge</button>
                <button type="button" class="rank-switch-btn ${!isCharge?'active':''}" data-rank-mode="drain">− Use</button>
              </div>
            </div>
            <div class="rank-block">
              <div class="rank-header"><span></span><span>Category</span><span>Total</span></div>
              <div class="rank-list">${makeRows(key,symbol)}</div>
            </div>
          </div>`;
        })()}
        <div class="sync-box">
          <div class="activity-section-title">Health sync</div>
          <button type="button" class="sync-copy" id="copy-sync">Copy sync URL</button>
          <div class="sync-id">${esc(userId)}</div>
        </div>
      </div>
      <button type="button" class="progress-home" id="open-home">Home</button>`;
  }

  function render(){
    if(routineDragging) return;
    applyTheme();
    root.innerHTML=`
      ${activeTab==='home'?renderHome():activeTab==='routine'?renderRoutine():renderProgress()}`;
    bindEvents();
  }

  function bindEvents(){
    root.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{ activeTab=b.dataset.tab; inlineMode=null; render(); }));

    if(activeTab==='home'){
      document.getElementById('minimal-edit')?.addEventListener('click',()=>{
        editOpen=!editOpen;
        if(!editOpen){ inlineMode=null; editingReasons=false; }
        else{ inlineMode=null; editingReasons=false; }
        render();
      });

      document.getElementById('open-progress')?.addEventListener('click',()=>{
        activeTab='progress'; editOpen=false; inlineMode=null; editingReasons=false; render();
      });
      document.getElementById('open-routine')?.addEventListener('click',()=>{
        activeTab='routine'; editOpen=false; inlineMode=null; editingReasons=false; editingRoutineId=null; render();
      });

      root.querySelectorAll('[data-sleep]').forEach(b=>b.addEventListener('click',()=>applySleep(b.dataset.sleep)));
      document.getElementById('sleep-skip')?.addEventListener('click',skipSleep);

      const rbat=document.getElementById('routine-bat');
      if(rbat&&routineDraft){
        const setT=(clientX)=>{
          const rect=rbat.getBoundingClientRect();
          routineDraft.target=Math.max(0,Math.min(100,Math.round(((clientX-rect.left)/rect.width)*100)));
          paintRoutine();
        };
        rbat.addEventListener('pointerdown',e=>{ routineDragging=true; rbat.setPointerCapture?.(e.pointerId); setT(e.clientX); });
        rbat.addEventListener('pointermove',e=>{ if(routineDragging) setT(e.clientX); });
        const endDrag=()=>{ routineDragging=false; };
        rbat.addEventListener('pointerup',endDrag);
        rbat.addEventListener('pointercancel',endDrag);
        paintRoutine();
      }
      document.getElementById('routine-skip')?.addEventListener('click',skipRoutine);
      document.getElementById('routine-done')?.addEventListener('click',applyRoutine);

      const noteEl=document.getElementById('daily-note');

      noteEl?.addEventListener('focus',()=>{
        isTypingNote=true;
      });

      noteEl?.addEventListener('blur',()=>{
        isTypingNote=false;
        clearTimeout(window.__caruNoteTimer);
        save();
      });

      noteEl?.addEventListener('input',()=>{
        data.comments[todayKey()]=noteEl.value;
        clearTimeout(window.__caruNoteTimer);
        window.__caruNoteTimer=setTimeout(()=>save(),500);
      });

      root.querySelectorAll('[data-condition]').forEach(btn=>btn.addEventListener('click',async()=>{
        setTodayCondition(btn.dataset.condition);
        await save();
        render();
      }));

      const bt=document.getElementById('batt-touch');
      if(bt && inlineMode){
        const shell=bt.querySelector('.minimal-battery-shell');
        let dragging=false;
        const doDrag=(clientX)=>{
          if(!shell) return;
          const rect=shell.getBoundingClientRect();
          let pct=Math.round(((clientX-rect.left)/rect.width)*100);
          pct=Math.max(0,Math.min(100,pct));
          if(inlineMode==='charge') targetBattery=Math.max(batteryLevel,pct);
          else targetBattery=Math.min(batteryLevel,pct);
          const fillEl=bt.querySelector('.minimal-battery-fill');
          const pctEl=bt.querySelector('.minimal-battery-percent');
          if(fillEl) fillEl.style.width=Math.max(0,Math.min(100,targetBattery))+'%';
          if(pctEl) pctEl.textContent=targetBattery+'%';
        };
        bt.addEventListener('pointerdown',e=>{ dragging=true; bt.setPointerCapture?.(e.pointerId); doDrag(e.clientX); });
        bt.addEventListener('pointermove',e=>{ if(dragging) doDrag(e.clientX); });
        bt.addEventListener('pointerup',()=>{ dragging=false; });
        bt.addEventListener('pointercancel',()=>{ dragging=false; });
      }

      document.getElementById('btn-charge')?.addEventListener('click',()=>{
        editOpen=true; inlineMode='charge'; selectedReason=''; targetBattery=batteryLevel;
        editingReasons=false; render();
      });
      document.getElementById('btn-drain')?.addEventListener('click',()=>{
        editOpen=true; inlineMode='drain'; selectedReason=''; targetBattery=batteryLevel;
        editingReasons=false; render();
      });

      root.querySelectorAll('[data-step]').forEach(btn=>btn.addEventListener('click',()=>{
        const step=parseInt(btn.dataset.step,10);
        // Preset buttons set a fresh amount from the current battery;
        // they do not accumulate with previous preset clicks.
        targetBattery=batteryLevel+step;
        targetBattery=Math.max(0,Math.min(100,targetBattery));
        render();
      }));

      root.querySelectorAll('[data-reason-click]').forEach(chip=>chip.addEventListener('click',e=>{
        if(e.target.closest('[data-reason-del]')) return;
        selectedReason=chip.dataset.reasonClick; render();
      }));

      document.getElementById('btn-edit-reasons')?.addEventListener('click',()=>{
        if(!inlineMode) return;
        editingReasons=!editingReasons; render();
      });

      root.querySelectorAll('[data-reason-del]').forEach(btn=>btn.addEventListener('click',async e=>{
        e.stopPropagation();
        const v=btn.dataset.reasonDel;
        if(inlineMode==='charge'){
          data.chargeReasons=(data.chargeReasons||DEF_CHARGE).filter(r=>r!==v);
          if(selectedReason===v) selectedReason=data.chargeReasons[0]||'';
        }else{
          data.drainReasons=(data.drainReasons||DEF_DRAIN).filter(r=>r!==v);
          if(selectedReason===v) selectedReason=data.drainReasons[0]||'';
        }
        await save(); render();
      }));

      const addBtn=document.getElementById('btn-add-reason');
      const addInp=document.getElementById('new-reason-input');
      async function addReason(){
        if(!addInp) return;
        const v=addInp.value.trim(); if(!v) return;
        if(inlineMode==='charge'){
          if(!data.chargeReasons) data.chargeReasons=[...DEF_CHARGE];
          if(!data.chargeReasons.includes(v)) data.chargeReasons.push(v);
        }else{
          if(!data.drainReasons) data.drainReasons=[...DEF_DRAIN];
          if(!data.drainReasons.includes(v)) data.drainReasons.push(v);
        }
        selectedReason=v; await save(); render();
      }
      addBtn?.addEventListener('click',addReason);
      addInp?.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); addReason();} });

      document.getElementById('btn-cancel')?.addEventListener('click',()=>{
        editOpen=false; inlineMode=null; editingReasons=false; render();
      });

      document.getElementById('btn-apply')?.addEventListener('click',async()=>{
        const delta=targetBattery-batteryLevel;
        if(delta!==0){
          batteryLevel=targetBattery;
          // 수동 변경은 자연 감소 계산과 분리되어 있어 그대로 유지된다
          if(!data.items) data.items=[];
          const reasonListKey=inlineMode==='charge'?'chargeReasons':'drainReasons';
          if(!data[reasonListKey]) data[reasonListKey]=inlineMode==='charge'?[...DEF_CHARGE]:[...DEF_DRAIN];
          if(selectedReason && !data[reasonListKey].includes(selectedReason)) data[reasonListKey].push(selectedReason);
          data.items.push({id:uid(),type:inlineMode==='charge'?'heal':'plan',delta,text:selectedReason,date:todayKey(),timestamp:Date.now()});
          await save();
        }
        editOpen=false; inlineMode=null; editingReasons=false; render();
      });
    }

    if(activeTab==='routine'){
      document.getElementById('open-home')?.addEventListener('click',()=>{ activeTab='home'; editingRoutineId=null; render(); });
      root.querySelectorAll('[data-redit]').forEach(b=>b.addEventListener('click',()=>{
        editingRoutineId=editingRoutineId===b.dataset.redit?null:b.dataset.redit; render();
      }));
      document.getElementById('routine-add')?.addEventListener('click',async()=>{
        if(!Array.isArray(data.routines)) data.routines=[];
        const id=uid();
        data.routines.push({id,name:'Routine',start:'09:00',end:'18:00',days:[1,2,3,4,5]});
        editingRoutineId=id; await save(); render();
      });
      root.querySelectorAll('[data-rdel]').forEach(b=>b.addEventListener('click',async()=>{
        if(!confirm('Delete this routine?')) return;
        data.routines=getRoutines().filter(r=>r.id!==b.dataset.rdel);
        editingRoutineId=null; await save(); render();
      }));
      root.querySelectorAll('[data-rday]').forEach(b=>b.addEventListener('click',async()=>{
        const r=getRoutines().find(x=>x.id===b.dataset.rid); if(!r) return;
        const d=Number(b.dataset.rday), set=new Set(Array.isArray(r.days)?r.days:[]);
        if(set.has(d)) set.delete(d); else set.add(d);
        r.days=[...set].sort(); await save(); render();
      }));
      root.querySelectorAll('.routine-edit [data-rf]').forEach(inp=>inp.addEventListener('change',async()=>{
        const r=getRoutines().find(x=>x.id===inp.closest('.routine-edit').dataset.rid); if(!r) return;
        const f=inp.dataset.rf; let v=inp.value;
        if(f==='name') v=v.trim()||'Routine';
        else if(!Number.isFinite(parseHM(v))){ render(); return; }
        r[f]=v; await save();
      }));
    }

    if(activeTab==='progress'){
      document.getElementById('open-home')?.addEventListener('click',()=>{ activeTab='home'; editOpen=false; inlineMode=null; render(); });
      document.getElementById('copy-sync')?.addEventListener('click',async()=>{
        const url=`${firebaseConfig.databaseURL}/health/${userId}.json`;
        try{ await navigator.clipboard.writeText(url); alert('Copied'); }
        catch(e){ window.prompt('Copy this URL',url); }
      });
      root.querySelectorAll('[data-rank-mode]').forEach(btn=>btn.addEventListener('click',()=>{ window.__caruRankMode=btn.dataset.rankMode; render(); }));
      document.getElementById('prev-month')?.addEventListener('click',()=>{ progressMonth=new Date(progressMonth.getFullYear(),progressMonth.getMonth()-1,1); selectedDay=null; render(); });
      document.getElementById('next-month')?.addEventListener('click',()=>{ progressMonth=new Date(progressMonth.getFullYear(),progressMonth.getMonth()+1,1); selectedDay=null; render(); });
      root.querySelectorAll('[data-daykey]').forEach(c=>{ if(c.classList.contains('empty')) return; c.addEventListener('click',()=>{ const k=c.dataset.daykey; selectedDay=selectedDay===k?null:k; render(); }); });
    }
  }

  let naturalDrainTimer=null;

  function startNaturalDrainTimer(){
    clearInterval(naturalDrainTimer);

    naturalDrainTimer=setInterval(async()=>{
      const changed=applyNaturalDrain();

      if(changed){
        data.battery=batteryLevel;
        data.lastBatteryUpdate=lastBatteryUpdate;
        localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

        if(firebaseEnabled&&db){
          try{
            await db.ref('users/'+userId).set(data);
          }catch(e){}
        }

        if(!isTypingNote) render();
      } else if(activeTab==='home'&&!isTypingNote&&!editOpen&&!document.querySelector('.sleep-overlay')&&(sleepPromptDue()||routineDueList().length)){
        render(); // 루틴 종료 시각이 지나 팝업이 떠야 할 때
      }
    },60000);
  }

  load().then(()=>{
    startNaturalDrainTimer();
  });

  // 홈 화면 앱을 백그라운드에서 다시 열었을 때도 갱신
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      const opened=markOpened(false);
      if((opened||sleepPromptDue()||routineDueList().length) && !isTypingNote) render();
    }
  });
})();
</script>
</body>
</html>
