<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Caru" />
<meta name="theme-color" content="#fbfaf8" />
<title>Caru</title>

<!-- Firebase App & Database (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#151515; --paper:#fbfaf8; --muted:#8f8a82; --faint:#e4dfd6;
    --hover:#f2efe9; --band:#efece5; --divider:#e6e1d8;
  }
  html[data-theme="dark"]{
    --ink:#f3f1ec; --paper:#121110; --muted:#8a8378; --faint:#332f2a;
    --hover:#1d1b18; --band:#1e1c19; --divider:#2c2925;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; -webkit-font-smoothing:antialiased;
    transition:background 0.15s ease, color 0.15s ease;
  }
  #root{ 
    max-width:420px; margin:0 auto; 
    padding: calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 80px); 
    min-height:100vh; 
  }

  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .top-left{ display:flex; align-items:center; gap:8px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  .sync-badge{ font-family:'JetBrains Mono', monospace; font-size:9.5px; padding:2px 6px; border-radius:8px; border:1px solid var(--muted); color:var(--muted); }
  .sync-badge.online{ border-color:var(--ink); color:var(--ink); font-weight:600; }
  .theme-toggle{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:5px 11px; border-radius:12px; cursor:pointer; }
  .theme-toggle:hover{ background:var(--hover); }

  /* 탭: + / - 미니멀 기호 */
  .tabs{ display:flex; gap:18px; margin-bottom:22px; border-bottom:1px solid var(--divider); }
  .tab-btn{ background:none; border:none; cursor:pointer; padding:0 0 10px; font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:0.05em; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); font-weight:700; }

  .date-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.01em; margin:0 0 12px; }

  .list{ list-style:none; margin:0 0 4px; padding:0; }
  .item{ display:flex; align-items:center; gap:9px; padding:12px 2px; border-bottom:1px solid var(--divider); }
  
  /* 뱃지 대비: Charge는 아웃라인 맑음, Drain은 솔리드 묵직함 */
  .type-pill{
    flex:none; font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:10px; border:1.3px solid var(--ink); color:var(--ink); background:transparent;
    white-space:nowrap;
  }
  .type-pill.plan{ background:var(--ink); color:var(--paper); }
  
  .item-text{ flex:1; font-size:15px; line-height:1.4; word-break:break-word; }
  .item.done .item-text{ text-decoration:line-through; color:var(--muted); }

  /* 1번 대비: Charge는 동그란 원형(○), Drain은 각진 네모(□) */
  .check-btn{
    flex:none; width:22px; height:22px; border:1.5px solid var(--ink);
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:11px; padding:0; color:transparent; transition:all .12s;
  }
  .check-btn.charge-round{ border-radius:50%; } /* 원형 */
  .check-btn.drain-square{ border-radius:4px; }  /* 각진 사각 */
  
  .item.done .check-btn{ background:var(--ink); color:var(--paper); font-weight:700; }

  .del-btn{ flex:none; width:24px; height:24px; border:none; background:none; color:var(--muted); font-size:18px; cursor:pointer; line-height:1; }
  .del-btn:hover{ color:var(--ink); }

  .item-empty{ padding:24px 2px; color:var(--muted); font-size:13.5px; text-align:center; }

  .add-block{ margin-top:18px; padding-top:18px; border-top:1px solid var(--ink); }
  .comment-block{ margin-top:8px; margin-bottom:18px; }
  
  .main-note .comment-textarea{ min-height:48px; height:48px; font-size:13.5px; padding:9px 12px; }
  .comment-textarea{
    width:100%; border:1.3px solid var(--ink); border-radius:10px;
    font-family:'Inter', sans-serif; line-height:1.4;
    color:var(--ink); background:var(--paper); resize:none; outline:none;
  }
  .comment-textarea::placeholder{ color:var(--muted); }
  .picker-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }

  /* 카테고리 칩: 검은색(#000000) 테두리 유지 */
  .word-grid{
    display:flex; flex-wrap:wrap; gap:6px 7px; margin-bottom:14px;
    align-items:center;
  }
  .word-item{
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    padding:6px 10px; 
    border:1.5px solid #000000;
    border-radius:6px;
    background:transparent; cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-size:12px; letter-spacing:.01em;
    color:var(--muted); text-align:center; transition:all .15s ease;
  }
  .word-item.active{
    background:var(--ink); color:var(--paper); border-color:var(--ink);
  }
  .word-item:hover{ border-color:var(--ink); color:var(--ink); }

  .word-item-remove{
    position:absolute; top:-5px; right:-4px; width:16px; height:16px; border-radius:50%;
    background:var(--ink); color:var(--paper); border:1px solid var(--paper); font-size:9px;
    line-height:14px; text-align:center; cursor:pointer; padding:0;
  }

  .add-row{ display:flex; align-items:center; gap:10px; }
  .add-input{ flex:1; border:none; outline:none; font-family:'Inter', sans-serif; font-size:15px; background:transparent; color:var(--ink); border-bottom:1.3px solid var(--ink); padding:6px 0; border-radius:0; }
  .add-input::placeholder{ color:var(--muted); }
  .add-submit-btn{ flex:none; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:11px; padding:9px 16px; border-radius:16px; cursor:pointer; }

  /* 3번 대비: Charge는 아웃라인(라이트), Drain은 솔리드(묵직함) */
  .single-btn{
    width:100%; border:1.3px solid var(--ink);
    font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:600;
    padding:12px 10px; border-radius:12px; cursor:pointer; margin-top:14px;
    transition:opacity .15s, transform .1s;
  }
  .single-btn.charge-btn{ background:var(--paper); color:var(--ink); } /* 맑은 테두리 */
  .single-btn.drain-btn{ background:var(--ink); color:var(--paper); }   /* 꽉 찬 블랙 */
  .single-btn:active{ transform:scale(0.98); opacity:0.9; }

  /* 주간 네비 & 7개 요일 바 */
  .week-nav-bar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
  }
  .week-nav-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  .week-grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin-bottom:18px;
  }
  .week-cell{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px 2px; border:1px solid var(--divider); border-radius:10px;
    background:var(--paper); cursor:pointer; transition:all .15s;
  }
  .week-cell.today{ border-color:var(--muted); }
  .week-cell.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600; }
  .week-cell.active .week-dow{ color:var(--paper); opacity:0.8; }
  .week-dow{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--muted); margin-bottom:2px; }
  .week-daynum{ font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600; }
  .week-dot-count{ font-size:9.5px; font-family:'JetBrains Mono', monospace; margin-top:2px; }

  /* 요일 반복 선택 패널 */
  .routine-edit-panel{
    margin:12px 0 16px; padding:14px; border:1px solid var(--ink); border-radius:12px;
    background:var(--band);
  }
  .days-picker-row{ display:flex; gap:5px; margin-bottom:8px; }
  .day-pick-btn{
    flex:1; padding:7px 2px; border:1.5px solid #000000; border-radius:6px;
    background:var(--paper); cursor:pointer; font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:600; color:var(--muted); text-align:center; transition:all .12s;
  }
  .day-pick-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  
  .presets-row{ display:flex; gap:12px; margin-bottom:10px; }
  .preset-link{
    background:none; border:none; padding:0; font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:.02em; color:var(--muted); text-decoration:underline;
    cursor:pointer; text-underline-offset:2px;
  }
  .preset-link:hover{ color:var(--ink); }

  .routine-badge{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--muted);
    border:1px solid var(--divider); padding:1px 5px; border-radius:6px; margin-left:6px;
  }

  .text-toggle-btn{
    border:0; background:none; color:var(--ink); padding:0; margin:0 0 12px 1px;
    font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700;
    line-height:1; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .text-toggle-btn.active{ text-decoration:underline; text-underline-offset:3px; }

  /* Progress 탭 스타일 */
  .progress-summary-bar{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:12px 0 16px; margin-bottom:14px; border-bottom:1px solid var(--divider);
  }
  .sub-counts{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }
  .streak-row{ display:flex; align-items:baseline; gap:6px; }
  .streak-value{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; color:var(--ink); }
  .streak-label{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); }

  .section-title{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
  .nav-btn{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:4px 9px; border-radius:8px; cursor:pointer; }

  .month-weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .month-weekday-label{ font-family:'JetBrains Mono', monospace; font-size:8.5px; color:var(--muted); text-transform:uppercase; text-align:center; }
  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:2px; }
  .month-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    border:1px solid transparent; border-radius:9px; cursor:pointer; background:var(--paper); transition:background .12s;
  }
  .month-cell.empty{ cursor:default; }
  .month-cell:not(.empty):hover{ background:var(--hover); }
  .month-cell.selected{ background:var(--band); border-color:var(--ink); }
  .day-detail{ margin-top:18px; border:1px solid var(--ink); border-radius:14px; padding:16px; }
  .day-detail-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; margin-bottom:10px; }
  .day-detail-item{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px; }
  .day-detail-comment{ margin-top:10px; padding-top:10px; border-top:1px solid var(--divider); font-size:13.5px; line-height:1.5; color:var(--ink); white-space:pre-wrap; }
  .day-detail-empty{ color:var(--muted); font-size:13px; }
  .month-daynum{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink); }
  .month-dot{ width:6px; height:6px; border-radius:50%; border:1.2px solid var(--faint); }
  .month-dot.positive{ background:var(--ink); border-color:var(--ink); }
  .month-dot.negative{ background:transparent; border-color:var(--ink); }
  .month-cell.today{ border-color:var(--ink); }
  .month-cell.today .month-daynum{ color:var(--ink); font-weight:700; }

  .progress-calendar-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin:14px 0 12px;
  }
  .progress-calendar-nav{ display:flex; align-items:center; gap:4px; margin-bottom:10px; }
  .progress-calendar-nav .nav-btn{
    border:0; background:none; color:inherit; font:inherit; font-weight:700;
    font-size:20px; line-height:1; padding:0 5px; margin:0; cursor:pointer;
    -webkit-appearance:none; appearance:none;
  }
  .progress-calendar-nav .month-current{
    font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600;
    letter-spacing:-.02em; margin:0 2px;
  }

  /* 통계 섹션 */
  .stats-section{ margin-top:28px; }
  .stats-toggle-row{ display:flex; gap:8px; margin-bottom:14px; }
  .stats-tab-btn{
    flex:1; padding:9px 10px; border:1.3px solid var(--divider); border-radius:10px;
    background:var(--paper); color:var(--muted); font-family:'JetBrains Mono', monospace;
    font-size:11.5px; font-weight:600; cursor:pointer; text-align:center; transition:all .15s;
  }
  .stats-tab-btn.active{ border-color:var(--ink); background:var(--band); color:var(--ink); }
  .stats-box{ border:1px solid var(--divider); border-radius:12px; padding:14px; background:var(--paper); }
  .stat-row{ margin-bottom:12px; }
  .stat-row:last-child{ margin-bottom:0; }
  .stat-label-row{ display:flex; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:13.5px; margin-bottom:4px; }
  .stat-pct{ font-family:'JetBrains Mono', monospace; font-weight:600; color:var(--ink); }
  .stat-bar-track{ width:100%; height:6px; background:var(--divider); border-radius:3px; overflow:hidden; }
  .stat-bar-fill{ height:100%; background:var(--ink); border-radius:3px; }

  .status{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); text-align:center; padding:60px 0; }
  .icon-search-row{ display:flex; gap:8px; margin-bottom:10px; }
  .icon-search-row .add-input{ border:1.3px solid var(--faint); border-radius:10px; padding:9px 12px; }
  .icon-search-row .add-input:focus{ border-color:var(--ink); }
</style>
</head>
<body>
<div id="root"><div class="status">Loading…</div></div>

<script>
(function(){
  // ==========================================
  // ⚙️ Firebase 설정
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyCitVETsMx-5ax48t4UViBT8DyIMOiB0sM",
    authDomain: "zero-3dfef.firebaseapp.com",
    databaseURL: "https://zero-3dfef-default-rtdb.firebaseio.com",
    projectId: "zero-3dfef",
    storageBucket: "zero-3dfef.firebasestorage.app",
    messagingSenderId: "59219649844",
    appId: "1:59219649844:web:38546f1960e27abac83161",
    measurementId: "G-VDFG7XTY64"
  };

  let userId = localStorage.getItem('caru_device_user_id');
  if (!userId) {
    userId = 'usr_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
    localStorage.setItem('caru_device_user_id', userId);
  }

  let db = null;
  let firebaseEnabled = false;

  if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      firebaseEnabled = true;
    } catch(e) {
      console.warn("Firebase 연결 대기:", e);
    }
  }

  const STORAGE_KEY = 'caru_data_' + userId;
  const root = document.getElementById('root');
  const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAY_NAMES_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const WEEKDAY_ORDER = [1, 2, 3, 4, 5, 6, 0];

  // 카테고리 분리 정의
  const CHARGE_DEFAULT_KEYS = ['sleep','music','brush','heart','users','cook','walk','coffee','game','plant'];
  const CHARGE_DEFAULT_LABELS = {
    sleep:'Sleep', music:'Music', brush:'Hobby', heart:'Self-care', users:'Hang out',
    cook:'Cooking', walk:'Walk', coffee:'Break', game:'Gaming', plant:'Garden'
  };

  const DRAIN_DEFAULT_KEYS = ['brief','car','book','run','broom','shirt','pill','pencil','home','tv'];
  const DRAIN_DEFAULT_LABELS = {
    brief:'Work', car:'Commute', book:'Study', run:'Exercise', broom:'Chores',
    shirt:'Laundry', pill:'Medicine', pencil:'Journal', home:'Housework', tv:'Watch'
  };

  function getChargeCategories(){
    const hidden = data.chargeHiddenIconKeys || [];
    return CHARGE_DEFAULT_KEYS.filter(k => !hidden.includes(k)).concat(data.chargeCustomIconKeys || []);
  }
  function getDrainCategories(){
    const hidden = data.drainHiddenIconKeys || [];
    return DRAIN_DEFAULT_KEYS.filter(k => !hidden.includes(k)).concat(data.drainCustomIconKeys || []);
  }

  function labelForCategory(key, type){
    if(type === 'charge'){
      if(data.chargeCustomLabels && data.chargeCustomLabels[key]) return data.chargeCustomLabels[key];
      if(CHARGE_DEFAULT_LABELS[key]) return CHARGE_DEFAULT_LABELS[key];
    } else {
      if(data.drainCustomLabels && data.drainCustomLabels[key]) return data.drainCustomLabels[key];
      if(DRAIN_DEFAULT_LABELS[key]) return DRAIN_DEFAULT_LABELS[key];
    }
    return key.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function dkeyFromDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return dkeyFromDate(new Date()); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    const mon = new Date(date.setDate(diff));
    mon.setHours(0,0,0,0);
    return mon;
  }

  let data = {
    items: [],
    comments: {},
    chargeRoutines: [],
    drainRoutines: [],
    chargeCustomIconKeys: [], chargeHiddenIconKeys: [], chargeCustomLabels: {},
    drainCustomIconKeys: [], drainHiddenIconKeys: [], drainCustomLabels: {}
  };

  let theme = 'light';
  let activeTab = 'charge';
  let newItemText = '';

  let currentChargeIcon = CHARGE_DEFAULT_KEYS[0];
  let currentDrainIcon = DRAIN_DEFAULT_KEYS[0];

  let chargeIconEditMode = false;
  let drainIconEditMode = false;

  let chargeEditRoutineMode = false;
  let drainEditRoutineMode = false;

  let selectedChargeRoutineDays = [1, 2, 3, 4, 5, 6, 0]; // Charge는 기본 매일
  let selectedDrainRoutineDays = [1, 2, 3, 4, 5];         // Drain은 기본 평일

  let currentWeekMonday = getMonday(new Date());
  let selectedChargeDate = todayKey();
  let selectedDrainDate = todayKey();

  let progressMonthCursor = new Date();
  progressMonthCursor.setHours(0,0,0,0);
  progressMonthCursor.setDate(1);
  let selectedProgressDay = null;

  let activeStatsTab = 'charge';

  function applyTheme(){
    if(theme === 'dark') {
      document.documentElement.setAttribute('data-theme','dark');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#121110');
    } else {
      document.documentElement.removeAttribute('data-theme');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#fbfaf8');
    }
  }

  function currentStreak(){
    let streak = 0;
    let cursor = new Date();
    while(true){
      const key = dkeyFromDate(cursor);
      const dayItems = data.items.filter(it => it.date === key);
      if(dayItems.length === 0) break;
      const net = dayItems.reduce((s, it) => s + (it.type === 'heal' ? 1 : -1), 0);
      if(net < 0) break;
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function totalCounts(){
    let healDone = 0, planDone = 0;
    data.items.forEach(it => {
      if(it.type === 'heal') healDone += 1;
      else planDone += 1;
    });
    return { healDone, planDone };
  }

  async function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : {};
    }catch(e){ data = {}; }
    
    if(!data.items) data.items = [];
    if(!data.comments) data.comments = {};
    if(!data.chargeRoutines) {
      data.chargeRoutines = [
        { id: 'rt_c_sleep', text: 'Sleep 8h', icon: 'sleep', days: [1,2,3,4,5,6,0] }
      ];
    }
    if(!data.drainRoutines) {
      data.drainRoutines = data.routines || [
        { id: 'rt_d_commute', text: 'Commute', icon: 'car', days: [1,2,3,4,5] }
      ];
    }
    if(!data.chargeCustomIconKeys) data.chargeCustomIconKeys = [];
    if(!data.chargeHiddenIconKeys) data.chargeHiddenIconKeys = [];
    if(!data.chargeCustomLabels) data.chargeCustomLabels = {};
    if(!data.drainCustomIconKeys) data.drainCustomIconKeys = [];
    if(!data.drainHiddenIconKeys) data.drainHiddenIconKeys = [];
    if(!data.drainCustomLabels) data.drainCustomLabels = {};

    theme = localStorage.getItem('caru-theme-pref') === 'dark' ? 'dark' : 'light';
    render();

    if (firebaseEnabled && db) {
      db.ref('users/' + userId).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          data = val;
          if(!data.items) data.items = [];
          if(!data.comments) data.comments = {};
          if(!data.chargeRoutines) data.chargeRoutines = [];
          if(!data.drainRoutines) data.drainRoutines = data.routines || [];
          if(!data.chargeCustomIconKeys) data.chargeCustomIconKeys = [];
          if(!data.chargeHiddenIconKeys) data.chargeHiddenIconKeys = [];
          if(!data.chargeCustomLabels) data.chargeCustomLabels = {};
          if(!data.drainCustomIconKeys) data.drainCustomIconKeys = [];
          if(!data.drainHiddenIconKeys) data.drainHiddenIconKeys = [];
          if(!data.drainCustomLabels) data.drainCustomLabels = {};
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          render();
        }
      });
    }
  }

  async function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    if (firebaseEnabled && db) {
      try {
        await db.ref('users/' + userId).set(data);
      } catch(e) {
        console.error('Firebase 저장 실패:', e);
      }
    }
  }

  function typePillMarkup(type){
    const n = type === 'heal' ? '+1' : '−1';
    const word = type === 'heal' ? 'Charge' : 'Drain';
    return `<span class="type-pill${type==='plan'?' plan':''}">${word} ${n}</span>`;
  }

  // ==========================================
  // 3) Progress 탭 (캘린더 + 상위 3-5개 비율 통계)
  // ==========================================
  function renderProgressTab(){
    const { healDone, planDone } = totalCounts();
    const streak = currentStreak();
    const cursor = progressMonthCursor;
    const year = cursor.getFullYear();
    const month = cursor.getMonth();
    const monthLabel = `${MONTHS_FULL[month]} ${year}`;
    const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}-`;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstDow = new Date(year, month, 1).getDay();
    const leadBlanks = (firstDow + 6) % 7;
    const todayStr = todayKey();

    const monthItems = data.items.filter(it => it.date.startsWith(monthPrefix));
    const monthNet = monthItems.reduce((s,it) => s + (it.type === 'heal' ? 1 : -1), 0);
    const monthCharge = monthItems.filter(it => it.type === 'heal').length;
    const monthDrain = monthItems.filter(it => it.type === 'plan').length;

    const weekDayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const weekdayRowHtml = weekDayLabels.map(d => `<span class="month-weekday-label">${d}</span>`).join('');

    let cellsHtml = '';
    for(let i = 0; i < leadBlanks; i++) cellsHtml += `<div class="month-cell empty"></div>`;

    for(let d = 1; d <= daysInMonth; d++){
      const key = `${monthPrefix}${String(d).padStart(2,'0')}`;
      const dayItems = data.items.filter(it => it.date === key);
      let dotClass = '';
      if(dayItems.length > 0){
        const net = dayItems.reduce((s,it) => s + (it.type === 'heal' ? 1 : -1), 0);
        dotClass = net >= 0 ? 'positive' : 'negative';
      }
      const isToday = key === todayStr ? ' today' : '';
      const isSelected = key === selectedProgressDay ? ' selected' : '';

      cellsHtml += `
        <div class="month-cell${isToday}${isSelected}" data-daykey="${key}">
          <span class="month-daynum">${d}</span>
          <span class="month-dot ${dotClass}"></span>
        </div>`;
    }

    let dayDetailHtml = '';
    if(selectedProgressDay){
      const dItems = data.items.filter(it => it.date === selectedProgressDay);
      const dComment = data.comments[selectedProgressDay];
      const [yy,mm,dd] = selectedProgressDay.split('-').map(Number);
      const labelDate = new Date(yy,mm-1,dd);
      const dateLabel = `${DAY_NAMES_SHORT[labelDate.getDay()]}, ${MONTHS_SHORT[mm-1]} ${dd}`;

      const itemsHtml = dItems.length
        ? dItems.map(it => `
            <div class="day-detail-item">
              ${typePillMarkup(it.type)}
              <span>${escapeHtml(it.text)}</span>
            </div>`).join('')
        : `<p class="day-detail-empty">Nothing logged this day.</p>`;

      const commentHtml = dComment ? `<div class="day-detail-comment">${escapeHtml(dComment)}</div>` : '';

      dayDetailHtml = `
        <div class="day-detail">
          <div class="day-detail-title">${dateLabel} — What you did</div>
          ${itemsHtml}
          ${commentHtml}
        </div>`;
    }

    const targetType = (activeStatsTab === 'charge') ? 'heal' : 'plan';
    const filteredItems = data.items.filter(it => it.type === targetType);
    const totalCount = filteredItems.length;

    const countMap = {};
    filteredItems.forEach(it => {
      const name = it.text.trim();
      countMap[name] = (countMap[name] || 0) + 1;
    });

    const sortedStats = Object.keys(countMap)
      .map(name => ({
        name,
        count: countMap[name],
        pct: totalCount > 0 ? Math.round((countMap[name] / totalCount) * 100) : 0
      }))
      .sort((a,b) => b.count - a.count)
      .slice(0, 5);

    const statsContentHtml = sortedStats.length
      ? sortedStats.map(item => `
          <div class="stat-row">
            <div class="stat-label-row">
              <span>${escapeHtml(item.name)} <span style="font-size:11px; color:var(--muted);">(${item.count}회)</span></span>
              <span class="stat-pct">${item.pct}%</span>
            </div>
            <div class="stat-bar-track">
              <div class="stat-bar-fill" style="width:${item.pct}%;"></div>
            </div>
          </div>
        `).join('')
      : `<p class="day-detail-empty" style="text-align:center; padding:12px 0;">No ${activeStatsTab} activities logged yet.</p>`;

    return `
      <div class="progress-summary-bar">
        <span class="sub-counts">+Charge: ${healDone} · −Drain: ${planDone}</span>
        <div class="streak-row">
          <span class="streak-value">${streak}</span>
          <span class="streak-label">day streak</span>
        </div>
      </div>

      <div class="progress-calendar-head">
        <div>
          <div class="section-title" style="margin-bottom:4px;">Calendar</div>
          <div class="progress-calendar-nav">
            <button class="nav-btn" id="progress-prev-month">‹</button>
            <span class="month-current">${monthLabel}</span>
            <button class="nav-btn" id="progress-next-month">›</button>
          </div>
        </div>
        <div class="progress-calendar-net">
          ${monthNet >= 0 ? '+' : ''}${monthNet} &nbsp; (+${monthCharge}/−${monthDrain})
        </div>
      </div>

      <div class="month-weekday-row">${weekdayRowHtml}</div>
      <div class="month-grid">${cellsHtml}</div>
      ${dayDetailHtml}

      <div class="stats-section">
        <p class="section-title">Top Activity Breakdown</p>
        <div class="stats-toggle-row">
          <button class="stats-tab-btn${activeStatsTab==='charge'?' active':''}" data-stats-tab="charge">⚡ Top +Charge</button>
          <button class="stats-tab-btn${activeStatsTab==='drain'?' active':''}" data-stats-tab="drain">📋 Top −Drain</button>
        </div>
        <div class="stats-box">
          ${statsContentHtml}
        </div>
      </div>
    `;
  }

  function render(){
    applyTheme();
    const syncStatusHtml = firebaseEnabled
      ? `<span class="sync-badge online" title="Sync On">☁ Sync</span>`
      : `<span class="sync-badge" title="Local Only">Local</span>`;

    root.innerHTML = `
      <div class="top-bar">
        <div class="top-left">
          <p class="eyebrow">CARU</p>
          ${syncStatusHtml}
        </div>
        <button class="theme-toggle" id="theme-toggle">${theme === 'dark' ? 'Light' : 'Dark'}</button>
      </div>
      <div class="tabs">
        <button class="tab-btn${activeTab==='charge'?' active':''}" data-tab="charge">+ Charge</button>
        <button class="tab-btn${activeTab==='drain'?' active':''}" data-tab="drain">− Drain</button>
        <button class="tab-btn${activeTab==='progress'?' active':''}" data-tab="progress">Progress</button>
      </div>
      ${activeTab === 'charge' ? renderChargeTab() : (activeTab === 'drain' ? renderDrainTab() : renderProgressTab())}
    `;
    bindEvents();
  }

  function bindEvents(){
    const themeBtn = document.getElementById('theme-toggle');
    if(themeBtn){
      themeBtn.addEventListener('click', async () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('caru-theme-pref', theme);
        render();
      });
    }

    root.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    });

    // ==========================================
    // 1) Charge 탭 이벤트
    // ==========================================
    if(activeTab === 'charge'){
      document.getElementById('charge-prev-week')?.addEventListener('click', () => {
        currentWeekMonday.setDate(currentWeekMonday.getDate() - 7);
        selectedChargeDate = dkeyFromDate(currentWeekMonday);
        render();
      });
      document.getElementById('charge-next-week')?.addEventListener('click', () => {
        currentWeekMonday.setDate(currentWeekMonday.getDate() + 7);
        selectedChargeDate = dkeyFromDate(currentWeekMonday);
        render();
      });

      root.querySelectorAll('[data-charge-day]').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedChargeDate = cell.dataset.chargeDay;
          render();
        });
      });

      // Charge 원형 체크박스 토글
      root.querySelectorAll('[data-action="toggle-charge-routine"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const rid = btn.dataset.routineId;
          const routine = (data.chargeRoutines || []).find(r => r.id === rid);
          if(!routine) return;

          const itemId = `rt_c_${routine.id}_${selectedChargeDate}`;
          const existingIndex = data.items.findIndex(it => it.id === itemId);

          if(existingIndex >= 0){
            data.items.splice(existingIndex, 1);
          } else {
            data.items.push({
              id: itemId,
              icon: routine.icon,
              type: 'heal',
              text: routine.text,
              date: selectedChargeDate
            });
          }
          render(); await save();
        });
      });

      // Charge 루틴 삭제
      root.querySelectorAll('[data-action="delete-charge-routine"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const rid = btn.dataset.routineId;
          data.chargeRoutines = (data.chargeRoutines || []).filter(r => r.id !== rid);
          data.items = data.items.filter(it => !it.id.startsWith(`rt_c_${rid}_`));
          render(); await save();
        });
      });

      root.querySelectorAll('[data-charge-word]').forEach(el => {
        el.addEventListener('click', () => {
          currentChargeIcon = el.dataset.chargeWord;
          render();
        });
      });

      document.getElementById('charge-edit-as-routine-btn')?.addEventListener('click', () => {
        chargeEditRoutineMode = !chargeEditRoutineMode;
        render();
      });

      document.getElementById('charge-icon-edit-btn')?.addEventListener('click', () => {
        chargeIconEditMode = !chargeIconEditMode;
        render();
      });

      async function addCustomChargeCat(){
        const catInput = document.getElementById('charge-cat-input');
        const name = (catInput?.value || '').trim();
        if(!name) return;
        const key = name.toLowerCase().replace(/\s+/g,'-');
        data.chargeCustomIconKeys = data.chargeCustomIconKeys || [];
        data.chargeCustomLabels = data.chargeCustomLabels || {};
        if(!data.chargeCustomIconKeys.includes(key)) data.chargeCustomIconKeys.push(key);
        data.chargeCustomLabels[key] = name;
        currentChargeIcon = key;
        await save(); render();
      }

      document.getElementById('charge-cat-add-btn')?.addEventListener('click', addCustomChargeCat);
      document.getElementById('charge-cat-input')?.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') { e.preventDefault(); addCustomChargeCat(); }
      });

      root.querySelectorAll('[data-remove-charge-word]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const key = btn.dataset.removeChargeWord;
          if(CHARGE_DEFAULT_KEYS.includes(key)){
            data.chargeHiddenIconKeys = data.chargeHiddenIconKeys || [];
            if(!data.chargeHiddenIconKeys.includes(key)) data.chargeHiddenIconKeys.push(key);
          }else{
            data.chargeCustomIconKeys = (data.chargeCustomIconKeys || []).filter(k => k !== key);
            if(data.chargeCustomLabels) delete data.chargeCustomLabels[key];
          }
          if(currentChargeIcon === key) currentChargeIcon = getChargeCategories()[0] || 'sleep';
          await save(); render();
        });
      });

      root.querySelectorAll('.day-pick-btn[data-charge-dow]').forEach(btn => {
        btn.addEventListener('click', () => {
          const dow = parseInt(btn.dataset.chargeDow, 10);
          if(selectedChargeRoutineDays.includes(dow)){
            if(selectedChargeRoutineDays.length > 1) {
              selectedChargeRoutineDays = selectedChargeRoutineDays.filter(d => d !== dow);
            }
          } else {
            selectedChargeRoutineDays.push(dow);
          }
          render();
        });
      });

      root.querySelectorAll('[data-charge-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.chargePreset;
          if(p === 'weekdays') selectedChargeRoutineDays = [1, 2, 3, 4, 5];
          else if(p === 'everyday') selectedChargeRoutineDays = [1, 2, 3, 4, 5, 6, 0];
          else if(p === 'weekends') selectedChargeRoutineDays = [6, 0];
          render();
        });
      });

      async function submitChargeTask(){
        const input = document.getElementById('charge-add-input');
        const text = (input ? input.value.trim() : '') || labelForCategory(currentChargeIcon, 'charge') || 'Recharge';
        
        const [yy, mm, dd] = selectedChargeDate.split('-').map(Number);
        const currentSelectedDow = new Date(yy, mm-1, dd).getDay();

        const targetDays = chargeEditRoutineMode ? [...selectedChargeRoutineDays] : [currentSelectedDow];

        data.chargeRoutines = data.chargeRoutines || [];
        data.chargeRoutines.push({
          id: 'rt_' + uid(),
          text,
          icon: currentChargeIcon,
          days: targetDays
        });

        newItemText = '';
        render(); await save();
      }

      document.getElementById('charge-submit-btn')?.addEventListener('click', submitChargeTask);
      const chargeInput = document.getElementById('charge-add-input');
      if(chargeInput){
        chargeInput.addEventListener('input', () => { newItemText = chargeInput.value; });
        chargeInput.addEventListener('keydown', async (e) => { if(e.key === 'Enter') await submitChargeTask(); });
      }

      const commentArea = document.getElementById('comment-textarea');
      if(commentArea){
        commentArea.addEventListener('blur', async () => {
          data.comments[selectedChargeDate] = commentArea.value;
          await save();
        });
      }
      return;
    }

    // ==========================================
    // 2) Drain 탭 이벤트
    // ==========================================
    if(activeTab === 'drain'){
      document.getElementById('drain-prev-week')?.addEventListener('click', () => {
        currentWeekMonday.setDate(currentWeekMonday.getDate() - 7);
        selectedDrainDate = dkeyFromDate(currentWeekMonday);
        render();
      });
      document.getElementById('drain-next-week')?.addEventListener('click', () => {
        currentWeekMonday.setDate(currentWeekMonday.getDate() + 7);
        selectedDrainDate = dkeyFromDate(currentWeekMonday);
        render();
      });

      root.querySelectorAll('[data-drain-day]').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedDrainDate = cell.dataset.drainDay;
          render();
        });
      });

      // Drain 사각 체크박스 토글
      root.querySelectorAll('[data-action="toggle-drain-routine"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const rid = btn.dataset.routineId;
          const routine = (data.drainRoutines || []).find(r => r.id === rid);
          if(!routine) return;

          const itemId = `rt_d_${routine.id}_${selectedDrainDate}`;
          const existingIndex = data.items.findIndex(it => it.id === itemId);

          if(existingIndex >= 0){
            data.items.splice(existingIndex, 1);
          } else {
            data.items.push({
              id: itemId,
              icon: routine.icon,
              type: 'plan',
              text: routine.text,
              date: selectedDrainDate
            });
          }
          render(); await save();
        });
      });

      // Drain 루틴 삭제
      root.querySelectorAll('[data-action="delete-drain-routine"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const rid = btn.dataset.routineId;
          data.drainRoutines = (data.drainRoutines || []).filter(r => r.id !== rid);
          data.items = data.items.filter(it => !it.id.startsWith(`rt_d_${rid}_`));
          render(); await save();
        });
      });

      root.querySelectorAll('[data-drain-word]').forEach(el => {
        el.addEventListener('click', () => {
          currentDrainIcon = el.dataset.drainWord;
          render();
        });
      });

      document.getElementById('drain-edit-as-routine-btn')?.addEventListener('click', () => {
        drainEditRoutineMode = !drainEditRoutineMode;
        render();
      });

      document.getElementById('drain-icon-edit-btn')?.addEventListener('click', () => {
        drainIconEditMode = !drainIconEditMode;
        render();
      });

      async function addCustomDrainCat(){
        const catInput = document.getElementById('drain-cat-input');
        const name = (catInput?.value || '').trim();
        if(!name) return;
        const key = name.toLowerCase().replace(/\s+/g,'-');
        data.drainCustomIconKeys = data.drainCustomIconKeys || [];
        data.drainCustomLabels = data.drainCustomLabels || {};
        if(!data.drainCustomIconKeys.includes(key)) data.drainCustomIconKeys.push(key);
        data.drainCustomLabels[key] = name;
        currentDrainIcon = key;
        await save(); render();
      }

      document.getElementById('drain-cat-add-btn')?.addEventListener('click', addCustomDrainCat);
      document.getElementById('drain-cat-input')?.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') { e.preventDefault(); addCustomDrainCat(); }
      });

      root.querySelectorAll('[data-remove-drain-word]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const key = btn.dataset.removeDrainWord;
          if(DRAIN_DEFAULT_KEYS.includes(key)){
            data.drainHiddenIconKeys = data.drainHiddenIconKeys || [];
            if(!data.drainHiddenIconKeys.includes(key)) data.drainHiddenIconKeys.push(key);
          }else{
            data.drainCustomIconKeys = (data.drainCustomIconKeys || []).filter(k => k !== key);
            if(data.drainCustomLabels) delete data.drainCustomLabels[key];
          }
          if(currentDrainIcon === key) currentDrainIcon = getDrainCategories()[0] || 'brief';
          await save(); render();
        });
      });

      root.querySelectorAll('.day-pick-btn[data-drain-dow]').forEach(btn => {
        btn.addEventListener('click', () => {
          const dow = parseInt(btn.dataset.drainDow, 10);
          if(selectedDrainRoutineDays.includes(dow)){
            if(selectedDrainRoutineDays.length > 1) {
              selectedDrainRoutineDays = selectedDrainRoutineDays.filter(d => d !== dow);
            }
          } else {
            selectedDrainRoutineDays.push(dow);
          }
          render();
        });
      });

      root.querySelectorAll('[data-drain-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.drainPreset;
          if(p === 'weekdays') selectedDrainRoutineDays = [1, 2, 3, 4, 5];
          else if(p === 'everyday') selectedDrainRoutineDays = [1, 2, 3, 4, 5, 6, 0];
          else if(p === 'weekends') selectedDrainRoutineDays = [6, 0];
          render();
        });
      });

      async function submitDrainTask(){
        const input = document.getElementById('drain-add-input');
        const text = (input ? input.value.trim() : '') || labelForCategory(currentDrainIcon, 'drain') || 'Task';
        
        const [yy, mm, dd] = selectedDrainDate.split('-').map(Number);
        const currentSelectedDow = new Date(yy, mm-1, dd).getDay();

        const targetDays = drainEditRoutineMode ? [...selectedDrainRoutineDays] : [currentSelectedDow];

        data.drainRoutines = data.drainRoutines || [];
        data.drainRoutines.push({
          id: 'rt_' + uid(),
          text,
          icon: currentDrainIcon,
          days: targetDays
        });

        newItemText = '';
        render(); await save();
      }

      document.getElementById('drain-submit-btn')?.addEventListener('click', submitDrainTask);
      const drainInput = document.getElementById('drain-add-input');
      if(drainInput){
        drainInput.addEventListener('input', () => { newItemText = drainInput.value; });
        drainInput.addEventListener('keydown', async (e) => { if(e.key === 'Enter') await submitDrainTask(); });
      }
      return;
    }

    // ==========================================
    // 3) Progress 탭 이벤트
    // ==========================================
    if(activeTab === 'progress'){
      document.getElementById('progress-prev-month')?.addEventListener('click', () => {
        progressMonthCursor = new Date(progressMonthCursor.getFullYear(), progressMonthCursor.getMonth() - 1, 1);
        selectedProgressDay = null; render();
      });
      document.getElementById('progress-next-month')?.addEventListener('click', () => {
        progressMonthCursor = new Date(progressMonthCursor.getFullYear(), progressMonthCursor.getMonth() + 1, 1);
        selectedProgressDay = null; render();
      });
      root.querySelectorAll('[data-daykey]').forEach(cell => {
        if(cell.classList.contains('empty')) return;
        cell.addEventListener('click', () => {
          const key = cell.dataset.daykey;
          selectedProgressDay = (selectedProgressDay === key) ? null : key;
          render();
        });
      });

      root.querySelectorAll('[data-stats-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeStatsTab = btn.dataset.statsTab;
          render();
        });
      });
    }
  }

  load();
})();
</script>
</body>
</html>
