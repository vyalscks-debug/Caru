<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Caru" />
<meta name="theme-color" content="#fbfaf8" />
<title>Caru</title>

<!-- Firebase App & Database (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#151515; --paper:#fbfaf8; --muted:#8f8a82; --faint:#e4dfd6;
    --hover:#f2efe9; --band:#efece5; --divider:#e6e1d8;
  }
  html[data-theme="dark"]{
    --ink:#f3f1ec; --paper:#121110; --muted:#8a8378; --faint:#332f2a;
    --hover:#1d1b18; --band:#1e1c19; --divider:#2c2925;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; -webkit-font-smoothing:antialiased;
    transition:background 0.15s ease, color 0.15s ease;
  }
  #root{ 
    max-width:420px; margin:0 auto; 
    padding: calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 80px); 
    min-height:100vh; 
  }

  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .top-left{ display:flex; align-items:center; gap:8px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  .sync-badge{ font-family:'JetBrains Mono', monospace; font-size:9.5px; padding:2px 6px; border-radius:8px; border:1px solid var(--muted); color:var(--muted); }
  .sync-badge.online{ border-color:var(--ink); color:var(--ink); font-weight:600; }
  .theme-toggle{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:5px 11px; border-radius:12px; cursor:pointer; }
  .theme-toggle:hover{ background:var(--hover); }

  .tabs{ display:flex; gap:18px; margin-bottom:22px; border-bottom:1px solid var(--divider); }
  .tab-btn{ background:none; border:none; cursor:pointer; padding:0 0 10px; font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:0.05em; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); font-weight:600; }

  .today-prev-inline{display:inline-block;border:0;background:none;color:inherit;font:inherit;font-weight:700;font-size:22px;line-height:1;padding:0 7px 0 0;margin:0;cursor:pointer;vertical-align:2px;-webkit-appearance:none;appearance:none;}
  .date-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:26px; letter-spacing:-0.01em; margin:0 0 4px; }
  .frac{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .mini-balance{ font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--muted); margin-bottom:16px; }

  .list{ list-style:none; margin:0 0 4px; padding:0; }
  .item{ display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid var(--divider); }
  .type-pill{
    flex:none; font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:10px; border:1.3px solid var(--ink); color:var(--ink); background:transparent;
    white-space:nowrap;
  }
  .type-pill.plan{ background:var(--ink); color:var(--paper); }
  .item-text{ flex:1; font-size:15px; line-height:1.4; word-break:break-word; }
  .del-btn{ flex:none; width:24px; height:24px; border:none; background:none; color:var(--muted); font-size:18px; cursor:pointer; line-height:1; }
  .del-btn:hover{ color:var(--ink); }

  .item-empty{ padding:26px 2px; color:var(--muted); font-size:13.5px; text-align:center; }

  .add-block{ margin-top:18px; padding-top:18px; border-top:1px solid var(--ink); }
  .comment-block{ margin-top:16px; }
  .main-note{ margin:6px 0 18px; }
  
  /* Daily Note 박스 축소 */
  .main-note .comment-textarea{ min-height:48px; height:48px; font-size:13.5px; padding:9px 12px; }
  .comment-textarea{
    width:100%; border:1.3px solid var(--ink); border-radius:10px;
    font-family:'Inter', sans-serif; line-height:1.4;
    color:var(--ink); background:var(--paper); resize:none; outline:none;
  }
  .comment-textarea::placeholder{ color:var(--muted); }
  .picker-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }

  /* 카테고리 칩: 검은색(#000000) 테두리 */
  .word-grid{
    display:flex; flex-wrap:wrap; gap:6px 7px; margin-bottom:14px;
    align-items:center;
  }
  .word-item{
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    padding:6px 10px; 
    border:1.5px solid #000000;
    border-radius:6px;
    background:transparent; cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-size:12px; letter-spacing:.01em;
    color:var(--muted); text-align:center; transition:all .15s ease;
  }
  .word-item.active{
    background:var(--ink); color:var(--paper); border-color:var(--ink);
  }
  .word-item:hover{ border-color:var(--ink); color:var(--ink); }

  .word-item-remove{
    position:absolute; top:-5px; right:-4px; width:16px; height:16px; border-radius:50%;
    background:var(--ink); color:var(--paper); border:1px solid var(--paper); font-size:9px;
    line-height:14px; text-align:center; cursor:pointer; padding:0;
  }

  .add-row{ display:flex; align-items:center; gap:10px; }
  .add-input{ flex:1; border:none; outline:none; font-family:'Inter', sans-serif; font-size:15px; background:transparent; color:var(--ink); border-bottom:1.3px solid var(--ink); padding:6px 0; border-radius:0; }
  .add-input::placeholder{ color:var(--muted); }
  .add-submit-btn{ flex:none; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:11px; padding:9px 16px; border-radius:16px; cursor:pointer; }

  .single-charge-btn{
    width:100%; border:1.3px solid var(--ink); background:var(--ink); color:var(--paper);
    font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:600;
    padding:12px 10px; border-radius:12px; cursor:pointer; margin-top:14px;
    transition:opacity .15s, transform .1s;
  }
  .single-charge-btn:active{ transform:scale(0.98); opacity:0.9; }

  /* Weekly Routine 전용 스타일 */
  .week-nav-bar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
  }
  .week-nav-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  .week-grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin-bottom:18px;
  }
  .week-cell{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px 2px; border:1px solid var(--divider); border-radius:10px;
    background:var(--paper); cursor:pointer; transition:all .15s;
  }
  .week-cell.today{ border-color:var(--muted); }
  .week-cell.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600; }
  .week-cell.active .week-dow{ color:var(--paper); opacity:0.8; }
  .week-dow{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--muted); margin-bottom:2px; }
  .week-daynum{ font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600; }
  .week-dot-count{ font-size:9.5px; font-family:'JetBrains Mono', monospace; margin-top:2px; }

  .drain-item{
    display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid var(--divider);
  }
  .drain-check-btn{
    width:22px; height:22px; border-radius:6px; border:1.5px solid var(--ink);
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:12px; padding:0; color:transparent; transition:all .12s;
  }
  .drain-item.done .drain-check-btn{ background:var(--ink); color:var(--paper); font-weight:700; }
  .drain-text{ flex:1; font-size:15px; line-height:1.4; word-break:break-word; }
  .drain-item.done .drain-text{ text-decoration:line-through; color:var(--muted); }

  /* 요일 반복 선택 바 (Mon ~ Sun) */
  .days-picker-row{ display:flex; gap:5px; margin-bottom:8px; }
  .day-pick-btn{
    flex:1; padding:7px 2px; border:1.5px solid #000000; border-radius:6px;
    background:transparent; cursor:pointer; font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:600; color:var(--muted); text-align:center; transition:all .12s;
  }
  .day-pick-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  
  .presets-row{ display:flex; gap:12px; margin-bottom:14px; }
  .preset-link{
    background:none; border:none; padding:0; font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:.02em; color:var(--muted); text-decoration:underline;
    cursor:pointer; text-underline-offset:2px;
  }
  .preset-link:hover{ color:var(--ink); }

  .routine-badge{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--muted);
    border:1px solid var(--divider); padding:1px 5px; border-radius:6px; margin-left:6px;
  }

  /* Progress 탭 스타일 */
  .balance-banner{ border:1px solid var(--ink); border-radius:14px; padding:18px; margin-bottom:20px; background:var(--band); }
  .balance-banner .label{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .balance-banner .value{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:40px; letter-spacing:-0.01em; color:var(--ink); }
  .balance-banner .note{ font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .sub-counts{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }

  .streak-row{ display:flex; align-items:baseline; gap:8px; margin:18px 0 22px; }
  .streak-value{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; color:var(--ink); }
  .streak-label{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); }

  .section-title{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
  .nav-btn{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:4px 9px; border-radius:8px; cursor:pointer; }

  .month-weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .month-weekday-label{ font-family:'JetBrains Mono', monospace; font-size:8.5px; color:var(--muted); text-transform:uppercase; text-align:center; }
  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:2px; }
  .month-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    border:1px solid transparent; border-radius:9px; cursor:pointer; background:var(--paper); transition:background .12s;
  }
  .month-cell.empty{ cursor:default; }
  .month-cell:not(.empty):hover{ background:var(--hover); }
  .month-cell.selected{ background:var(--band); border-color:var(--ink); }
  .day-detail{ margin-top:18px; border:1px solid var(--ink); border-radius:14px; padding:16px; }
  .day-detail-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; margin-bottom:10px; }
  .day-detail-item{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px; }
  .day-detail-comment{ margin-top:10px; padding-top:10px; border-top:1px solid var(--divider); font-size:13.5px; line-height:1.5; color:var(--ink); white-space:pre-wrap; }
  .day-detail-empty{ color:var(--muted); font-size:13px; }
  .month-daynum{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink); }
  .month-dot{ width:6px; height:6px; border-radius:50%; border:1.2px solid var(--faint); }
  .month-dot.positive{ background:var(--ink); border-color:var(--ink); }
  .month-dot.negative{ background:transparent; border-color:var(--ink); }
  .month-cell.today{ border-color:var(--ink); }
  .month-cell.today .month-daynum{ color:var(--ink); font-weight:700; }

  .progress-calendar-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin:24px 0 12px;
  }
  .progress-calendar-nav{ display:flex; align-items:center; gap:4px; margin-bottom:10px; }
  .progress-calendar-nav .nav-btn{
    border:0; background:none; color:inherit; font:inherit; font-weight:700;
    font-size:20px; line-height:1; padding:0 5px; margin:0; cursor:pointer;
    -webkit-appearance:none; appearance:none;
  }
  .progress-calendar-nav .month-current{
    font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600;
    letter-spacing:-.02em; margin:0 2px;
  }

  .edit-icons-btn{
    border:0; background:none; color:var(--ink); padding:0; margin:0 0 12px 1px;
    font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700;
    line-height:1; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .edit-icons-btn.active{ text-decoration:underline; text-underline-offset:3px; }
  .status{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); text-align:center; padding:60px 0; }
  .icon-search-row{ display:flex; gap:8px; margin-bottom:10px; }
  .icon-search-row .add-input{ border:1.3px solid var(--faint); border-radius:10px; padding:9px 12px; }
  .icon-search-row .add-input:focus{ border-color:var(--ink); }
</style>
</head>
<body>
<div id="root"><div class="status">Loading…</div></div>

<script>
(function(){
  // ==========================================
  // ⚙️ Firebase 설정
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyCitVETsMx-5ax48t4UViBT8DyIMOiB0sM",
    authDomain: "zero-3dfef.firebaseapp.com",
    databaseURL: "https://zero-3dfef-default-rtdb.firebaseio.com",
    projectId: "zero-3dfef",
    storageBucket: "zero-3dfef.firebasestorage.app",
    messagingSenderId: "59219649844",
    appId: "1:59219649844:web:38546f1960e27abac83161",
    measurementId: "G-VDFG7XTY64"
  };

  let userId = localStorage.getItem('caru_device_user_id');
  if (!userId) {
    userId = 'usr_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
    localStorage.setItem('caru_device_user_id', userId);
  }

  let db = null;
  let firebaseEnabled = false;

  if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      firebaseEnabled = true;
    } catch(e) {
      console.warn("Firebase 연결 대기:", e);
    }
  }

  const STORAGE_KEY = 'caru_data_' + userId;
  const root = document.getElementById('root');
  const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAY_NAMES_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  // 주간 순서: 월(1) ~ 일(0)
  const WEEKDAY_ORDER = [1, 2, 3, 4, 5, 6, 0];

  const ICON_KEYS = ['run','book','cook','music','sleep','brief','brush','broom','pill','pencil','home','heart','users','car','tv','shirt'];
  const ICON_LABELS = {
    run:'Exercise', book:'Study', cook:'Cooking', music:'Music', sleep:'Sleep',
    brief:'Work', brush:'Hobby', broom:'Chores', pill:'Medicine', pencil:'Journal',
    heart:'Self-care', users:'Hang out', car:'Commute', tv:'Watch', shirt:'Laundry'
  };

  function labelForIcon(key){
    if(data.customLabels && data.customLabels[key]) return data.customLabels[key];
    if(ICON_LABELS[key]) return ICON_LABELS[key];
    return key.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
  function allIconKeys(){
    const hidden = data.hiddenIconKeys || [];
    return ICON_KEYS.filter(k => !hidden.includes(k)).concat(data.customIconKeys || []);
  }

  function dkeyFromDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return dkeyFromDate(new Date()); }
  function todayLabel(){
    const d = selectedTodayDate;
    return `${DAY_NAMES_SHORT[d.getDay()]}, ${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`;
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    const mon = new Date(date.setDate(diff));
    mon.setHours(0,0,0,0);
    return mon;
  }

  let data = { items: [], comments: {}, customIconKeys: [], hiddenIconKeys: [], customLabels: {}, routines: [] };
  let theme = 'light';
  let activeTab = 'charge';
  let newItemIcon = ICON_KEYS[0];
  let newItemText = '';
  let iconEditMode = false;
  let routineManageMode = false;

  // 루틴 생성 시 선택된 요일들 (기본: 월-금 평일 매일)
  let selectedRoutineDays = [1, 2, 3, 4, 5];

  // Charge 탭 날짜
  let selectedTodayDate = new Date();
  selectedTodayDate.setHours(0,0,0,0);

  // Drain 주간 탭 기준 날짜
  let drainWeekMonday = getMonday(new Date());
  let selectedDrainDate = dkeyFromDate(new Date());

  // Progress 달력 날짜
  let progressMonthCursor = new Date();
  progressMonthCursor.setHours(0,0,0,0);
  progressMonthCursor.setDate(1);
  let selectedProgressDay = null;

  function applyTheme(){
    if(theme === 'dark') {
      document.documentElement.setAttribute('data-theme','dark');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#121110');
    } else {
      document.documentElement.removeAttribute('data-theme');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#fbfaf8');
    }
  }

  function todayChargeItems(){
    return data.items.filter(it => it.date === dkeyFromDate(selectedTodayDate) && it.type === 'heal');
  }

  function currentStreak(){
    let streak = 0;
    let cursor = new Date();
    while(true){
      const key = dkeyFromDate(cursor);
      const dayItems = data.items.filter(it => it.date === key);
      if(dayItems.length === 0) break;
      const net = dayItems.reduce((s, it) => s + (it.type === 'heal' ? 1 : -1), 0);
      if(net < 0) break;
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function totalBalance(){
    let balance = 0, healDone = 0, planDone = 0;
    data.items.forEach(it => {
      if(it.type === 'heal'){ balance += 1; healDone += 1; }
      else { balance -= 1; planDone += 1; }
    });
    return { balance, healDone, planDone };
  }

  async function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : { items: [], comments: {}, customIconKeys: [], hiddenIconKeys: [], customLabels: {}, routines: [] };
    }catch(e){ data = { items: [], comments: {}, customIconKeys: [], hiddenIconKeys: [], customLabels: {}, routines: [] }; }
    
    if(!data.items) data.items = [];
    if(!data.comments) data.comments = {};
    if(!data.customIconKeys) data.customIconKeys = [];
    if(!data.hiddenIconKeys) data.hiddenIconKeys = [];
    if(!data.customLabels) data.customLabels = {};
    if(!data.routines) {
      // 초기 기본 루틴 예시 제공
      data.routines = [
        { id: 'rt_commute', text: 'Commute', icon: 'car', days: [1,2,3,4,5] }
      ];
    }

    theme = localStorage.getItem('caru-theme-pref') === 'dark' ? 'dark' : 'light';
    render();

    if (firebaseEnabled && db) {
      db.ref('users/' + userId).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          data = val;
          if(!data.items) data.items = [];
          if(!data.comments) data.comments = {};
          if(!data.customIconKeys) data.customIconKeys = [];
          if(!data.hiddenIconKeys) data.hiddenIconKeys = [];
          if(!data.customLabels) data.customLabels = {};
          if(!data.routines) data.routines = [];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          render();
        }
      });
    }
  }

  async function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    if (firebaseEnabled && db) {
      try {
        await db.ref('users/' + userId).set(data);
      } catch(e) {
        console.error('Firebase 저장 실패:', e);
      }
    }
  }

  function typePillMarkup(type){
    const n = type === 'heal' ? '+1' : '−1';
    const word = type === 'heal' ? 'Charge' : 'Drain';
    return `<span class="type-pill${type==='plan'?' plan':''}">${word} ${n}</span>`;
  }

  // 1) Charge 탭
  function renderChargeTab(){
    const items = todayChargeItems();
    const { balance } = totalBalance();

    const listHtml = items.length
      ? items.map(it => `
          <li class="item" data-id="${it.id}">
            ${typePillMarkup(it.type)}
            <span class="item-text">${escapeHtml(it.text)}</span>
            <button class="del-btn" data-action="delete" data-id="${it.id}">×</button>
          </li>`).join('')
      : `<li class="item-empty">No charge logged today. Add something recharging below!</li>`;

    const pickerKeys = allIconKeys();
    const wordGridHtml = pickerKeys.map(key => `
      <div class="word-item${key===newItemIcon?' active':''}" data-wordkey="${key}">
        <span>${escapeHtml(labelForIcon(key))}</span>
        ${iconEditMode ? `<button class="word-item-remove" data-removeword="${key}" title="Remove">×</button>` : ''}
      </div>`).join('');

    return `
      <h1 class="date-title">
        <button class="today-prev-inline" id="today-prev-day" aria-label="Previous day">‹</button>${todayLabel()}${dkeyFromDate(selectedTodayDate) !== dkeyFromDate(new Date()) ? '<button class="today-prev-inline" id="today-present" aria-label="Next day" style="margin-left:8px;">›</button>' : ''}
      </h1>
      <p class="frac">${items.length} charged today</p>
      <p class="mini-balance">Balance: ${balance >= 0 ? '+' : ''}${balance}</p>
      
      <div class="comment-block main-note">
        <div class="picker-label">Daily note</div>
        <textarea class="comment-textarea" id="comment-textarea" placeholder="How did today go?">${escapeHtml(data.comments[dkeyFromDate(selectedTodayDate)] || '')}</textarea>
      </div>

      <ul class="list">${listHtml}</ul>

      <div class="add-block">
        <div class="picker-label">Category</div>
        <div class="word-grid">${wordGridHtml}</div>
        <button class="edit-icons-btn${iconEditMode ? ' active' : ''}" id="icon-edit-toggle-btn">Edit Categories</button>
        ${iconEditMode ? `
          <div class="icon-search-row">
            <input class="add-input" id="icon-search-input" type="text" placeholder="Add custom category…" />
            <button class="add-submit-btn" id="icon-search-btn">Add</button>
          </div>
        ` : ''}
        <div class="add-row">
          <input class="add-input" id="add-input" type="text" placeholder="What energized you?" value="${escapeHtml(newItemText)}" />
        </div>
        <button class="single-charge-btn" id="charge-submit-btn">+ Charge (+1)</button>
      </div>
    `;
  }

  // 2) Drain 탭 (Weekly Routine 플래너)
  function renderDrainTab(){
    const days = [];
    for(let i = 0; i < 7; i++){
      const d = new Date(drainWeekMonday);
      d.setDate(d.getDate() + i);
      days.push(d);
    }

    const startStr = `${MONTHS_SHORT[days[0].getMonth()]} ${days[0].getDate()}`;
    const endStr = `${MONTHS_SHORT[days[6].getMonth()]} ${days[6].getDate()}`;
    const currentTodayStr = todayKey();

    // 상단 7개 요일 바
    const weekGridHtml = days.map(d => {
      const dkey = dkeyFromDate(d);
      const dow = d.getDay(); // 0~6
      const isSelected = (dkey === selectedDrainDate);
      const isToday = (dkey === currentTodayStr);

      // 해당 요일에 배정된 루틴들
      const scheduledRoutines = (data.routines || []).filter(r => (r.days || []).includes(dow));
      const doneCount = scheduledRoutines.filter(r => {
        const itemId = `rt_${r.id}_${dkey}`;
        return data.items.some(it => it.id === itemId);
      }).length;

      return `
        <div class="week-cell${isSelected ? ' active' : ''}${isToday ? ' today' : ''}" data-drain-day="${dkey}">
          <span class="week-dow">${DAY_NAMES_SHORT[dow]}</span>
          <span class="week-daynum">${d.getDate()}</span>
          <span class="week-dot-count">${scheduledRoutines.length ? `${doneCount}/${scheduledRoutines.length}` : '·'}</span>
        </div>
      `;
    }).join('');

    // 현재 선택된 날짜의 요일 구하기
    const [yy, mm, dd] = selectedDrainDate.split('-').map(Number);
    const selectedDateObj = new Date(yy, mm-1, dd);
    const selectedDow = selectedDateObj.getDay();
    const selectedDateTitle = `${DAY_NAMES_SHORT[selectedDow]}, ${MONTHS_SHORT[mm-1]} ${dd}`;

    // 선택된 요일에 해당하는 루틴 목록
    const dayRoutines = (data.routines || []).filter(r => (r.days || []).includes(selectedDow));

    const routinesListHtml = dayRoutines.length
      ? dayRoutines.map(r => {
          const itemId = `rt_${r.id}_${selectedDrainDate}`;
          const isDone = data.items.some(it => it.id === itemId);
          return `
            <li class="drain-item${isDone ? ' done' : ''}" data-routine-id="${r.id}">
              <button class="drain-check-btn" data-action="toggle-routine" data-routine-id="${r.id}">
                ${isDone ? '✓' : ''}
              </button>
              <span class="drain-text">${escapeHtml(r.text)}</span>
            </li>
          `;
        }).join('')
      : `<li class="item-empty">No routines scheduled for ${DAY_NAMES_SHORT[selectedDow]}.<br>Add a weekly routine below!</li>`;

    // 등록된 모든 루틴 관리 목록
    const allRoutinesManageHtml = (data.routines || []).length
      ? (data.routines || []).map(r => {
          const daysLabel = (r.days || []).map(d => DAY_NAMES_SHORT[d]).join(', ');
          return `
            <li class="item" style="padding:10px 2px;">
              <span class="item-text" style="font-size:14px; font-weight:500;">
                ${escapeHtml(r.text)}
                <span class="routine-badge">${daysLabel}</span>
              </span>
              <button class="del-btn" data-action="delete-routine" data-routine-id="${r.id}">×</button>
            </li>
          `;
        }).join('')
      : `<li class="item-empty">No routines added yet.</li>`;

    const pickerKeys = allIconKeys();
    const wordGridHtml = pickerKeys.map(key => `
      <div class="word-item${key===newItemIcon?' active':''}" data-wordkey="${key}">
        <span>${escapeHtml(labelForIcon(key))}</span>
      </div>`).join('');

    // 요일 토글 버튼 렌더링 (Mon ~ Sun)
    const dayButtonsHtml = WEEKDAY_ORDER.map(dow => {
      const isPick = selectedRoutineDays.includes(dow);
      return `<button type="button" class="day-pick-btn${isPick ? ' active' : ''}" data-dow="${dow}">${DAY_NAMES_SHORT[dow]}</button>`;
    }).join('');

    return `
      <div class="week-nav-bar">
        <button class="nav-btn" id="drain-prev-week">‹</button>
        <span class="week-nav-title">${startStr} – ${endStr}</span>
        <button class="nav-btn" id="drain-next-week">›</button>
      </div>

      <div class="week-grid">${weekGridHtml}</div>

      <h2 class="date-title" style="font-size:20px; margin-bottom:12px;">${selectedDateTitle}</h2>
      <ul class="list">${routinesListHtml}</ul>

      <div class="add-block">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div class="picker-label" style="margin-bottom:0;">Add Weekly Routine</div>
          <button class="edit-icons-btn${routineManageMode ? ' active' : ''}" id="routine-manage-btn" style="margin:0; font-size:11px;">
            ${routineManageMode ? 'Done Editing' : 'Manage All Routines'}
          </button>
        </div>

        ${routineManageMode ? `
          <div style="margin-bottom:18px; border:1px solid var(--divider); border-radius:10px; padding:10px;">
            <p class="picker-label">All Recurring Routines</p>
            <ul class="list">${allRoutinesManageHtml}</ul>
          </div>
        ` : ''}

        <div class="picker-label">Repeat on (Select Days)</div>
        <div class="days-picker-row">${dayButtonsHtml}</div>
        <div class="presets-row">
          <button class="preset-link" data-preset="weekdays">Weekdays (Mon–Fri)</button>
          <button class="preset-link" data-preset="everyday">Everyday (All 7)</button>
          <button class="preset-link" data-preset="weekends">Weekends (Sat–Sun)</button>
        </div>

        <div class="picker-label">Routine Category</div>
        <div class="word-grid">${wordGridHtml}</div>

        <div class="add-row">
          <input class="add-input" id="routine-add-input" type="text" placeholder="e.g. Commute, Gym, Study…" value="${escapeHtml(newItemText)}" />
        </div>
        <button class="single-charge-btn" id="routine-submit-btn" style="background:var(--paper); color:var(--ink);">+ Add Weekly Routine</button>
      </div>
    `;
  }

  // 3) Progress 탭 (Calendar & History)
  function renderProgressTab(){
    const { balance, healDone, planDone } = totalBalance();
    const streak = currentStreak();
    const cursor = progressMonthCursor;
    const year = cursor.getFullYear();
    const month = cursor.getMonth();
    const monthLabel = `${MONTHS_FULL[month]} ${year}`;
    const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}-`;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstDow = new Date(year, month, 1).getDay();
    const leadBlanks = (firstDow + 6) % 7;
    const todayStr = todayKey();

    const monthItems = data.items.filter(it => it.date.startsWith(monthPrefix));
    const monthNet = monthItems.reduce((s,it) => s + (it.type === 'heal' ? 1 : -1), 0);
    const monthCharge = monthItems.filter(it => it.type === 'heal').length;
    const monthDrain = monthItems.filter(it => it.type === 'plan').length;

    const weekDayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const weekdayRowHtml = weekDayLabels.map(d => `<span class="month-weekday-label">${d}</span>`).join('');

    let cellsHtml = '';
    for(let i = 0; i < leadBlanks; i++) cellsHtml += `<div class="month-cell empty"></div>`;

    for(let d = 1; d <= daysInMonth; d++){
      const key = `${monthPrefix}${String(d).padStart(2,'0')}`;
      const dayItems = data.items.filter(it => it.date === key);
      let dotClass = '';
      if(dayItems.length > 0){
        const net = dayItems.reduce((s,it) => s + (it.type === 'heal' ? 1 : -1), 0);
        dotClass = net >= 0 ? 'positive' : 'negative';
      }
      const isToday = key === todayStr ? ' today' : '';
      const isSelected = key === selectedProgressDay ? ' selected' : '';

      cellsHtml += `
        <div class="month-cell${isToday}${isSelected}" data-daykey="${key}">
          <span class="month-daynum">${d}</span>
          <span class="month-dot ${dotClass}"></span>
        </div>`;
    }

    let dayDetailHtml = '';
    if(selectedProgressDay){
      const dItems = data.items.filter(it => it.date === selectedProgressDay);
      const dComment = data.comments[selectedProgressDay];
      const [yy,mm,dd] = selectedProgressDay.split('-').map(Number);
      const labelDate = new Date(yy,mm-1,dd);
      const dateLabel = `${DAY_NAMES_SHORT[labelDate.getDay()]}, ${MONTHS_SHORT[mm-1]} ${dd}`;

      const itemsHtml = dItems.length
        ? dItems.map(it => `
            <div class="day-detail-item">
              ${typePillMarkup(it.type)}
              <span>${escapeHtml(it.text)}</span>
            </div>`).join('')
        : `<p class="day-detail-empty">Nothing logged this day.</p>`;

      const commentHtml = dComment ? `<div class="day-detail-comment">${escapeHtml(dComment)}</div>` : '';

      dayDetailHtml = `
        <div class="day-detail">
          <div class="day-detail-title">${dateLabel} — What you did</div>
          ${itemsHtml}
          ${commentHtml}
        </div>`;
    }

    return `
      <div class="balance-banner">
        <div class="label">Remaining Balance</div>
        <div class="value">${balance >= 0 ? '+' : ''}${balance}</div>
        <div class="note">${balance >= 0 ? 'You have energy credit for your Drain routines.' : "You're in debt — do some Charge activities!"}</div>
      </div>
      <p class="sub-counts">Charge: ${healDone} · Drain: ${planDone} (all-time)</p>
      <div class="streak-row">
        <span class="streak-value">${streak}</span>
        <span class="streak-label">day${streak===1?'':'s'} streak</span>
      </div>

      <div class="progress-calendar-head">
        <div>
          <div class="section-title" style="margin-bottom:4px;">Calendar</div>
          <div class="progress-calendar-nav">
            <button class="nav-btn" id="progress-prev-month">‹</button>
            <span class="month-current">${monthLabel}</span>
            <button class="nav-btn" id="progress-next-month">›</button>
          </div>
        </div>
        <div class="progress-calendar-net">
          ${monthNet >= 0 ? '+' : ''}${monthNet} &nbsp; (+${monthCharge}/−${monthDrain})
        </div>
      </div>

      <div class="month-weekday-row">${weekdayRowHtml}</div>
      <div class="month-grid">${cellsHtml}</div>
      ${dayDetailHtml}
    `;
  }

  function render(){
    applyTheme();
    const syncStatusHtml = firebaseEnabled
      ? `<span class="sync-badge online" title="Sync On">☁ Sync</span>`
      : `<span class="sync-badge" title="Local Only">Local</span>`;

    root.innerHTML = `
      <div class="top-bar">
        <div class="top-left">
          <p class="eyebrow">CARU</p>
          ${syncStatusHtml}
        </div>
        <button class="theme-toggle" id="theme-toggle">${theme === 'dark' ? 'Light' : 'Dark'}</button>
      </div>
      <div class="tabs">
        <button class="tab-btn${activeTab==='charge'?' active':''}" data-tab="charge">Charge</button>
        <button class="tab-btn${activeTab==='drain'?' active':''}" data-tab="drain">Drain</button>
        <button class="tab-btn${activeTab==='progress'?' active':''}" data-tab="progress">Progress</button>
      </div>
      ${activeTab === 'charge' ? renderChargeTab() : (activeTab === 'drain' ? renderDrainTab() : renderProgressTab())}
    `;
    bindEvents();
  }

  function bindEvents(){
    const themeBtn = document.getElementById('theme-toggle');
    if(themeBtn){
      themeBtn.addEventListener('click', async () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('caru-theme-pref', theme);
        render();
      });
    }

    root.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    });

    // 1) Charge 탭 이벤트
    if(activeTab === 'charge'){
      document.getElementById('today-prev-day')?.addEventListener('click', () => {
        selectedTodayDate.setDate(selectedTodayDate.getDate() - 1);
        render();
      });
      document.getElementById('today-present')?.addEventListener('click', () => {
        selectedTodayDate.setDate(selectedTodayDate.getDate() + 1);
        render();
      });

      root.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          data.items = data.items.filter(it => it.id !== btn.dataset.id);
          render(); await save();
        });
      });

      async function submitCharge(){
        const input = document.getElementById('add-input');
        const text = (input ? input.value.trim() : '') || labelForIcon(newItemIcon) || 'Recharge';
        data.items.push({ id: uid(), icon: newItemIcon, type: 'heal', text, date: dkeyFromDate(selectedTodayDate) });
        newItemText = '';
        render(); await save();
      }

      document.getElementById('charge-submit-btn')?.addEventListener('click', submitCharge);

      const input = document.getElementById('add-input');
      if(input){
        input.addEventListener('input', () => { newItemText = input.value; });
        input.addEventListener('keydown', async (e) => { if(e.key === 'Enter') await submitCharge(); });
      }

      root.querySelectorAll('[data-wordkey]').forEach(el => {
        el.addEventListener('click', () => {
          newItemIcon = el.dataset.wordkey;
          render();
        });
      });

      document.getElementById('icon-edit-toggle-btn')?.addEventListener('click', () => {
        iconEditMode = !iconEditMode; render();
      });

      async function addCustomCategory(){
        const catInput = document.getElementById('icon-search-input');
        const name = (catInput?.value || '').trim();
        if(!name) return;
        const key = name.toLowerCase().replace(/\s+/g,'-');
        data.customIconKeys = data.customIconKeys || [];
        data.customLabels = data.customLabels || {};
        if(!data.customIconKeys.includes(key)) data.customIconKeys.push(key);
        data.customLabels[key] = name;
        newItemIcon = key;
        await save(); render();
      }

      document.getElementById('icon-search-btn')?.addEventListener('click', addCustomCategory);
      document.getElementById('icon-search-input')?.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') { e.preventDefault(); addCustomCategory(); }
      });

      root.querySelectorAll('[data-removeword]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const key = btn.dataset.removeword;
          if(ICON_KEYS.includes(key)){
            if(!data.hiddenIconKeys.includes(key)) data.hiddenIconKeys.push(key);
          }else{
            data.customIconKeys = (data.customIconKeys || []).filter(k => k !== key);
            if(data.customLabels) delete data.customLabels[key];
          }
          if(newItemIcon === key) newItemIcon = allIconKeys()[0] || 'run';
          await save(); render();
        });
      });

      const commentArea = document.getElementById('comment-textarea');
      if(commentArea){
        commentArea.addEventListener('blur', async () => {
          data.comments[dkeyFromDate(selectedTodayDate)] = commentArea.value;
          await save();
        });
      }
      return;
    }

    // 2) Drain 탭 이벤트 (Weekly Routine)
    if(activeTab === 'drain'){
      document.getElementById('drain-prev-week')?.addEventListener('click', () => {
        drainWeekMonday.setDate(drainWeekMonday.getDate() - 7);
        selectedDrainDate = dkeyFromDate(drainWeekMonday);
        render();
      });
      document.getElementById('drain-next-week')?.addEventListener('click', () => {
        drainWeekMonday.setDate(drainWeekMonday.getDate() + 7);
        selectedDrainDate = dkeyFromDate(drainWeekMonday);
        render();
      });

      root.querySelectorAll('[data-drain-day]').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedDrainDate = cell.dataset.drainDay;
          render();
        });
      });

      // 루틴 완료 체크 토글 -> Progress 탭의 items(type: plan, Drain -1) 연동
      root.querySelectorAll('[data-action="toggle-routine"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const rid = btn.dataset.routineId;
          const routine = (data.routines || []).find(r => r.id === rid);
          if(!routine) return;

          const itemId = `rt_${routine.id}_${selectedDrainDate}`;
          const existingIndex = data.items.findIndex(it => it.id === itemId);

          if(existingIndex >= 0){
            // 이미 체크된 경우 취소
            data.items.splice(existingIndex, 1);
          } else {
            // 완료 처리: -1 Drain 항목으로 기록
            data.items.push({
              id: itemId,
              icon: routine.icon,
              type: 'plan',
              text: routine.text,
              date: selectedDrainDate
            });
          }
          render(); await save();
        });
      });

      // 요일 토글 버튼 클릭
      root.querySelectorAll('.day-pick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const dow = parseInt(btn.dataset.dow, 10);
          if(selectedRoutineDays.includes(dow)){
            if(selectedRoutineDays.length > 1) {
              selectedRoutineDays = selectedRoutineDays.filter(d => d !== dow);
            }
          } else {
            selectedRoutineDays.push(dow);
          }
          render();
        });
      });

      // 프리셋 링크
      root.querySelectorAll('[data-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.preset;
          if(p === 'weekdays') selectedRoutineDays = [1, 2, 3, 4, 5];
          else if(p === 'everyday') selectedRoutineDays = [1, 2, 3, 4, 5, 6, 0];
          else if(p === 'weekends') selectedRoutineDays = [6, 0];
          render();
        });
      });

      // 카테고리 칩 선택
      root.querySelectorAll('[data-wordkey]').forEach(el => {
        el.addEventListener('click', () => {
          newItemIcon = el.dataset.wordkey;
          render();
        });
      });

      // 새 루틴 추가
      async function submitRoutine(){
        const input = document.getElementById('routine-add-input');
        const text = (input ? input.value.trim() : '') || labelForIcon(newItemIcon) || 'Routine';
        data.routines = data.routines || [];
        data.routines.push({
          id: 'rt_' + uid(),
          text,
          icon: newItemIcon,
          days: [...selectedRoutineDays]
        });
        newItemText = '';
        render(); await save();
      }

      document.getElementById('routine-submit-btn')?.addEventListener('click', submitRoutine);
      const routineInput = document.getElementById('routine-add-input');
      if(routineInput){
        routineInput.addEventListener('input', () => { newItemText = routineInput.value; });
        routineInput.addEventListener('keydown', async (e) => { if(e.key === 'Enter') await submitRoutine(); });
      }

      // 루틴 전체 관리 모드 토글
      document.getElementById('routine-manage-btn')?.addEventListener('click', () => {
        routineManageMode = !routineManageMode;
        render();
      });

      // 루틴 삭제
      root.querySelectorAll('[data-action="delete-routine"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const rid = btn.dataset.routineId;
          data.routines = (data.routines || []).filter(r => r.id !== rid);
          // 연동된 완료 기록들도 함께 정리
          data.items = data.items.filter(it => !it.id.startsWith(`rt_${rid}_`));
          render(); await save();
        });
      });

      return;
    }

    // 3) Progress 탭 이벤트
    if(activeTab === 'progress'){
      document.getElementById('progress-prev-month')?.addEventListener('click', () => {
        progressMonthCursor = new Date(progressMonthCursor.getFullYear(), progressMonthCursor.getMonth() - 1, 1);
        selectedProgressDay = null; render();
      });
      document.getElementById('progress-next-month')?.addEventListener('click', () => {
        progressMonthCursor = new Date(progressMonthCursor.getFullYear(), progressMonthCursor.getMonth() + 1, 1);
        selectedProgressDay = null; render();
      });
      root.querySelectorAll('[data-daykey]').forEach(cell => {
        if(cell.classList.contains('empty')) return;
        cell.addEventListener('click', () => {
          const key = cell.dataset.daykey;
          selectedProgressDay = (selectedProgressDay === key) ? null : key;
          render();
        });
      });
    }
  }

  load();
})();
</script>
</body>
</html>
